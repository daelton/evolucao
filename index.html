<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Evolução</title>
<meta name="theme-color" content="#050918">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Evolução">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#050918; --bg2:#0a1638; --panel:rgba(10,24,62,.78); --line:#3b8fe6; --glow:#7fdcff; --soft:rgba(127,220,255,.10);
  --ink:#e8f3ff; --mute:#8ea7cc; --gold:#ffd166; --red:#ff5d73; --ok:#5ff0b0; --input:rgba(3,9,26,.75);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#eaf2fc; --bg2:#d5e5f8; --panel:rgba(255,255,255,.88); --line:#3a86d8; --glow:#1463bd; --soft:rgba(20,99,189,.08);
    --ink:#0b1a33; --mute:#50688c; --gold:#9a6200; --red:#c4213a; --ok:#0c8553; --input:#fff;
  }
}
:root[data-theme="dark"]{
  --bg:#050918; --bg2:#0a1638; --panel:rgba(10,24,62,.78); --line:#3b8fe6; --glow:#7fdcff; --soft:rgba(127,220,255,.10);
  --ink:#e8f3ff; --mute:#8ea7cc; --gold:#ffd166; --red:#ff5d73; --ok:#5ff0b0; --input:rgba(3,9,26,.75);
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:radial-gradient(130% 55% at 50% -5%,var(--bg2),var(--bg) 72%) fixed;background-color:var(--bg);
  color:var(--ink);font:400 16px/1.5 Barlow,system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
.app{max-width:520px;margin:0 auto;padding:12px 14px 100px}
.disp,h1,h2,h3{font-family:"Chakra Petch",Barlow,system-ui,sans-serif;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--glow);outline-offset:2px}
.mute{color:var(--mute);font-size:.88rem}
.hide{display:none!important}

/* Janela do Sistema */
.win{position:relative;background:var(--panel);border:1px solid color-mix(in srgb,var(--glow) 55%,transparent);
  margin:0 0 14px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  box-shadow:0 0 24px color-mix(in srgb,var(--glow) 16%,transparent),inset 0 0 30px color-mix(in srgb,var(--glow) 6%,transparent)}
.win>.bd{padding:14px}
.tab{display:flex;justify-content:center;margin-top:-1px}
.tab span{font:600 .95rem "Chakra Petch",sans-serif;color:var(--glow);padding:4px 16px;border:1px solid color-mix(in srgb,var(--glow) 55%,transparent);border-top:0;
  background:var(--soft);text-shadow:0 0 10px color-mix(in srgb,var(--glow) 60%,transparent)}
.win.red{border-color:var(--red);box-shadow:0 0 26px color-mix(in srgb,var(--red) 28%,transparent)}
.win.red .tab span{color:var(--red);border-color:var(--red);background:color-mix(in srgb,var(--red) 10%,transparent)}
.warn{font-size:.85rem;color:var(--red);margin:12px 0 0;text-align:center}

/* HUD */
.hud{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;padding:12px 14px}
.rank{width:58px;height:58px;display:grid;place-items:center;font:700 2.1rem/1 "Chakra Petch",sans-serif;color:var(--rk);
  border:2px solid var(--rk);text-shadow:0 0 14px var(--rk);box-shadow:inset 0 0 14px color-mix(in srgb,var(--rk) 25%,transparent)}
.lvrow{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.lvrow b{font:600 1.25rem "Chakra Petch",sans-serif}
.bar{height:7px;background:var(--input);border:1px solid color-mix(in srgb,var(--line) 45%,transparent);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--line),var(--glow));box-shadow:0 0 8px var(--glow);transition:width .6s}
.bar.red i{background:var(--red);box-shadow:none}

/* Linhas da missão */
.goal{font-size:.9rem;color:var(--mute);text-align:center;margin:0 0 10px}
.q{display:block;width:100%;background:none;border:0;border-bottom:1px dashed color-mix(in srgb,var(--line) 35%,transparent);padding:11px 2px;text-align:left}
.q:last-of-type{border-bottom:0}
.q .top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.q .nm{font-weight:600}
.q .pg{font:600 .95rem "Chakra Petch",sans-serif;color:var(--glow);white-space:nowrap}
.q .bar{margin-top:6px;height:4px}
.q.done .nm{color:var(--mute)}
.q.done .pg{color:var(--ok)}
.q.exc .pg{color:var(--mute)}
.q .sub{font-size:.8rem;color:var(--mute)}
.next{font-size:.85rem;color:var(--mute);margin-top:8px}

/* Botões */
.btn{background:transparent;color:var(--glow);border:1px solid var(--glow);padding:10px 16px;font:600 .95rem "Chakra Petch",sans-serif}
.btn:hover{background:var(--soft)}
.btn.solid{background:var(--line);border-color:var(--line);color:#fff}
.btn.red{color:var(--red);border-color:var(--red)}
.btn.ghost{border-color:transparent;color:var(--mute)}
.btn.full{width:100%}
.btn:disabled{opacity:.4;cursor:default}
.btns{display:grid;gap:8px;margin-top:14px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:.8rem;padding:4px 10px;border:1px solid color-mix(in srgb,var(--glow) 40%,transparent);background:var(--soft);color:var(--glow)}
.tag{font-size:.75rem;padding:1px 7px;border:1px solid color-mix(in srgb,var(--glow) 35%,transparent);color:var(--glow)}
.tag.g{color:var(--gold);border-color:color-mix(in srgb,var(--gold) 45%,transparent)}

/* Stepper */
.step{display:inline-flex;align-items:center;border:1px solid color-mix(in srgb,var(--line) 60%,transparent);background:var(--input)}
.step button{width:40px;height:40px;background:none;border:0;color:var(--glow);font:600 1.2rem "Chakra Petch",sans-serif}
.step input{width:58px;height:40px;text-align:center;background:none;border:0;color:var(--ink);font:600 1.05rem "Chakra Petch",sans-serif;-moz-appearance:textfield}
.step input::-webkit-inner-spin-button{display:none}
.step.sm button{width:30px;height:34px;font-size:1rem}.step.sm input{width:36px;height:34px;font-size:.95rem}
.ex{padding:12px 0;border-bottom:1px dashed color-mix(in srgb,var(--line) 35%,transparent)}
.ex:last-child{border-bottom:0}
.sets{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}

/* Formulários */
input,select{font:inherit;color:var(--ink);background:var(--input);border:1px solid color-mix(in srgb,var(--line) 55%,transparent);padding:9px 10px;min-width:0;width:100%}
.form{display:grid;gap:12px}
.form label{display:grid;gap:4px;font-size:.85rem;color:var(--mute)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.days{display:flex;gap:4px;flex-wrap:wrap}
.days button{flex:1;min-width:38px;padding:7px 0;border:1px solid color-mix(in srgb,var(--line) 55%,transparent);background:var(--input);color:var(--mute);font-size:.85rem}
.days button[aria-pressed=true]{background:var(--line);color:#fff;border-color:var(--line)}
.exrow{display:grid;grid-template-columns:1fr 64px 56px auto;gap:6px;align-items:center;margin-bottom:6px}
.exrow2{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:-2px 0 12px}
.exrow input,.exrow2 input{padding:7px 8px;font-size:.9rem}
.check{display:flex;gap:10px;align-items:center;color:var(--ink)!important;font-size:.92rem!important}
.check input{width:20px;height:20px}

/* Status */
.srow{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed color-mix(in srgb,var(--line) 30%,transparent)}
.srow:last-child{border-bottom:0}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:4px 18px;margin-top:4px}
.stats div{display:flex;justify-content:space-between;padding:5px 0}
.stats b{font-family:"Chakra Petch",sans-serif;color:var(--glow)}
.heat{display:grid;grid-template-columns:repeat(14,1fr);gap:4px}
.heat span{aspect-ratio:1;background:var(--input);border:1px solid color-mix(in srgb,var(--line) 25%,transparent)}
.heat .h1{background:color-mix(in srgb,var(--glow) 35%,transparent)}.heat .h2{background:var(--glow)}.heat .h0{background:color-mix(in srgb,var(--red) 45%,transparent)}
.log{max-height:240px;overflow:auto;font-size:.88rem}
.log p{margin:0 0 7px;padding-left:10px;border-left:2px solid var(--line)}
.rep p{margin:0 0 8px}

/* Rotina */
.ri{display:flex;justify-content:space-between;align-items:center;width:100%;background:none;border:0;border-bottom:1px dashed color-mix(in srgb,var(--line) 30%,transparent);padding:11px 2px;text-align:left}
.ri:last-child{border-bottom:0}

/* Navegação */
nav{position:fixed;left:0;right:0;bottom:0;z-index:5;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border-top:1px solid color-mix(in srgb,var(--glow) 35%,transparent);padding-bottom:env(safe-area-inset-bottom,0px)}
nav div{display:flex;max-width:520px;margin:0 auto}
nav button{flex:1;background:none;border:0;color:var(--mute);padding:14px 0;font:600 .95rem "Chakra Petch",sans-serif}
nav button[aria-current=page]{color:var(--glow);text-shadow:0 0 10px color-mix(in srgb,var(--glow) 60%,transparent);box-shadow:inset 0 2px 0 var(--glow)}

/* Sheet, modal, toast */
.ov{position:fixed;inset:0;z-index:20;background:rgba(1,4,14,.7);display:none}
.ov.on{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-height:88%;overflow:auto;transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.9,.3,1);
  padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet.on{transform:none}
.sheet .win{max-width:520px;margin:0 auto;border-bottom:0}
.sheet h3{font-size:1.2rem;margin-bottom:4px}
.modal{position:fixed;inset:0;z-index:30;display:none;place-items:center;padding:20px;background:rgba(1,4,14,.75)}
.modal.on{display:grid}
.modal .win{width:100%;max-width:370px;text-align:center;animation:pop .5s cubic-bezier(.2,1.5,.4,1)}
.modal .bd{padding:22px 18px}
.modal .huge{font:700 3.6rem/1.1 "Chakra Petch",sans-serif;color:var(--rk,var(--glow));text-shadow:0 0 22px currentColor;margin:4px 0}
.modal p{margin:6px 0}
@keyframes pop{from{transform:scale(.8);opacity:0}to{transform:none;opacity:1}}
.toast{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);left:50%;z-index:40;transform:translate(-50%,-160%);transition:transform .3s;
  background:var(--panel);border:1px solid var(--glow);padding:10px 16px;font:600 .92rem "Chakra Petch",sans-serif;color:var(--ink);
  box-shadow:0 0 20px color-mix(in srgb,var(--glow) 35%,transparent);max-width:90vw;text-align:center;backdrop-filter:blur(8px)}
.toast.on{transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* v0.3: agora, linha do dia, trilha */
.strip{display:flex;justify-content:space-between;gap:4px;padding:10px 14px}
.strip div{flex:1;text-align:center;font-size:.72rem;color:var(--mute)}
.strip i{display:block;width:26px;height:26px;margin:0 auto 3px;border:1px solid color-mix(in srgb,var(--line) 45%,transparent);background:var(--input);transform:rotate(45deg)}
.strip .f i{background:linear-gradient(135deg,var(--gold),#ff7a3d);border-color:var(--gold);box-shadow:0 0 10px color-mix(in srgb,var(--gold) 60%,transparent)}
.strip .x i{background:color-mix(in srgb,var(--red) 40%,transparent);border-color:var(--red)}
.strip .t{color:var(--ink);font-weight:600}
.strip .t i{border-color:var(--glow);border-width:2px}
.fire{font:700 1rem "Chakra Petch",sans-serif;color:var(--gold)}
.now .when{font-size:.9rem;color:var(--mute);text-align:center}
.now .big{font:700 1.6rem/1.2 "Chakra Petch",sans-serif;text-align:center;margin:6px 0 4px;text-shadow:0 0 16px color-mix(in srgb,var(--glow) 40%,transparent)}
.now .cd{text-align:center;font-size:.95rem;margin-bottom:4px}
.now .cd b{font-family:"Chakra Petch",sans-serif;color:var(--glow);font-size:1.15rem}
.now .cd.late b{color:var(--red)}
.now .pts{display:flex;justify-content:center;gap:8px;margin-top:6px}
.btn.xl{padding:15px;font-size:1.1rem}
.sp{border-color:color-mix(in srgb,var(--gold) 70%,transparent);box-shadow:0 0 24px color-mix(in srgb,var(--gold) 20%,transparent)}
.sp .tab span{color:var(--gold);border-color:color-mix(in srgb,var(--gold) 70%,transparent);background:color-mix(in srgb,var(--gold) 10%,transparent);text-shadow:0 0 10px color-mix(in srgb,var(--gold) 50%,transparent)}
.sp .ttl{font:600 1.1rem "Chakra Petch",sans-serif;text-align:center;margin:2px 0 8px}
.tl{display:grid;grid-template-columns:50px 16px 1fr auto;gap:10px;align-items:center;padding:10px 2px;border-bottom:1px dashed color-mix(in srgb,var(--line) 30%,transparent)}
.tl:last-child{border-bottom:0}
.tl .tm{font:600 .95rem "Chakra Petch",sans-serif;color:var(--mute)}
.tl .dt{width:12px;height:12px;border:2px solid var(--line);transform:rotate(45deg)}
.tl .main{background:none;border:0;text-align:left;padding:0;min-width:0}
.tl .main b{display:block;font-weight:600}
.tl .sub{font-size:.8rem;color:var(--mute)}
.tl .st{font:600 .85rem "Chakra Petch",sans-serif;white-space:nowrap}
.tl.done .dt{background:var(--ok);border-color:var(--ok)}.tl.done .st{color:var(--ok)}.tl.done .main b{color:var(--mute)}
.tl.fail .dt{background:var(--red);border-color:var(--red)}.tl.fail .st{color:var(--red)}
.tl.exc .dt{border-color:var(--mute)}.tl.exc .st{color:var(--mute)}
.tl.act .dt{background:var(--glow);border-color:var(--glow);box-shadow:0 0 10px var(--glow)}.tl.act .st{color:var(--glow)}
.tl.act .tm{color:var(--glow)}
.demo{display:flex;gap:6px;flex-wrap:wrap;align-items:center;justify-content:center;padding:12px;border:1px dashed color-mix(in srgb,var(--line) 55%,transparent);margin-top:4px}
.demo span{width:100%;text-align:center;font-size:.8rem;color:var(--mute)}
/* trilha */
.floor{text-align:center;margin:18px 0 8px}
.floor b{font:600 1.05rem "Chakra Petch",sans-serif;color:var(--glow)}
.path{display:flex;flex-direction:column;align-items:center;gap:14px;padding:6px 0 10px}
.node{width:66px;height:66px;border-radius:50%;border:2px solid color-mix(in srgb,var(--line) 50%,transparent);background:var(--input);color:var(--mute);
  font:700 1.2rem "Chakra Petch",sans-serif;display:grid;place-items:center;position:relative}
.node.done{background:var(--line);border-color:var(--glow);color:#fff;box-shadow:0 0 12px color-mix(in srgb,var(--glow) 40%,transparent)}
.node.cur{border-color:var(--glow);color:var(--glow);box-shadow:0 0 0 6px color-mix(in srgb,var(--glow) 15%,transparent),0 0 22px var(--glow);animation:pulse 1.8s infinite}
.node.boss{width:84px;height:84px;border-color:color-mix(in srgb,var(--gold) 60%,transparent);color:var(--gold)}
.node.boss.done{background:linear-gradient(135deg,var(--gold),#ff7a3d);color:#1a1000}
.node .lb{position:absolute;top:100%;margin-top:4px;font:600 .72rem Barlow,sans-serif;color:var(--mute);white-space:nowrap}
.node.cur .lb{color:var(--glow)}
@keyframes pulse{50%{box-shadow:0 0 0 12px color-mix(in srgb,var(--glow) 0%,transparent),0 0 30px var(--glow)}}
.timerbig{font:700 2.6rem "Chakra Petch",sans-serif;text-align:center;color:var(--glow);text-shadow:0 0 18px var(--glow)}

/* v0.4: contexto, cartões, plano por blocos, relâmpago */
.ctx .bd{padding:12px 14px}
.ctx .where{font:700 1.35rem/1.2 "Chakra Petch",sans-serif;text-align:center;text-shadow:0 0 14px color-mix(in srgb,var(--glow) 40%,transparent)}
.ctx .sub{text-align:center;font-size:.88rem;color:var(--mute);margin-top:2px}
.ctx .clock{text-align:center;font:600 .85rem "Chakra Petch",sans-serif;color:var(--glow)}
.mc{padding:12px 0;border-bottom:1px dashed color-mix(in srgb,var(--line) 30%,transparent)}
.mc:last-child{border-bottom:0}
.mc .hd{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.mc .nm{font-weight:600;font-size:1.05rem;background:none;border:0;padding:0;text-align:left}
.mc .meta{font-size:.82rem;color:var(--mute)}
.mc .cd{font:600 .85rem "Chakra Petch",sans-serif;color:var(--glow);white-space:nowrap}
.mc .cd.late{color:var(--red)}
.mc .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.mc .acts .btn{flex:1;min-width:88px;padding:11px 10px}
.mc .bar{margin-top:8px;height:5px}
.flash{border-color:var(--gold);box-shadow:0 0 26px color-mix(in srgb,var(--gold) 30%,transparent);animation:glowf 1.6s infinite}
.flash .tab span{color:var(--gold);border-color:var(--gold);background:color-mix(in srgb,var(--gold) 12%,transparent)}
@keyframes glowf{50%{box-shadow:0 0 38px color-mix(in srgb,var(--gold) 45%,transparent)}}
.flash .txt{font:600 1.15rem "Chakra Petch",sans-serif;text-align:center;margin:2px 0 4px}
.blk{display:grid;grid-template-columns:50px 1fr;gap:10px;padding:9px 2px;border-bottom:1px dashed color-mix(in srgb,var(--line) 25%,transparent)}
.blk:last-child{border-bottom:0}
.blk .tm{font:600 .9rem "Chakra Petch",sans-serif;color:var(--mute);padding-top:1px}
.blk .lb{font-weight:600}
.blk.past .lb,.blk.past .tm{color:var(--mute);opacity:.7}
.blk.cur{background:var(--soft);margin:0 -8px;padding-left:10px;padding-right:10px;border-left:2px solid var(--glow)}
.blk.cur .tm,.blk.cur .lb{color:var(--glow)}
.mchips{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px}
.mchip{font-size:.78rem;padding:3px 8px;border:1px solid color-mix(in srgb,var(--line) 45%,transparent);background:var(--input);color:var(--ink)}
.mchip.done{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 50%,transparent)}
.mchip.fail{color:var(--red);border-color:color-mix(in srgb,var(--red) 50%,transparent)}
.mchip.exc{color:var(--mute)}
.mchip.fl{color:var(--gold);border-color:color-mix(in srgb,var(--gold) 45%,transparent);background:transparent}
.quiet{text-align:center;color:var(--mute);font-size:.92rem;margin:0}

/* correções iOS */
.two{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
input,select{-webkit-appearance:none;appearance:none;border-radius:0;max-width:100%;min-height:44px;text-align:left}
input[type=checkbox]{-webkit-appearance:checkbox;appearance:auto;min-height:0}
input[type=time]{display:block;width:100%;min-width:0}
input[type=time]::-webkit-date-and-time-value{text-align:left}
.step input{min-height:0;text-align:center}
.toast{visibility:hidden;opacity:0;transition:transform .3s,opacity .3s,visibility .3s}
.toast.on{visibility:visible;opacity:1}
.mchip.ev{color:#b193ff;border-color:color-mix(in srgb,#b193ff 50%,transparent);background:transparent}
</style>
</head>
<body>
<div class="app">
  <header class="win hud" id="hud"></header>
  <main id="view"></main>
</div>
<nav id="nav"><div>
  <button data-tab="agora" aria-current="page">Agora</button>
  <button data-tab="trilha">Trilha</button>
  <button data-tab="status">Status</button>
  <button data-tab="rotina">Rotina</button>
</div></nav>
<div class="ov" id="ov"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"><div class="win"><div class="bd" id="sheetBody"></div></div></div>
<div class="modal" id="modal" role="dialog" aria-modal="true"><div class="win"><div class="tab"><span id="mTab">Notificação</span></div><div class="bd" id="mBody"></div></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>

"use strict";
/* =====================================================================
   EVOLUÇÃO v0.6
   1. Utilidades   2. Relógio   3. Estado e persistência (com migração)
   4. Agenda (blocos do dia)    5. Regras (3 tipos de tempo: hora, dia, semana)
   6. Motor (tick, pendências, fechamento do dia e da semana)

/* Migração: cada versão antiga vira a seguinte, sem perder progresso */
function migrate(d){if(!d||typeof d!=="object")return null;
  if(d.v===4){d.v=5;d.paused=null;d.integ=INTEG0()}
  if(d.v===5&&Array.isArray(d.missions)){d.v=6;d.pending=[];const wk=d.week&&d.week.key||weekKey(d.today.date);
    d.week=Object.assign({counts:{},excused:{},cap:7,paused:0,shields:1},d.week||{},{key:wk});
    d.missions=d.missions.map(m=>{
      if(m.kind==="wake")return Object.assign(m,{type:"hora",bonus:10,tol:15,late:60});
      if(m.kind==="sleep")return Object.assign(m,{type:"hora",name:"Dormir",bonus:8,tol:15,late:60});
      if(m.kind==="gym")return Object.assign(m,{type:"semana",times:Math.min(4,(m.days||WEEK).length),prefDays:(m.days||WEEK).slice(),bonus:8,days:ALL.slice()});
      if(m.kind==="presence")return Object.assign(m,{type:"semana",times:Math.max(1,(m.days||[4]).length),prefDays:(m.days||[4]).slice(),prefTime:m.time||"19:00",bonus:0,days:ALL.slice(),fixed:false});
      if(m.fixed)return Object.assign(m,{type:"hora",target:m.time,tol:15,late:Math.max(30,toMin(m.until)-toMin(m.time)),bonus:Math.round(m.xp/2),fixed:false});
      return Object.assign(m,{type:"dia",bonus:m.ctx&&m.ctx!=="any"?5:0})});
    for(const m of d.missions)if(m.type==="semana")d.week.counts[m.id]=new Set((d.log||[]).filter(l=>l.d>=wk&&l.t.startsWith(m.name+": feita")).map(l=>l.d)).size;
    if(d.today&&d.today.e)for(const m of d.missions){const e=d.today.e[m.id];if(e&&m.type==="semana"&&e.failed){delete d.today.e[m.id]}}}
  if(d.v!==6||!Array.isArray(d.missions))return null;
  d.integ=Object.assign(INTEG0(),d.integ||{});d.pending=d.pending||[];d.week=Object.assign({counts:{},excused:{},cap:7,paused:0,shields:1},d.week||{});return d}

/* ---------- 4. Agenda: blocos do dia ---------- */
const isWork=date=>S.sched.work.includes(dow(date));

/* Academia entra no plano nos dias preferidos enquanto a meta da semana não foi batida */
function gymPlanned(date){const g=M("gym");if(!g||!g.prefDays.includes(dow(date)))return false;if(date!==S.today.date)return true;return !!ent(g).done||weekCount(g)<weekReq(g)}
function blocks(date){const out=[];const add=(id,a,b,label)=>{a=Math.max(a,out.length?out[out.length-1].b:0);b=Math.min(b,1440);if(b>a)out.push({id,a,b,label})};
  const gt=gymPlanned(date);
  if(isWork(date)){const d=S.sched.wd,W=toMin(d.wake),L=toMin(d.leave),WS=toMin(d.workStart),LU=toMin(d.lunch),LE=LU+(+d.lunchDur||60),WE=toMin(d.workEnd),C=Math.max(10,WS-L),SL=toMin(d.sleep);
    add("sono",0,W,"Dormindo");add("casa",W,L,"Manhã em casa");add("onibus",L,WS,"Ônibus · ida");add("trabalho",WS,LU,"Trabalho");add("almoco",LU,LE,"Almoço");
    const G=toMin(d.gym),GD=+d.gymDur||90;add("trabalho",LE,WE,"Trabalho");add("onibus",WE,gt&&G>WE?Math.min(WE+C,G):WE+C,"Ônibus · volta");
    if(gt){const lb=out[out.length-1].b;if(G>lb)add("noite",lb,G,"Em casa");if(G>=out[out.length-1].b)out.push({id:"academia",a:G,b:Math.min(1440,G+GD),label:"Academia"});else add("academia",G,G+GD,"Academia")}
    add("noite",out[out.length-1].b,SL,"Noite em casa");add("sono",SL,1440,"Dormindo")}
  else{const d=S.sched.we,W=toMin(d.wake),SL=toMin(d.sleep);add("sono",0,W,"Dormindo");add("livre",W,720,"Manhã livre");
    if(gt){const G=toMin(S.sched.wd.gym);add("livre",720,G,"Tarde livre");add("academia",G,G+(+S.sched.wd.gymDur||90),"Academia")}
    add("livre",out[out.length-1].b,Math.max(1080,out[out.length-1].b),"Tarde livre");add("noite",out[out.length-1].b,SL,"Noite");add("sono",SL,1440,"Dormindo")}
  return out}
const blockAt=(date,m)=>{const bl=blocks(date);const i=bl.findIndex(b=>m>=b.a&&m<b.b);return{i,b:bl[i],bl}};

/* ---------- 5. Regras: 3 tipos de tempo ----------
   hora   → alvo no relógio (acordar, dormir). No horário = bônus; atrasado = XP normal; muito atrasado = falha. Pode marcar depois com a hora real.
   dia    → qualquer hora do dia. No momento sugerido = bônus. O que não foi marcado vai para a confirmação da manhã seguinte.
   semana → N vezes por semana, dias preferidos só para sugestão. Cobrança no domingo, por sessão que faltou. */
const ent=m=>S.today.e[m.id]||(S.today.e[m.id]={});

const isWeekly=m=>m.type==="semana";
const weeklies=()=>S.missions.filter(isWeekly);
const target=(m,date=S.today.date)=>m.kind==="wake"?toMin(daySched(date).wake):m.kind==="sleep"?toMin(daySched(date).sleep):m.kind==="gym"?toMin(S.sched.wd.gym):toMin(m.target||m.prefTime||"09:00");
function win(m,date=S.today.date){const d=daySched(date),W=toMin(d.wake),SL=Math.min(1439,toMin(d.sleep)),tg=target(m,date);
  if(m.type==="hora"){const open=m.kind==="wake"?tg-180:m.kind==="sleep"?tg-120:tg-60;return{open:Math.max(0,open),start:tg,end:Math.min(1439,tg+(m.late||60))}}
  if(m.type==="semana")return{open:0,start:tg,end:Math.min(1439,tg+150)};return{open:0,start:W,end:SL}}
const dueToday=()=>S.missions.filter(m=>dueOn(m,S.today.date)).sort((a,b)=>win(a).start-win(b).start);
function weekCount(m){return S.week.counts[m.id]||0}
function weekReq(m){const base=Math.min(m.times||1,S.week.cap||7),p=S.week.paused||0;return Math.max(0,Math.ceil(base*(7-p)/7)-(S.week.excused[m.id]||0))}
const daysLeftWeek=(date=S.today.date)=>7-((dow(date)+6)%7);
function title(m){const d=daySched(S.today.date);if(m.kind==="wake")return`Acordar às ${d.wake}`;if(m.kind==="sleep")return`Dormir até ${d.sleep}`;
  if(m.type==="hora")return`${m.name} às ${hm(target(m))}`;if(m.kind==="qty")return`${m.name} ${num(m.target)} ${m.unit}`;return m.name}
function whenTxt(m){if(m.type==="hora"){const tg=target(m);return`alvo ${hm(tg)} · no horário até ${hm(tg+(m.tol||15))}`}
  if(m.type==="semana"){const r=weekReq(m),c=weekCount(m);return`${c}/${r} na semana · de preferência ${m.prefDays.length===7?"qualquer dia":daysTxt(m.prefDays)} às ${hm(target(m))}`}
  const has=blocks(S.today.date).some(b=>b.id===m.ctx);return`${has&&m.ctx!=="any"?CTX[m.ctx]:"quando der"} · até dormir`}
function xpTxt(m){return`+${m.xp}${m.bonus?` (+${m.bonus} ${m.type==="dia"?"no momento certo":"no horário"})`:""} / −${m.loss}`}
/* Avaliação de horário: t em minutos do dia da missão (para dormir depois da meia-noite, t passa de 1440) */
function timeGrade(m,t,date=S.today.date){const tg=target(m,date),dlt=t-tg;return dlt<=(m.tol||15)?"on":dlt<=(m.late||60)?"late":"miss"}
function suggested(m,now){const e=ent(m);if(resolved(e))return false;const tg=target(m);
  if(m.type==="hora"){if(m.kind==="wake")return now>=tg-120&&now<720;if(m.kind==="sleep")return now>=tg-60;return now>=tg-15&&now<tg+(m.late||60)}
  if(m.type==="semana"){if(e.done||weekCount(m)>=weekReq(m))return false;const pref=m.prefDays.includes(dow(S.today.date)),{b}=blockAt(S.today.date,now);
    if(pref&&now>=tg-30&&now<tg+150)return true;const left=weekReq(m)-weekCount(m);return left>=daysLeftWeek()&&!!b&&["casa","noite","livre"].includes(b.id)}
  const{b}=blockAt(S.today.date,now);if(!b||b.id==="sono"||b.id==="trabalho"||b.id==="academia")return false;
  if(b.id==="noite"||m.ctx==="any"||b.id===m.ctx)return true;
  return !blocks(S.today.date).some(x=>x.id===m.ctx)&&["casa","livre"].includes(b.id)}
function canAct(m,now=vmin()){if(m.type==="hora"&&m.kind==="wake")return now>=target(m)-180;if(m.type==="hora"&&m.kind==="sleep")return now>=target(m)-120;return true}
function log(t){S.log.unshift({d:S.today.date,h:hm(vmin()),t});S.log=S.log.slice(0,150)}
function calcRank(){const h=S.history.slice(-30).filter(x=>x.due>0);if(h.length<3)return"E";
  const rate=h.reduce((s,x)=>s+x.done,0)/h.reduce((s,x)=>s+x.due,0);for(const k of RANKS)if(rate>=k.rate&&S.level>=k.lvl)return k.r;return"E"}
function checkRank(){const r=calcRank();if(r===S.rank)return;const up="EDCBAS".indexOf(r)>"EDCBAS".indexOf(S.rank);S.rank=r;log(up?`Rank elevado para ${r}.`:`Rank rebaixado para ${r}.`);queue({k:"rank",up,r})}
function addXP(n,stat){if(stat&&STATS[stat])S.statXP[stat]=Math.max(0,S.statXP[stat]+n);S.xp+=n;
  while(S.xp>=need(S.level)){S.xp-=need(S.level);S.level++;log(`Nível ${S.level} alcançado.`);queue({k:"lvl",up:true})}

function tick(now,silent){const t=S.today;let ch=false;
  const{i,b}=blockAt(t.date,now);if(i!==t.bi){t.bi=i;ch=true;if(!silent&&b&&!S.paused)emit("block",{b})}
  if(S.paused)return ch;
  for(const m of dueToday()){const e=ent(m);if(resolved(e))continue;const tg=target(m);
    if(m.type==="hora"){
      if(m.kind==="wake"&&now>=720){failM(m,e,"sem confirmação até 12:00",silent);ch=true;continue}
      if(m.kind!=="wake"&&m.kind!=="sleep"&&now>=tg+(m.late||60)){failM(m,e,"passou do horário",silent);ch=true;continue}
      const at=m.kind==="sleep"?tg-30:tg;if(now>=at&&!e.pinged){e.pinged=true;ch=true;if(!silent)emit("start",{m})}}}

function weekClose(lines){for(const m of weeklies()){const r=weekReq(m),c=weekCount(m),h=hist(S.today.date);if(h){h.due+=r;h.done+=Math.min(c,r)}
    if(c<r){const loss=(r-c)*m.loss;addXP(-loss,m.stat);log(`${m.name}: ${c}/${r} na semana. −${loss} XP.`);lines.push(`${m.name}: ${c}/${r} na semana · −${loss} XP.`)}

function closeDayPaused(){const t=S.today;S.history.push({date:t.date,due:0,done:0,fl:0,fd:0,sp:t.sp,paused:true});S.week.paused=(S.week.paused||0)+1;const lines=[];
  if(dow(t.date)===0)weekClose(lines);const next=addDays(t.date,1);if(weekKey(next)!==S.week.key)S.week=newWeek(next);
  if(S.paused.until&&next>S.paused.until){S.paused=null;log("Pausa encerrada.")}S.today=newDay(next);return{date:t.date,n:0,d:0,pend:0,fl:0,fd:0,sp:t.sp,paused:true,lines}}
function closeDay(){if(S.paused)return closeDayPaused();const t=S.today,lines=[];let n=0,d=0,pend=0;

    if(m.type==="dia"||m.kind==="sleep"){S.pending.push({date:t.date,id:m.id});pend++;continue}

  const next=addDays(t.date,1);if(weekKey(next)!==S.week.key)S.week=newWeek(next);

  L.push(...reps.flatMap(x=>x.lines||[]));if(r.fl)L.push(`Relâmpagos: ${r.fd}/${r.fl}.`);if(r.sp)L.push("Missão especial concluída.");

function tone(fs,d=.09){if(!S.sound)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();let t=AC.currentTime;

  g.gain.exponentialRampToValueAtTime(.14,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d+.03);t+=d*.85})}catch(e){}}

  lvl:()=>{tone([660,880,1100,1320,1760],.12);navigator.vibrate?.([40,40,80])},bad:()=>{tone([300,200],.18);navigator.vibrate?.([80,60,80])}};
const fx=k=>S.sound&&SFX[k]&&SFX[k]();
const TQ=[];let tBusy=false;

function nextToast(){const x=TQ.shift(),e=$("#toast");if(!x){tBusy=false;e.classList.remove("on");return}tBusy=true;e.textContent=x[0];
  e.style.borderColor=x[1]==="red"?"var(--red)":x[1]==="gold"?"var(--gold)":"";e.classList.add("on");setTimeout(nextToast,2800)}
function flush(){for(const x of ev.splice(0)){switch(x.t){
  case"block":{const b=x.b;if(b.id==="sono")break;if(b.id==="trabalho"){fx("ping");toast("Modo trabalho · só relâmpagos discretos");break}
    const s=[...dueToday(),...weeklies()].filter(m=>suggested(m,b.a+1));if(s.length){fx("ping");toast(`${b.label}: ${s.map(m=>m.kind==="qty"?`${m.name.toLowerCase()} ${num(m.target)} ${m.unit}`:m.name.toLowerCase()).slice(0,2).join(" e ")}`)}break}
  case"start":fx("ping");toast(x.m.kind==="sleep"?`Faltam 30 min para dormir · toque em "Indo dormir" quando for`:`Hora: ${title(x.m)}`);break;
  case"week":fx("ping");toast(`${x.m.name} hoje · ${weekCount(x.m)}/${weekReq(x.m)} na semana`);break;
  case"fail":fx("bad");toast(`Missão falhou: ${x.m.name} · −${x.m.loss} XP`,"red");break;
  case"warn":fx("ping");toast(`45 min para dormir · faltam ${x.p.map(m=>m.name.toLowerCase()).join(", ")}`,"red");break;
  case"flash":fx("flash");toast(`Missão relâmpago · ${x.f.text}`,"gold");break}}}

    <p class="mute" style="margin:6px 0 0">Até ${hm(tg+(w.tol||15))}: no horário (+${w.bonus}) · até ${hm(tg+(w.late||60))}: atrasado</p></div>`}

    h+=y.map((p,i)=>{const m=M(p.id);if(!m)return"";const tg=target(m,p.date);

        <button class="btn solid" data-do="ci" data-v="${i}" data-g="on">Até ${hm(tg+(m.tol||15))}</button><button class="btn" data-do="ci" data-v="${i}" data-g="late">Até ${hm(tg+(m.late||60))}</button><button class="btn red" data-do="ci" data-v="${i}" data-g="miss">Mais tarde</button></div></div>`;
      return`<div class="mc"><div class="hd"><b>${esc(title(m))} <span class="mute">(${fmt(p.date)})</span></b></div><div class="acts"><button class="btn solid" data-do="ci" data-v="${i}" data-g="late">Fiz</button><button class="btn red" data-do="ci" data-v="${i}" data-g="miss">Não fiz</button></div></div>`}).join("")}
  if(!y.length&&!(w&&!resolved(ent(w))))h+=`<p class="quiet">Tudo confirmado.</p>`;

  openSheet(h,"__ci")}

    times:draft.times||3,prefDays:draft.prefDays||WEEK.slice(),prefTime:draft.prefTime||"19:00",tol:draft.tol??15,late:draft.late??60,bonus:draft.bonus??0,

function readEdit(){const g=i=>$("#"+i),d=draft;if(!g("eXp"))return;if(g("eName"))d.name=g("eName").value;if(g("eType"))d.type=g("eType").value;if(g("eKind"))d.kind=g("eKind").value;
  if(!["wake","sleep"].includes(d.kind)&&!KIND_BY_TYPE[d.type].includes(d.kind))d.kind=KIND_BY_TYPE[d.type][0];
  d.stat=g("eStat").value;d.xp=Math.max(1,+g("eXp").value||1);d.bonus=Math.max(0,+g("eBonus").value||0);d.loss=Math.max(0,+g("eLoss").value||0);
  if(g("eCtx"))d.ctx=g("eCtx").value;if(g("eTarget2"))d.target=g("eTarget2").value||"09:00";if(g("eTol"))d.tol=Math.max(0,+g("eTol").value||0);if(g("eLate"))d.late=Math.max(d.tol+1,+g("eLate").value||60);
  if(g("eTimes"))d.times=Math.max(1,Math.min(7,+g("eTimes").value||1));if(g("ePref"))d.prefTime=g("ePref").value||"19:00";
  if(g("eTarget")){d.target=Math.max(.01,+g("eTarget").value||1);d.unit=g("eUnit").value.trim()||"un";d.steps=g("eSteps").value.split(/[;\s]+/).map(x=>+x.replace(",",".")).filter(x=>x>0).slice(0,3);if(!d.steps.length)d.steps=[1];d.auto=g("eAuto").checked}

function renderEdit(){const d=draft,core=["wake","sleep"].includes(d.kind),gym=d.kind==="gym";let h=`<h3>${d.isNew?"Nova missão":"Editar missão"}</h3><div class="form" style="margin-top:10px">`;

  if(d.type==="dia"&&d.kind==="qty")h+=`<div class="two"><label>Meta por dia<input id="eTarget" type="number" step="0.25" value="${typeof d.target==="number"?d.target:1}"></label><label>Unidade<input id="eUnit" value="${esc(d.unit)}"></label></div>
    <label>Botões rápidos (ex.: 5 10)<input id="eSteps" value="${d.steps.map(num).join(" ")}"></label><label class="check"><input type="checkbox" id="eAuto" ${d.auto?"checked":""}> Ajustar a meta sozinha pelo meu desempenho</label>`;

    <label>Dias preferidos (só para sugestão; vale em qualquer dia)</label><div class="days" style="margin-top:-8px">${DOW.map((x,i)=>`<button type="button" data-do="pday" data-v="${i}" aria-pressed="${d.prefDays.includes(i)}">${x}</button>`).join("")}</div>`;
  if(gym)h+=`<div><div class="mute" style="margin-bottom:6px">Exercícios · nome, peso, aumento (kg) · séries, mín., máx.</div>${d.exercises.map((x,i)=>`

    <div class="exrow2"><input id="xs${i}" type="number" value="${x.sets}" aria-label="Séries"><input id="xa${i}" type="number" value="${x.min}" aria-label="Mínimo"><input id="xb${i}" type="number" value="${x.max}" aria-label="Máximo"></div>`).join("")}<button class="btn full" data-do="xadd">Adicionar exercício</button></div>`;
  if(d.type!=="semana")h+=`<label>Dias</label><div class="days" style="margin-top:-8px">${DOW.map((x,i)=>`<button type="button" data-do="day" data-v="${i}" aria-pressed="${d.days.includes(i)}">${x}</button>`).join("")}</div>`;
  h+=`<label>Atributo que evolui<select id="eStat">${Object.entries(STATS).map(([k,v])=>`<option value="${k}" ${d.stat===k?"selected":""}>${v}</option>`).join("")}</select></label>
  <div class="two"><label>XP ao cumprir<input id="eXp" type="number" value="${d.xp}"></label><label>Bônus ${d.type==="dia"?"(momento certo)":"(no horário)"}<input id="eBonus" type="number" value="${d.bonus}"></label></div>
  <label>XP perdido se não cumprir${d.type==="semana"?" (por sessão que faltar)":""}<input id="eLoss" type="number" value="${d.loss}"></label>
  <p id="eErr" style="color:var(--red);margin:0;font-size:.88rem"></p><div class="btns" style="margin-top:0"><button class="btn solid full" data-do="esave">${d.isNew?"Adicionar":"Salvar"}</button>
  ${d.isNew||core?"":`<button class="btn red full" data-do="edel">${confirmDel?"Toque de novo para remover":"Remover"}</button>`}<button class="btn ghost full" data-do="close">Cancelar</button></div></div>`;openSheet(h)}
function openGym(id){const m=M(id);openSheet(`<h3>Cargas de hoje</h3><p class="mute" style="margin:0">Já vem com as repetições do último treino. Bateu o máximo em todas as séries? O peso sobe.</p>

  try{const r=await sampleFn.json(`Você é "o Sistema" de Solo Leveling analisando a rotina real de um jogador que trabalha em horário comercial. Direto, honesto, motivador sem exagero, em português. Sem conselho médico. Procure padrões concretos: em que momento do dia (manhã, ônibus, almoço, noite) ele mais falha, quais missões são fracas, se os relâmpagos funcionam. Dados: ${JSON.stringify(data)}. Responda somente JSON: {"resumo":"2 frases","observacoes":["até 3 observações concretas"],"sugestao":"1 ajuste prático para a próxima semana"}`,{modelTier:"default"});
    if(!r||!r.resumo)throw{};S.report={date:S.today.date,resumo:String(r.resumo),obs:(r.observacoes||[]).slice(0,3).map(String),sug:String(r.sugestao||"")};save();render()}
  catch(e){if(e&&e.code==="not_granted"){sampleFn=null;render();return}btn.disabled=false;btn.textContent="Gerar relatório";toast("Sem resposta do Sistema. Tente de novo.")}}

$("#nav").onclick=e=>{const b=e.target.closest("button");if(!b)return;tab=b.dataset.tab;confirmReset=false;confirmLive=false;render();scrollTo(0,0)};
document.addEventListener("click",e=>{const b=e.target.closest("[data-do]");if(!b||b.closest("#nav"))return;const f=A[b.dataset.do];if(f)f(b)});
document.addEventListener("change",e=>{const t=e.target;if(t.id==="impFile"&&t.files[0]){t.files[0].text().then(tx=>{try{const d=migrate(JSON.parse(tx));if(!d)throw 0;S=d;save();render();toast("Backup restaurado")}catch(x){toast("Arquivo de backup inválido","red")}});return}if(t.id==="sSound"){S.sound=t.checked;save()}if(t.id==="sDemo"){S.demo=t.checked;save()}
  if(t.id==="iEmail"){S.integ.email=t.value.trim();save()}if(t.id==="iGcid"){S.integ.gcid=t.value.trim();save()}if(t.id==="sName"){S.name=t.value.trim().slice(0,30);save();hud()}if(t.dataset.re&&draft){readEdit();renderEdit()}});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&sheetOpen){closeSheet();delete S.sched._draft}});
document.addEventListener("visibilitychange",()=>{if(!document.hidden)loop()});
function urlAction(){const q=new URLSearchParams(location.search);if(!q.toString())return;history.replaceState(null,"",location.pathname);if(!S.accepted)return;loop();
  const ac=(q.get("acao")||"").toLowerCase(),v=+(q.get("v")||0);const map={acordei:"wake",dormir:"sleep",academia:"gym",agua:"water",ler:"read"};
  const id=map[ac]||q.get("feito")||q.get("somar");const m=id&&M(id);if(!m){if(ac)toast("Ação do Atalho não reconhecida","red");return}
  if(m.kind==="sleep"&&vmin()<300&&S.pending.some(x=>x.id==="sleep"&&x.date===addDays(S.today.date,-1))){A.latesleep();return}
  if(m.type!=="semana"&&!dueOn(m,S.today.date)){toast(`${m.name} não está na rotina de hoje`);return}
  const e=ent(m);if(m.type==="semana"?(e.done||e.excused):(resolved(e)&&!(m.kind==="qty"&&e.done))){toast(`${m.name} já foi registrada hoje`);return}
  if(!canAct(m)){toast(`${m.name}: disponível a partir das ${hm(win(m).open)}`,"red");return}
  if(m.kind==="qty"){addQty(m,v>0?v:m.steps[0]);commit()}else if(m.kind==="presence"){ent(m).asking=true;openMission(m.id)}else doMark(m)}
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
setInterval(loop,1000);render();loop();urlAction();
