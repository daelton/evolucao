<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Evolução</title>
<meta name="theme-color" content="#050918">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Evolução">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#050918; --bg2:#0a1638; --panel:rgba(10,24,62,.78); --line:#3b8fe6; --glow:#7fdcff; --soft:rgba(127,220,255,.10);
  --ink:#e8f3ff; --mute:#8ea7cc; --gold:#ffd166; --red:#ff5d73; --ok:#5ff0b0; --input:rgba(3,9,26,.75);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
:root[data-theme="dark"]{
  --bg:#050918; --bg2:#0a1638; --panel:rgba(10,24,62,.78); --line:#3b8fe6; --glow:#7fdcff; --soft:rgba(127,220,255,.10);
  --ink:#e8f3ff; --mute:#8ea7cc; --gold:#ffd166; --red:#ff5d73; --ok:#5ff0b0; --input:rgba(3,9,26,.75);
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:radial-gradient(130% 55% at 50% -5%,var(--bg2),var(--bg) 72%) fixed;background-color:var(--bg);
  color:var(--ink);font:400 16px/1.5 Barlow,system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
.app{max-width:520px;margin:0 auto;padding:12px 14px 100px}
.disp,h1,h2,h3{font-family:"Chakra Petch",Barlow,system-ui,sans-serif;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--glow);outline-offset:2px}
.mute{color:var(--mute);font-size:.88rem}
.hide{display:none!important}

/* Janela do Sistema */
.win{position:relative;background:var(--panel);border:1px solid color-mix(in srgb,var(--glow) 55%,transparent);
  margin:0 0 14px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  box-shadow:0 0 24px color-mix(in srgb,var(--glow) 16%,transparent),inset 0 0 30px color-mix(in srgb,var(--glow) 6%,transparent)}
.win>.bd{padding:14px}
.tab{display:flex;justify-content:center;margin-top:-1px}
.tab span{font:600 .95rem "Chakra Petch",sans-serif;color:var(--glow);padding:4px 16px;border:1px solid color-mix(in srgb,var(--glow) 55%,transparent);border-top:0;
  background:var(--soft);text-shadow:0 0 10px color-mix(in srgb,var(--glow) 60%,transparent)}
.win.red{border-color:var(--red);box-shadow:0 0 26px color-mix(in srgb,var(--red) 28%,transparent)}
.win.red .tab span{color:var(--red);border-color:var(--red);background:color-mix(in srgb,var(--red) 10%,transparent)}
.warn{font-size:.85rem;color:var(--red);margin:12px 0 0;text-align:center}

/* HUD */
.hud{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;padding:12px 14px}
.rank{width:58px;height:58px;display:grid;place-items:center;font:700 2.1rem/1 "Chakra Petch",sans-serif;color:var(--rk);
  border:2px solid var(--rk);text-shadow:0 0 14px var(--rk);box-shadow:inset 0 0 14px color-mix(in srgb,var(--rk) 25%,transparent)}
.lvrow{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.lvrow b{font:600 1.25rem "Chakra Petch",sans-serif}
.bar{height:7px;background:var(--input);border:1px solid color-mix(in srgb,var(--line) 45%,transparent);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--line),var(--glow));box-shadow:0 0 8px var(--glow);transition:width .6s}
.bar.red i{background:var(--red);box-shadow:none}

/* Linhas da missão */
.goal{font-size:.9rem;color:var(--mute);text-align:center;margin:0 0 10px}
.q{display:block;width:100%;background:none;border:0;border-bottom:1px dashed color-mix(in srgb,var(--line) 35%,transparent);padding:11px 2px;text-align:left}
.q:last-of-type{border-bottom:0}
.q .top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.q .nm{font-weight:600}
.q .pg{font:600 .95rem "Chakra Petch",sans-serif;color:var(--glow);white-space:nowrap}
.q .bar{margin-top:6px;height:4px}
.q.done .nm{color:var(--mute)}
.q.done .pg{color:var(--ok)}
.q.exc .pg{color:var(--mute)}
.q .sub{font-size:.8rem;color:var(--mute)}
.next{font-size:.85rem;color:var(--mute);margin-top:8px}

/* Botões */
.btn{background:transparent;color:var(--glow);border:1px solid var(--glow);padding:10px 16px;font:600 .95rem "Chakra Petch",sans-serif}
.btn:hover{background:var(--soft)}
.btn.solid{background:var(--line);border-color:var(--line);color:#fff}
.btn.red{color:var(--red);border-color:var(--red)}
.btn.ghost{border-color:transparent;color:var(--mute)}
.btn.full{width:100%}
.btn:disabled{opacity:.4;cursor:default}
.btns{display:grid;gap:8px;margin-top:14px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:.8rem;padding:4px 10px;border:1px solid color-mix(in srgb,var(--glow) 40%,transparent);background:var(--soft);color:var(--glow)}
.tag{font-size:.75rem;padding:1px 7px;border:1px solid color-mix(in srgb,var(--glow) 35%,transparent);color:var(--glow)}
.tag.g{color:var(--gold);border-color:color-mix(in srgb,var(--gold) 45%,transparent)}

/* Stepper */
.step{display:inline-flex;align-items:center;border:1px solid color-mix(in srgb,var(--line) 60%,transparent);background:var(--input)}
.step button{width:40px;height:40px;background:none;border:0;color:var(--glow);font:600 1.2rem "Chakra Petch",sans-serif}
.step input{width:58px;height:40px;text-align:center;background:none;border:0;color:var(--ink);font:600 1.05rem "Chakra Petch",sans-serif;-moz-appearance:textfield}
.step input::-webkit-inner-spin-button{display:none}
.step.sm button{width:30px;height:34px;font-size:1rem}.step.sm input{width:36px;height:34px;font-size:.95rem}
.ex{padding:12px 0;border-bottom:1px dashed color-mix(in srgb,var(--line) 35%,transparent)}
.ex:last-child{border-bottom:0}
.sets{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}

/* Formulários */
input,select{font:inherit;color:var(--ink);background:var(--input);border:1px solid color-mix(in srgb,var(--line) 55%,transparent);padding:9px 10px;min-width:0;width:100%}
.form{display:grid;gap:12px}
.form label{display:grid;gap:4px;font-size:.85rem;color:var(--mute)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.days{display:flex;gap:4px;flex-wrap:wrap}
.days button{flex:1;min-width:38px;padding:7px 0;border:1px solid color-mix(in srgb,var(--line) 55%,transparent);background:var(--input);color:var(--mute);font-size:.85rem}
.days button[aria-pressed=true]{background:var(--line);color:#fff;border-color:var(--line)}
.exrow{display:grid;grid-template-columns:1fr 64px 56px auto;gap:6px;align-items:center;margin-bottom:6px}
.exrow2{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:-2px 0 12px}
.exrow input,.exrow2 input{padding:7px 8px;font-size:.9rem}
.check{display:flex;gap:10px;align-items:center;color:var(--ink)!important;font-size:.92rem!important}
.check input{width:20px;height:20px}

/* Status */
.srow{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed color-mix(in srgb,var(--line) 30%,transparent)}
.srow:last-child{border-bottom:0}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:4px 18px;margin-top:4px}
.stats div{display:flex;justify-content:space-between;padding:5px 0}
.stats b{font-family:"Chakra Petch",sans-serif;color:var(--glow)}
.heat{display:grid;grid-template-columns:repeat(14,1fr);gap:4px}
.heat span{aspect-ratio:1;background:var(--input);border:1px solid color-mix(in srgb,var(--line) 25%,transparent)}
.heat .h1{background:color-mix(in srgb,var(--glow) 35%,transparent)}.heat .h2{background:var(--glow)}.heat .h0{background:color-mix(in srgb,var(--red) 45%,transparent)}
.log{max-height:240px;overflow:auto;font-size:.88rem}
.log p{margin:0 0 7px;padding-left:10px;border-left:2px solid var(--line)}
.rep p{margin:0 0 8px}

/* Rotina */
.ri{display:flex;justify-content:space-between;align-items:center;width:100%;background:none;border:0;border-bottom:1px dashed color-mix(in srgb,var(--line) 30%,transparent);padding:11px 2px;text-align:left}
.ri:last-child{border-bottom:0}

/* Navegação */
nav{position:fixed;left:0;right:0;bottom:0;z-index:5;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border-top:1px solid color-mix(in srgb,var(--glow) 35%,transparent);padding-bottom:env(safe-area-inset-bottom,0px)}
nav div{display:flex;max-width:520px;margin:0 auto}
nav button{flex:1;background:none;border:0;color:var(--mute);padding:14px 0;font:600 .95rem "Chakra Petch",sans-serif}
nav button[aria-current=page]{color:var(--glow);text-shadow:0 0 10px color-mix(in srgb,var(--glow) 60%,transparent);box-shadow:inset 0 2px 0 var(--glow)}

/* Sheet, modal, toast */
.ov{position:fixed;inset:0;z-index:20;background:rgba(1,4,14,.7);display:none}
.ov.on{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-height:88%;overflow:auto;transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.9,.3,1);
  padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet.on{transform:none}
.sheet .win{max-width:520px;margin:0 auto;border-bottom:0}
.sheet h3{font-size:1.2rem;margin-bottom:4px}
.modal{position:fixed;inset:0;z-index:30;display:none;place-items:center;padding:20px;background:rgba(1,4,14,.75)}
.modal.on{display:grid}
.modal .win{width:100%;max-width:370px;text-align:center;animation:pop .5s cubic-bezier(.2,1.5,.4,1)}
.modal .bd{padding:22px 18px}
.modal .huge{font:700 3.6rem/1.1 "Chakra Petch",sans-serif;color:var(--rk,var(--glow));text-shadow:0 0 22px currentColor;margin:4px 0}
.modal p{margin:6px 0}
@keyframes pop{from{transform:scale(.8);opacity:0}to{transform:none;opacity:1}}
.toast{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);left:50%;z-index:40;transform:translate(-50%,-160%);transition:transform .3s;
  background:var(--panel);border:1px solid var(--glow);padding:10px 16px;font:600 .92rem "Chakra Petch",sans-serif;color:var(--ink);
  box-shadow:0 0 20px color-mix(in srgb,var(--glow) 35%,transparent);max-width:90vw;text-align:center;backdrop-filter:blur(8px)}
.toast.on{transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* v0.3: agora, linha do dia, trilha */
.strip{display:flex;justify-content:space-between;gap:4px;padding:10px 14px}
.strip div{flex:1;text-align:center;font-size:.72rem;color:var(--mute)}
.strip i{display:block;width:26px;height:26px;margin:0 auto 3px;border:1px solid color-mix(in srgb,var(--line) 45%,transparent);background:var(--input);transform:rotate(45deg)}
.strip .f i{background:linear-gradient(135deg,var(--gold),#ff7a3d);border-color:var(--gold);box-shadow:0 0 10px color-mix(in srgb,var(--gold) 60%,transparent)}
.strip .x i{background:color-mix(in srgb,var(--red) 40%,transparent);border-color:var(--red)}
.strip .t{color:var(--ink);font-weight:600}
.strip .t i{border-color:var(--glow);border-width:2px}
.fire{font:700 1rem "Chakra Petch",sans-serif;color:var(--gold)}
.now .when{font-size:.9rem;color:var(--mute);text-align:center}
.now .big{font:700 1.6rem/1.2 "Chakra Petch",sans-serif;text-align:center;margin:6px 0 4px;text-shadow:0 0 16px color-mix(in srgb,var(--glow) 40%,transparent)}
.now .cd{text-align:center;font-size:.95rem;margin-bottom:4px}
.now .cd b{font-family:"Chakra Petch",sans-serif;color:var(--glow);font-size:1.15rem}
.now .cd.late b{color:var(--red)}
.now .pts{display:flex;justify-content:center;gap:8px;margin-top:6px}
.btn.xl{padding:15px;font-size:1.1rem}
.sp{border-color:color-mix(in srgb,var(--gold) 70%,transparent);box-shadow:0 0 24px color-mix(in srgb,var(--gold) 20%,transparent)}
.sp .tab span{color:var(--gold);border-color:color-mix(in srgb,var(--gold) 70%,transparent);background:color-mix(in srgb,var(--gold) 10%,transparent);text-shadow:0 0 10px color-mix(in srgb,var(--gold) 50%,transparent)}
.sp .ttl{font:600 1.1rem "Chakra Petch",sans-serif;text-align:center;margin:2px 0 8px}
.tl{display:grid;grid-template-columns:50px 16px 1fr auto;gap:10px;align-items:center;padding:10px 2px;border-bottom:1px dashed color-mix(in srgb,var(--line) 30%,transparent)}
.tl:last-child{border-bottom:0}
.tl .tm{font:600 .95rem "Chakra Petch",sans-serif;color:var(--mute)}
.tl .dt{width:12px;height:12px;border:2px solid var(--line);transform:rotate(45deg)}
.tl .main{background:none;border:0;text-align:left;padding:0;min-width:0}
.tl .main b{display:block;font-weight:600}
.tl .sub{font-size:.8rem;color:var(--mute)}
.tl .st{font:600 .85rem "Chakra Petch",sans-serif;white-space:nowrap}
.tl.done .dt{background:var(--ok);border-color:var(--ok)}.tl.done .st{color:var(--ok)}.tl.done .main b{color:var(--mute)}
.tl.fail .dt{background:var(--red);border-color:var(--red)}.tl.fail .st{color:var(--red)}
.tl.exc .dt{border-color:var(--mute)}.tl.exc .st{color:var(--mute)}
.tl.act .dt{background:var(--glow);border-color:var(--glow);box-shadow:0 0 10px var(--glow)}.tl.act .st{color:var(--glow)}
.tl.act .tm{color:var(--glow)}
.demo{display:flex;gap:6px;flex-wrap:wrap;align-items:center;justify-content:center;padding:12px;border:1px dashed color-mix(in srgb,var(--line) 55%,transparent);margin-top:4px}
.demo span{width:100%;text-align:center;font-size:.8rem;color:var(--mute)}
/* trilha */
.floor{text-align:center;margin:18px 0 8px}
.floor b{font:600 1.05rem "Chakra Petch",sans-serif;color:var(--glow)}
.path{display:flex;flex-direction:column;align-items:center;gap:14px;padding:6px 0 10px}
.node{width:66px;height:66px;border-radius:50%;border:2px solid color-mix(in srgb,var(--line) 50%,transparent);background:var(--input);color:var(--mute);
  font:700 1.2rem "Chakra Petch",sans-serif;display:grid;place-items:center;position:relative}
.node.done{background:var(--line);border-color:var(--glow);color:#fff;box-shadow:0 0 12px color-mix(in srgb,var(--glow) 40%,transparent)}
.node.cur{border-color:var(--glow);color:var(--glow);box-shadow:0 0 0 6px color-mix(in srgb,var(--glow) 15%,transparent),0 0 22px var(--glow);animation:pulse 1.8s infinite}
.node.boss{width:84px;height:84px;border-color:color-mix(in srgb,var(--gold) 60%,transparent);color:var(--gold)}
.node.boss.done{background:linear-gradient(135deg,var(--gold),#ff7a3d);color:#1a1000}
.node .lb{position:absolute;top:100%;margin-top:4px;font:600 .72rem Barlow,sans-serif;color:var(--mute);white-space:nowrap}
.node.cur .lb{color:var(--glow)}
@keyframes pulse{50%{box-shadow:0 0 0 12px color-mix(in srgb,var(--glow) 0%,transparent),0 0 30px var(--glow)}}
.timerbig{font:700 2.6rem "Chakra Petch",sans-serif;text-align:center;color:var(--glow);text-shadow:0 0 18px var(--glow)}

/* v0.4: contexto, cartões, plano por blocos, relâmpago */
.ctx .bd{padding:12px 14px}
.ctx .where{font:700 1.35rem/1.2 "Chakra Petch",sans-serif;text-align:center;text-shadow:0 0 14px color-mix(in srgb,var(--glow) 40%,transparent)}
.ctx .sub{text-align:center;font-size:.88rem;color:var(--mute);margin-top:2px}
.ctx .clock{text-align:center;font:600 .85rem "Chakra Petch",sans-serif;color:var(--glow)}
.mc{padding:12px 0;border-bottom:1px dashed color-mix(in srgb,var(--line) 30%,transparent)}
.mc:last-child{border-bottom:0}
.mc .hd{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.mc .nm{font-weight:600;font-size:1.05rem;background:none;border:0;padding:0;text-align:left}
.mc .meta{font-size:.82rem;color:var(--mute)}
.mc .cd{font:600 .85rem "Chakra Petch",sans-serif;color:var(--glow);white-space:nowrap}
.mc .cd.late{color:var(--red)}
.mc .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.mc .acts .btn{flex:1;min-width:88px;padding:11px 10px}
.mc .bar{margin-top:8px;height:5px}
.flash{border-color:var(--gold);box-shadow:0 0 26px color-mix(in srgb,var(--gold) 30%,transparent);animation:glowf 1.6s infinite}
.flash .tab span{color:var(--gold);border-color:var(--gold);background:color-mix(in srgb,var(--gold) 12%,transparent)}
@keyframes glowf{50%{box-shadow:0 0 38px color-mix(in srgb,var(--gold) 45%,transparent)}}
.flash .txt{font:600 1.15rem "Chakra Petch",sans-serif;text-align:center;margin:2px 0 4px}
.blk{display:grid;grid-template-columns:50px 1fr;gap:10px;padding:9px 2px;border-bottom:1px dashed color-mix(in srgb,var(--line) 25%,transparent)}
.blk:last-child{border-bottom:0}
.blk .tm{font:600 .9rem "Chakra Petch",sans-serif;color:var(--mute);padding-top:1px}
.blk .lb{font-weight:600}
.blk.past .lb,.blk.past .tm{color:var(--mute);opacity:.7}
.blk.cur{background:var(--soft);margin:0 -8px;padding-left:10px;padding-right:10px;border-left:2px solid var(--glow)}
.blk.cur .tm,.blk.cur .lb{color:var(--glow)}
.mchips{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px}
.mchip{font-size:.78rem;padding:3px 8px;border:1px solid color-mix(in srgb,var(--line) 45%,transparent);background:var(--input);color:var(--ink)}
.mchip.done{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 50%,transparent)}
.mchip.fail{color:var(--red);border-color:color-mix(in srgb,var(--red) 50%,transparent)}
.mchip.exc{color:var(--mute)}
.mchip.fl{color:var(--gold);border-color:color-mix(in srgb,var(--gold) 45%,transparent);background:transparent}
.quiet{text-align:center;color:var(--mute);font-size:.92rem;margin:0}
/* ===== v1.0: carta, painel, onboarding ===== */
.hud{grid-template-columns:auto 1fr}
.mini{position:relative;width:58px;height:74px;border:0;padding:0;border-radius:8px 8px 14px 14px;overflow:hidden;background:var(--rkbg,#3a2a18);box-shadow:0 0 14px color-mix(in srgb,var(--rk) 45%,transparent)}
.mini-img{width:100%;height:100%;object-fit:cover;display:block}
.mini .ph0,.pc-img.ph0,.pf-img.ph0{display:grid;place-items:center;font:700 1.4rem "Chakra Petch",sans-serif;color:#1a1206;background:linear-gradient(160deg,rgba(255,255,255,.35),rgba(0,0,0,.15))}
.mini-ovr{position:absolute;left:4px;top:2px;z-index:2;font:700 1.15rem/1 "Chakra Petch",sans-serif;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.7)}
.mini.t-ouro{background:linear-gradient(160deg,#f7df8a,#b8862b)}.mini.t-prata{background:linear-gradient(160deg,#eef2f8,#8e9aab)}.mini.t-bronze{background:linear-gradient(160deg,#e9b88b,#8a5230)}.mini.t-forma{background:linear-gradient(160deg,#1b3f86,#0a1638)}
.cardwrap{display:flex;justify-content:center;margin:6px 0 18px}
.pcard{position:relative;width:min(280px,78vw);aspect-ratio:.76;padding:18px 18px 16px;color:#1a1206;clip-path:polygon(12% 0,88% 0,100% 7%,100% 88%,50% 100%,0 88%,0 7%);
  display:flex;flex-direction:column;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.45)}
.pcard::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.28) 45%,transparent 60%);background-size:250% 100%;animation:shine 5s infinite;pointer-events:none}
@keyframes shine{0%{background-position:150% 0}60%,100%{background-position:-100% 0}}
.pcard.t-ouro{background:linear-gradient(160deg,#fbe9a6 0%,#e6c056 45%,#a57726 100%)}
.pcard.t-prata{background:linear-gradient(160deg,#ffffff 0%,#c9d3e0 45%,#7d8a9c 100%)}
.pcard.t-bronze{background:linear-gradient(160deg,#f3cba5 0%,#c98a55 45%,#7a4526 100%)}

<div class="modal" id="modal" role="dialog" aria-modal="true"><div class="win"><div class="tab"><span id="mTab">Notificação</span></div><div class="bd" id="mBody"></div></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
"use strict";
/* =====================================================================
   EVOLUÇÃO v1.0 — sua evolução pessoal em forma de carta
   Módulos: Perfil · Água · Treino · Corpo · Rotina · Carta
   Camadas: 1 Utilidades · 2 Relógio · 3 Estado · 4 Agenda · 5 Regras
            6 Módulos · 7 Motor · 8 Efeitos · 9 Telas · 10 Ações · 11 Integrações
   ===================================================================== */
/* ---------- 1. Utilidades ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const clone=o=>JSON.parse(JSON.stringify(o));
const pad=n=>String(n).padStart(2,"0");
const num=n=>String(+(+n).toFixed(2)).replace(".",",");
const toMin=t=>{const[h,m]=String(t||"0:0").split(":").map(Number);return(h||0)*60+(m||0)};
const hm=m=>{m=Math.max(0,Math.min(1439,Math.round(m)));return`${pad(Math.floor(m/60))}:${pad(m%60)}`};
const dur=s=>{s=Math.max(0,Math.round(s));const h=Math.floor(s/3600),m=Math.floor(s%3600/60);return h?`${h}h ${pad(m)}min`:m?`${m}min`:`${s}s`};
const DOW=["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"],ALL=[0,1,2,3,4,5,6],WEEK=[1,2,3,4,5];
const MES=["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
const addDays=(s,n)=>{const d=new Date(s+"T12:00:00Z");d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)};
const dow=s=>new Date(s+"T12:00:00Z").getUTCDay();
const weekKey=s=>addDays(s,-((dow(s)+6)%7));
const fmt=s=>{const d=new Date(s+"T12:00:00Z");return`${DOW[d.getUTCDay()]}, ${d.getUTCDate()} ${MES[d.getUTCMonth()]}`};
const daysTxt=d=>d.length===7?"todo dia":d.join()==="1,2,3,4,5"?"seg a sex":d.join()==="0,6"?"fim de semana":d.map(x=>DOW[x]).join(", ");
function seeded(str){let h=2166136261;for(const c of str)h=Math.imul(h^c.charCodeAt(0),16777619);return()=>{h=Math.imul(h^(h>>>15),2246822507);h=Math.imul(h^(h>>>13),3266489909);return((h^=h>>>16)>>>0)/4294967296}}

const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const r1=x=>Math.round(x*10)/10;
const ATTRS={FIS:"Físico",MEN:"Mente",DIS:"Disciplina",SAU:"Saúde",CAR:"Carreira"};
const ATTR_SHORT={FIS:"FÍS",MEN:"MEN",DIS:"DIS",SAU:"SAÚ",CAR:"CAR"};
const STATS=ATTRS;
const GOALS={massa:"Ganhar massa e força",gordura:"Perder gordura",saude:"Saúde e condicionamento"};
const CTX={onibus:"no ônibus",casa:"em casa de manhã",almoco:"no almoço",noite:"à noite",livre:"no tempo livre",any:"a qualquer hora"};
const KINDS={check:"Sim ou não",qty:"Quantidade (páginas, minutos…)",presence:"Presença com duração (ex.: vôlei)"};
const TYPES={hora:"No horário",dia:"Qualquer hora do dia",semana:"Vezes por semana"};
const KIND_BY_TYPE={hora:["check"],dia:["check","qty"],semana:["check","presence"]};
const need=l=>100+(l-1)*30;
const TIERS=[{min:75,id:"ouro",l:"Ouro",c:"#ffd166"},{min:65,id:"prata",l:"Prata",c:"#c9d6e8"},{min:0,id:"bronze",l:"Bronze",c:"#d08a55"}];

/* ---------- 2. Relógio (virtual no modo demo) ---------- */
const vnow=()=>new Date(Date.now()+(S.offset||0));
const vdate=()=>{const d=vnow();return`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`};
const vmin=()=>{const d=vnow();return d.getHours()*60+d.getMinutes()+d.getSeconds()/60};

const todayIso=()=>{const d=new Date();return`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`};

/* ---------- 3. Estado e persistência ---------- */
const DEF_SCHED={work:WEEK.slice(),wd:{wake:"06:30",leave:"07:20",workStart:"08:00",lunch:"12:00",lunchDur:60,workEnd:"16:20",gym:"17:00",gymDur:90,sleep:"23:00"},we:{wake:"08:30",sleep:"23:30"}};
function mk(o){return Object.assign({id:uid(),type:"dia",kind:"check",days:ALL.slice(),stat:"DIS",xp:20,bonus:0,loss:20,ctx:"any"},o)}
const newWeek=(date,cap=7)=>({key:weekKey(date),shields:1,counts:{},excused:{},cap,paused:0});
const INTEG0=()=>({email:"",gymLoc:null,gcid:"",gcal:false,gsync:0});
const ATTR0=()=>Object.fromEntries(Object.keys(ATTRS).map(k=>[k,{ema:.17,prev:.17}]));
const PROFILE0=()=>({weight:75,height:null,goal:"massa",trains:"livre",days:4,exp:"ini",glass:250});
/* Missões que nascem dos módulos e da rotina */
function buildMissions(c){const ms=[
  mk({id:"wake",type:"hora",kind:"wake",name:"Acordar",stat:"DIS",xp:20,bonus:10,loss:25,tol:15,late:60}),
  mk({id:"water",type:"dia",kind:"water",name:"Beber água",unit:"L",target:2.5,ctx:"any",stat:"SAU",xp:20,bonus:0,loss:15}),
  mk({id:"gym",type:"semana",kind:"gym",name:"Treino",times:c.days||4,prefDays:c.gymDays||[1,2,4,5],stat:"FIS",xp:30,bonus:8,loss:30}),
  mk({id:"weigh",type:"semana",kind:"weigh",name:"Pesagem",times:1,prefDays:[1],prefTime:"07:00",stat:"DIS",xp:10,bonus:0,loss:5}),
  mk({id:"sleep",type:"hora",kind:"sleep",name:"Dormir",stat:"SAU",xp:15,bonus:8,loss:15,tol:15,late:60})];
  if(c.pages)ms.splice(2,0,mk({id:"read",type:"dia",kind:"qty",name:"Ler",unit:"páginas",target:c.pages,steps:[5,10],auto:true,since:[],ctx:c.readCtx||"onibus",stat:"MEN",xp:20,bonus:5,loss:20}));
  if(c.study)ms.splice(3,0,mk({id:"study",type:"dia",kind:"qty",name:c.studyName||"Estudar",unit:"min",target:c.study,steps:[15,30],auto:false,since:[],ctx:"noite",stat:"CAR",xp:20,bonus:5,loss:15}));
  if(c.sport)ms.push(mk({id:"sport",type:"semana",kind:"presence",name:c.sport.name||"Esporte",times:c.sport.times||1,prefDays:c.sport.days||[4],prefTime:c.sport.time||"19:00",stat:"FIS",xp:40,bonus:0,loss:30,lastMin:90}));
  return ms}
function defaultState(){const iso=todayIso();return{v:7,updatedAt:Date.now(),accepted:false,name:"",photo:null,profile:PROFILE0(),
  level:1,xp:0,streak:0,best:0,sound:true,demo:false,offset:0,attrs:ATTR0(),
  sched:clone(DEF_SCHED),week:newWeek(iso),pending:[],flashRate:3,trail:0,trailLog:[],missions:buildMissions({days:4,pages:10}),
  program:null,body:{log:[]},history:[],log:[],today:{date:iso,e:{},flash:[],sp:false,bi:-1,warned:false,ci:false,ah:{}},report:null,paused:null,integ:INTEG0()}}
const LS="evolucao-v4";let S;
try{S=JSON.parse(localStorage.getItem(LS))}catch(e){}
/* Migração: nada do seu progresso se perde */
const STAT_MAP={STR:"FIS",AGI:"FIS",INT:"MEN",PER:"DIS",VIT:"SAU"};
function migrate(d){if(!d||typeof d!=="object")return null;
  if(d.v===4){d.v=5;d.paused=null;d.integ=INTEG0()}
  if(d.v===5&&Array.isArray(d.missions)){d.v=6;d.pending=[];d.week=Object.assign({counts:{},excused:{},cap:7,paused:0,shields:1},d.week||{});
    d.missions=d.missions.map(m=>m.kind==="wake"?Object.assign(m,{type:"hora",bonus:10,tol:15,late:60}):m.kind==="sleep"?Object.assign(m,{type:"hora",bonus:8,tol:15,late:60}):
      m.kind==="gym"?Object.assign(m,{type:"semana",times:4,prefDays:(m.days||[1,2,3,4,5]).slice(),bonus:8,days:ALL.slice()}):m.kind==="presence"?Object.assign(m,{type:"semana",times:1,prefDays:(m.days||[4]).slice(),prefTime:m.time||"19:00",bonus:0,days:ALL.slice()}):Object.assign(m,{type:"dia",bonus:5}))}
  if(d.v===6&&Array.isArray(d.missions)){d.v=7;d.photo=null;d.profile=null;d.attrs=ATTR0();d.body={log:[]};
    const oldGym=d.missions.find(m=>m.kind==="gym");
    d.program=oldGym&&oldGym.exercises&&oldGym.exercises.length?{name:"Meu treino",created:d.today.date,basic:false,splits:[{id:"A",name:"Treino atual",ex:oldGym.exercises.map(x=>Object.assign({best:0,stall:0,hist:[]},x))}],next:0,sessions:[]}:null;
    d.missions=d.missions.map(m=>{m.stat=STAT_MAP[m.stat]||m.stat||"DIS";if(m.kind==="wake")m.stat="DIS";if(m.kind==="sleep")m.stat="SAU";
      if(m.id==="water"){m.kind="water";m.stat="SAU";m.xp=20}if(m.kind==="gym"){m.name="Treino";delete m.exercises}
      if(m.id==="volei"){m.id="sport"}return m});
    if(!d.missions.some(m=>m.id==="weigh"))d.missions.splice(d.missions.length-1,0,mk({id:"weigh",type:"semana",kind:"weigh",name:"Pesagem",times:1,prefDays:[1],prefTime:"07:00",stat:"DIS",xp:10,bonus:0,loss:5}));
    if(d.today){d.today.ah={};if(d.today.e&&d.today.e.volei){d.today.e.sport=d.today.e.volei;delete d.today.e.volei}}
    if(d.week&&d.week.counts&&d.week.counts.volei!=null){d.week.counts.sport=d.week.counts.volei;delete d.week.counts.volei}
    delete d.rank;delete d.statXP}
  if(d.v!==7||!Array.isArray(d.missions))return null;
  d.integ=Object.assign(INTEG0(),d.integ||{});d.pending=d.pending||[];d.attrs=d.attrs||ATTR0();d.body=d.body||{log:[]};d.today.ah=d.today.ah||{};
  d.week=Object.assign({counts:{},excused:{},cap:7,paused:0,shields:1},d.week||{});return d}
S=migrate(S)||defaultState();
function save(){S.updatedAt=Date.now();try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){try{S.log=S.log.slice(0,60);localStorage.setItem(LS,JSON.stringify(S))}catch(x){toast("Memória do app cheia: exporte um backup","red")}}}

/* ---------- 4. Agenda: blocos do dia ---------- */
const isWork=date=>S.sched.work.includes(dow(date));
const daySched=date=>isWork(date)?S.sched.wd:S.sched.we;
const M=id=>S.missions.find(m=>m.id===id);
const dueOn=(m,date)=>m.type!=="semana"&&m.days.includes(dow(date));
function gymPlanned(date){const g=M("gym");if(!g||!g.prefDays.includes(dow(date)))return false;if(date!==S.today.date)return true;return !!ent(g).done||weekCount(g)<weekReq(g)}
function blocks(date){const out=[];const add=(id,a,b,label)=>{a=Math.max(a,out.length?out[out.length-1].b:0);b=Math.min(b,1440);if(b>a)out.push({id,a,b,label})};
  const gt=gymPlanned(date);
  if(isWork(date)){const d=S.sched.wd,W=toMin(d.wake),L=toMin(d.leave),WS=toMin(d.workStart),LU=toMin(d.lunch),LE=LU+(+d.lunchDur||60),WE=toMin(d.workEnd),C=Math.max(10,WS-L),SL=toMin(d.sleep);
    add("sono",0,W,"Dormindo");add("casa",W,L,"Manhã em casa");add("onibus",L,WS,"Ônibus · ida");add("trabalho",WS,LU,"Trabalho");add("almoco",LU,LE,"Almoço");
    const G=toMin(d.gym),GD=+d.gymDur||90;add("trabalho",LE,WE,"Trabalho");add("onibus",WE,gt&&G>WE?Math.min(WE+C,G):WE+C,"Ônibus · volta");
    if(gt){const lb=out[out.length-1].b;if(G>lb)add("noite",lb,G,"Em casa");if(G>=out[out.length-1].b)out.push({id:"academia",a:G,b:Math.min(1440,G+GD),label:"Academia"});else add("academia",G,G+GD,"Academia")}
    add("noite",out[out.length-1].b,SL,"Noite em casa");add("sono",SL,1440,"Dormindo")}
  else{const d=S.sched.we,W=toMin(d.wake),SL=toMin(d.sleep);add("sono",0,W,"Dormindo");add("livre",W,720,"Manhã livre");
    if(gt){const G=toMin(S.sched.wd.gym);add("livre",720,G,"Tarde livre");add("academia",G,G+(+S.sched.wd.gymDur||90),"Academia")}
    add("livre",out[out.length-1].b,Math.max(1080,out[out.length-1].b),"Tarde livre");add("noite",out[out.length-1].b,SL,"Noite");add("sono",SL,1440,"Dormindo")}
  return out}
const blockAt=(date,m)=>{const bl=blocks(date);const i=bl.findIndex(b=>m>=b.a&&m<b.b);return{i,b:bl[i],bl}};


/* ---------- 5. Regras: 3 tipos de tempo (hora · dia · semana) ---------- */
const ent=m=>S.today.e[m.id]||(S.today.e[m.id]={});
const resolved=e=>!!(e.done||e.failed||e.excused);
const isFixed=m=>m.type==="hora";
const isWeekly=m=>m.type==="semana";
const weeklies=()=>S.missions.filter(isWeekly);
const target=(m,date=S.today.date)=>m.kind==="wake"?toMin(daySched(date).wake):m.kind==="sleep"?toMin(daySched(date).sleep):m.kind==="gym"?toMin(S.sched.wd.gym):toMin(m.target||m.prefTime||"09:00");
function win(m,date=S.today.date){const d=daySched(date),W=toMin(d.wake),SL=Math.min(1439,toMin(d.sleep)),tg=target(m,date);
  if(m.type==="hora"){const open=m.kind==="wake"?tg-180:m.kind==="sleep"?tg-120:tg-60;return{open:Math.max(0,open),start:tg,end:Math.min(1439,tg+(m.late||60))}}
  if(m.type==="semana")return{open:0,start:tg,end:Math.min(1439,tg+150)};return{open:0,start:W,end:SL}}
const dueToday=()=>S.missions.filter(m=>dueOn(m,S.today.date)).sort((a,b)=>win(a).start-win(b).start);
function weekCount(m){return S.week.counts[m.id]||0}
function weekReq(m){const base=Math.min(m.times||1,S.week.cap||7),p=S.week.paused||0;return Math.max(0,Math.ceil(base*(7-p)/7)-(S.week.excused[m.id]||0))}
const daysLeftWeek=(date=S.today.date)=>7-((dow(date)+6)%7);
function title(m){const d=daySched(S.today.date);if(m.kind==="wake")return`Acordar às ${d.wake}`;if(m.kind==="sleep")return`Dormir até ${d.sleep}`;
  if(m.kind==="water")return`Beber água ${num(m.target)} L`;if(m.type==="hora")return`${m.name} às ${hm(target(m))}`;if(m.kind==="qty")return`${m.name} ${num(m.target)} ${m.unit}`;return m.name}
function whenTxt(m){if(m.type==="hora"){const tg=target(m);return`alvo ${hm(tg)} · no horário até ${hm(tg+(m.tol||15))}`}
  if(m.type==="semana"){const r=weekReq(m),c=weekCount(m);return`${c}/${r} na semana · de preferência ${m.prefDays.length===7?"qualquer dia":daysTxt(m.prefDays)}${m.kind==="gym"?` às ${S.sched.wd.gym}`:m.kind==="weigh"?" de manhã":` às ${hm(target(m))}`}`}
  if(m.kind==="water")return`em ${waterRounds(S.today.date).length} rodadas · até dormir`;
  const has=blocks(S.today.date).some(b=>b.id===m.ctx);return`${has&&m.ctx!=="any"?CTX[m.ctx]:"quando der"} · até dormir`}
function xpTxt(m){return`+${m.xp}${m.bonus?` (+${m.bonus} ${m.type==="dia"?"no momento certo":"no horário"})`:""} / −${m.loss}`}
function timeGrade(m,t,date=S.today.date){const tg=target(m,date),dlt=t-tg;return dlt<=(m.tol||15)?"on":dlt<=(m.late||60)?"late":"miss"}
function suggested(m,now){const e=ent(m);if(resolved(e))return false;if(m.kind==="water"||m.kind==="gym")return false;const tg=target(m);
  if(m.type==="hora"){if(m.kind==="wake")return now>=tg-120&&now<720;if(m.kind==="sleep")return now>=tg-60;return now>=tg-15&&now<tg+(m.late||60)}
  if(m.type==="semana"){if(e.done||weekCount(m)>=weekReq(m))return false;const pref=m.prefDays.includes(dow(S.today.date)),{b}=blockAt(S.today.date,now);
    if(m.kind==="weigh")return pref&&now>=toMin(daySched(S.today.date).wake)&&now<720||weekReq(m)-weekCount(m)>=daysLeftWeek()&&!!b&&["casa","livre"].includes(b.id);

/* ===== Água: peso × 35 ml (25 ml se IMC ≥ 30) + 0,5 L por treino ou esporte no dia, em rodadas ===== */
function bmi(){const p=S.profile;return p&&p.height?p.weight/((p.height/100)**2):0}
function waterExtra(date){const sp=M("sport");return(gymPlanned(date)?.5:0)+(sp&&sp.prefDays.includes(dow(date))?.5:0)}
function waterBase(){const p=S.profile||PROFILE0();return p.weight*(bmi()>=30?25:35)/1000}
function waterTarget(date){return clamp(r1(waterBase()+waterExtra(date)),1.5,5)}
function waterRounds(date=S.today.date){const bl=blocks(date).filter(b=>b.id!=="sono"),d=daySched(date),W=toMin(d.wake),SL=toMin(d.sleep),w=M("water");
  const tot=w&&date===S.today.date?w.target:waterTarget(date),ac=bl.find(b=>b.id==="academia"),gx=ac?.5:0,base=Math.max(0,tot-waterExtra(date)),spx=Math.max(0,waterExtra(date)-gx);
  const lu=bl.find(b=>b.id==="almoco"),mid=isWork(date)?(lu?lu.a:720):720,aft=ac?ac.a:isWork(date)?Math.min(SL-120,toMin(S.sched.wd.workEnd)+40):1080;
  const R=[{id:"manha",l:"Manhã",a:W,b:mid,t:base*.35},{id:"tarde",l:"Tarde",a:mid,b:aft,t:base*.35}];
  if(ac)R.push({id:"treino",l:"Treino",a:ac.a,b:ac.b,t:gx});R.push({id:"noite",l:"Noite",a:R[R.length-1].b,b:Math.max(R[R.length-1].b+30,SL-60),t:base*.30+spx});
  let cum=0;R.forEach((r,i)=>{r.t=i===R.length-1?r1(tot-cum):r1(r.t);cum=r1(cum+r.t);r.cum=cum});return R}
function drunkBy(e,min){const L=e.log||[],all=L.reduce((s,x)=>s+x.v,0),extra=Math.max(0,(e.value||0)-all);return r1(extra+L.filter(x=>x.t<=min).reduce((s,x)=>s+x.v,0))}

function genFlash(date){if(S.paused)return[];const d=daySched(date),W=toMin(d.wake)+20,SL=toMin(d.sleep)-40;
  const rs=blocks(date).filter(b=>b.id!=="sono"&&b.id!=="academia").map(b=>({id:b.id,a:Math.max(b.a,W),b:Math.min(b.b,SL)})).filter(x=>x.b-x.a>=25);
  const total=rs.reduce((s,x)=>s+x.b-x.a,0);if(total<60)return[];const r=seeded("f"+date),used=new Set(),out=[],n=S.flashRate;
  for(let k=0;k<n;k++){let t=(k+.15+.7*r())/n*total,at=0,bid="";for(const x of rs){const len=x.b-x.a;if(t<=len){at=x.a+t;bid=x.id;break}t-=len}
    at=Math.round(Math.min(at,SL-20));const discreet=bid==="trabalho"||bid==="onibus";
    const want=discreet?"d":(r()<.7?"c":"d");let pool=FLASH.filter(f=>!used.has(f[0])&&f[3]===want);if(!pool.length)pool=FLASH.filter(f=>!used.has(f[0])&&(discreet?f[3]==="d":true));const[text,stat,link]=pool[Math.floor(r()*pool.length)];used.add(text);
    out.push({id:"f"+k,text,stat,link,at,exp:at+20,xp:10,st:"wait"})}
  return out.sort((a,b)=>a.at-b.at)}
function newDay(date){const w=M("water");if(w&&!S.paused)w.target=waterTarget(date);return{date,e:{},flash:genFlash(date),sp:false,bi:-1,warned:false,ci:false,ah:{},wr:{}}}

/* ---------- 7. Motor ---------- */
const ev=[];const emit=(t,x={})=>ev.push({t,...x});
function hist(date){return S.history.find(h=>h.date===date)}
function recomputeStreak(){let s=0;for(let i=S.history.length-1;i>=0;i--){const h=S.history[i];if(h.paused||!h.due)continue;if(h.done+(h.pend||0)>=h.due)s++;else break}
  S.streak=s;S.best=Math.max(S.best,s)}
function pushSince(m,v){if(m.kind!=="qty"||!m.auto)return;m.since=m.since||[];m.since.push(v);if(m.since.length<7)return;
  const rate=m.since.reduce((s,x)=>s+x,0)/m.since.length,old=m.target;
  if(rate>=.8)m.target=Math.ceil(m.target*1.1);else if(rate<=.3)m.target=Math.max(1,Math.floor(m.target*.9));
  if(m.target!==old)log(`${m.name}: meta ${m.target>old?"sobe":"desce"} de ${num(old)} para ${num(m.target)} ${m.unit}.`);m.since=[]}
function failM(m,e,why,silent){if(e){e.failed=true}addXP(-m.loss);hit(m.stat,false);log(`${title(m)}: não cumprida${why?` (${why})`:""}. −${m.loss} XP.`);if(!silent)emit("fail",{m})}
function resolvePending(p,ok,grade){const m=M(p.id),h=hist(p.date);S.pending=S.pending.filter(x=>x!==p);if(!m)return;if(h)h.pend=Math.max(0,(h.pend||0)-1);
  const late=m.kind==="sleep"?grade:(ok?"late":"miss");
  if(late!=="miss"){const x=m.xp+(late==="on"?m.bonus||0:0);addXP(x);hit(m.stat,true);if(h)h.done++;log(`${title(m)} (${fmt(p.date)}): confirmada. +${x} XP.`);toast(`${m.name} de ontem · +${x} XP`)}
  else{failM(m,null,fmt(p.date),true);toast(`${m.name} de ontem · −${m.loss} XP`,"red")}
  pushSince(m,late!=="miss"?1:0);recomputeStreak()}
function tick(now,silent){const t=S.today;let ch=false;
  const{i,b}=blockAt(t.date,now);if(i!==t.bi){t.bi=i;ch=true;if(!silent&&b&&!S.paused)emit("block",{b})}
  if(S.paused)return ch;
  for(const m of dueToday()){const e=ent(m);if(resolved(e))continue;const tg=target(m);
    if(m.type==="hora"){
      if(m.kind==="wake"&&now>=720){failM(m,e,"sem confirmação até 12:00",silent);ch=true;continue}
      if(m.kind!=="wake"&&m.kind!=="sleep"&&now>=tg+(m.late||60)){failM(m,e,"passou do horário",silent);ch=true;continue}
      const at=m.kind==="sleep"?tg-30:tg;if(now>=at&&!e.pinged){e.pinged=true;ch=true;if(!silent)emit("start",{m})}}}
  for(const m of weeklies()){const e=ent(m);if(e.done||e.excused||!m.prefDays.includes(dow(t.date))||weekCount(m)>=weekReq(m))continue;
    const at=m.kind==="weigh"?toMin(daySched(t.date).wake)+10:target(m);if(now>=at&&!e.pinged){e.pinged=true;ch=true;if(!silent)emit("week",{m})}}
  const w=M("water");if(w&&dueOn(w,t.date)&&!resolved(ent(w))){const e=ent(w),R=waterRounds(t.date);t.wr=t.wr||{};
    for(const r of R){const got=drunkBy(e,r.b);if(!t.wr[r.id]&&now>=r.b-30&&now<r.b&&got<r.cum-.15){t.wr[r.id]="n";ch=true;if(!silent)emit("water",{r,need:r1(r.cum-got)})}
      if(t.wr[r.id]!=="ok"&&now>=r.b&&got>=r.cum){t.wr[r.id]="ok";ch=true}}}
  const SL=toMin(daySched(t.date).sleep);
  if(!t.warned&&now>=SL-45&&now<SL){t.warned=true;ch=true;const p=dueToday().filter(m=>m.type==="dia"&&!resolved(ent(m)));if(p.length&&!silent)emit("warn",{p})}
  if(now>=720)for(const p of S.pending.filter(p=>p.date<t.date)){resolvePending(p,false,"miss");ch=true}
  for(const f of t.flash){if(f.st==="wait"&&now>=f.at){f.st=now>=f.exp?"miss":"live";ch=true;if(f.st==="live"&&!silent)emit("flash",{f})}
    else if(f.st==="live"&&now>=f.exp){f.st="miss";log(`Relâmpago expirou: ${f.text}.`);ch=true}}
  return ch}
function weekClose(lines){for(const m of weeklies()){const r=weekReq(m),c=weekCount(m),h=hist(S.today.date);if(h){h.due+=r;h.done+=Math.min(c,r)}
    if(c<r){const loss=(r-c)*m.loss;addXP(-loss);hit(m.stat,false,r-c);log(`${m.name}: ${c}/${r} na semana. −${loss} XP.`);lines.push(`${m.name}: ${c}/${r} na semana · −${loss} XP.`)}
    else if(r)lines.push(`${m.name}: meta da semana cumprida (${c}/${r}).`)}}
function closeDayPaused(){const t=S.today;S.history.push({date:t.date,due:0,done:0,fl:0,fd:0,sp:t.sp,paused:true});S.week.paused=(S.week.paused||0)+1;const lines=[];
  for(const k in ATTRS)S.attrs[k].prev=S.attrs[k].ema;if(dow(t.date)===0)weekClose(lines);const next=addDays(t.date,1);if(weekKey(next)!==S.week.key)S.week=newWeek(next);
  if(S.paused.until&&next>S.paused.until){S.paused=null;log("Pausa encerrada.")}S.today=newDay(next);return{date:t.date,n:0,d:0,pend:0,fl:0,fd:0,sp:t.sp,paused:true,lines}}
function closeDay(){if(S.paused)return closeDayPaused();const t=S.today,lines=[],before=ovr();let n=0,d=0,pend=0;
  for(const m of dueToday()){const e=t.e[m.id]||{};if(e.excused)continue;n++;
    if(e.done){d++;pushSince(m,1);continue}if(e.failed){pushSince(m,0);continue}
    if(m.type==="dia"||m.kind==="sleep"){S.pending.push({date:t.date,id:m.id});pend++;continue}
    failM(m,e,null,true);pushSince(m,0)}
  const fl=t.flash.length,fd=t.flash.filter(f=>f.st==="done").length;
  if(fl){const old=S.flashRate;if(fd===fl)S.flashRate=Math.min(5,S.flashRate+1);else if(fd===0)S.flashRate=Math.max(1,S.flashRate-1);if(S.flashRate!==old)log(`Relâmpagos por dia: ${old} → ${S.flashRate}.`)}
  S.history.push({date:t.date,due:n,done:d,pend,fl,fd,sp:t.sp,ovr:before});
  if(dow(t.date)===0)weekClose(lines);
  updateAttrs();const after=ovr(),tb=tierOf(before),ta=tierOf(after);if(tb.id!==ta.id){const up=after>before;log(`Carta ${up?"subiu":"caiu"} para ${ta.l} (${after}).`);queue({k:"tier",up,v:after})}
  if(after!==before)lines.push(`Carta: ${before} → ${after}.`);
  const next=addDays(t.date,1);if(weekKey(next)!==S.week.key)S.week=newWeek(next);
  recomputeStreak();S.today=newDay(next);return{date:t.date,n,d,pend,fl,fd,sp:t.sp,lines}}
function rollover(){const vd=vdate();if(S.today.date>=vd)return false;const reps=[];let g=0;
  while(S.today.date<vd&&g++<60){tick(1439,true);if(reps.length)for(const p of S.pending.filter(p=>p.date<S.today.date))resolvePending(p,false,"miss");reps.push(closeDay())}
  const r=reps[reps.length-1],L=[];if(reps.length>1)L.push(`${reps.length} dias processados enquanto você esteve fora. O que ficou sem confirmar nesses dias contou como falha.`);
  if(r.paused)L.push("Dia em pausa: sem perdas.");else if(r.n)L.push(`Rotina de ${fmt(r.date)}: ${r.d}/${r.n} feitas${r.pend?` · ${r.pend} para confirmar no Bom dia`:""}.`);else L.push("Dia sem rotina.");
  L.push(...reps.flatMap(x=>x.lines||[]));if(r.fl)L.push(`Relâmpagos: ${r.fd}/${r.fl}.`);if(r.sp)L.push("Missão especial concluída.");

function wizFinish(){const p={weight:wd.weight,height:wd.height||null,goal:wd.goal,trains:wd.trains,days:wd.days,exp:wd.trains==="nao"?"ini":"int",glass:wd.glass};

    const rd=M("read");if(wd.pages&&rd){rd.target=wd.pages;rd.ctx=wd.readCtx}else if(wd.pages)S.missions.splice(1,0,mk({id:"read",type:"dia",kind:"qty",name:"Ler",unit:"páginas",target:wd.pages,steps:[5,10],auto:true,since:[],ctx:wd.readCtx,stat:"MEN",xp:20,bonus:5,loss:20}));else if(rd)S.missions=S.missions.filter(m=>m.id!=="read");
    const st=M("study");if(wd.study&&st){st.target=wd.study;st.name=wd.studyName}else if(wd.study)S.missions.splice(2,0,mk({id:"study",type:"dia",kind:"qty",name:wd.studyName,unit:"min",target:wd.study,steps:[15,30],auto:false,since:[],ctx:"noite",stat:"CAR",xp:20,bonus:5,loss:15}));else if(st)S.missions=S.missions.filter(m=>m.id!=="study");
    const sp=M("sport");if(wd.sportOn&&sp)Object.assign(sp,{name:wd.sportName,times:wd.sportTimes,prefDays:wd.sportDays.slice(),prefTime:wd.sportTime});else if(wd.sportOn)S.missions.push(mk({id:"sport",type:"semana",kind:"presence",name:wd.sportName,times:wd.sportTimes,prefDays:wd.sportDays,prefTime:wd.sportTime,stat:"FIS",xp:40,bonus:0,loss:30,lastMin:90}));else if(sp)S.missions=S.missions.filter(m=>m.id!=="sport")}
  if(!(wd.trains==="programa"&&S.program))S.program=genProgram(p);else S.program.basic=false;

    for(const m of dueToday())if(m.type==="hora"&&m.kind==="wake"&&now>=720)Object.assign(ent(m),{excused:true,late:true})}

function openMission(id){const m=M(id),e=ent(m),now=vmin();let h=`<h3>${esc(title(m))}</h3><div class="chips" style="margin-bottom:12px"><span class="tag">${TYPES[m.type]}</span><span class="tag">${ATTRS[m.stat]||""}</span><span class="tag g">+${m.xp}${m.bonus?` +${m.bonus}`:""}</span>${lossTag(m)}</div><p class="mute" style="margin:0 0 10px">${whenTxt(m)}</p>`;
  if(e.done)h+=`<p style="color:var(--ok)">Feita${e.at?` às ${e.at}`:""}${m.kind==="presence"&&e.value?` · ${e.value} min`:""}${e.grade==="on"?" · no horário":e.grade==="late"?" · atrasado":""}. +${e.xp} XP.</p>`;
  else if(e.failed)h+=`<p style="color:var(--red)">Não cumprida${e.at?` (registrado ${e.at})`:""}. −${m.loss} XP.</p>`;
  else if(e.excused)h+=`<p class="mute">${e.shield?"Protegida com escudo.":e.late?"O horário já tinha passado quando você começou.":"Não teve hoje. Sem perda."}</p>`;
  const open=m.type==="semana"?!(e.done||e.excused):!resolved(e);
  if(m.kind==="water"){const{R}=waterNow(),got=drunkBy(e,1440);h+=`${R.map(r=>`<div class="srow"><span>${r.l} · até ${hm(r.b)}</span><b style="color:${got>=r.cum?"var(--ok)":"var(--ink)"}">${num(r.t)} L${got>=r.cum?" ✓":""}</b></div>`).join("")}`;
    if(!e.failed)h+=`<div style="display:flex;gap:10px;align-items:center;margin-top:12px">${stepper("qv",(S.profile||PROFILE0()).glass/1000,false,.05)}<span class="mute">L</span></div><div class="btns"><button class="btn solid full" data-do="waterv">Adicionar</button>${(e.log||[]).length?`<button class="btn ghost full" data-do="waterundo">Desfazer último registro</button>`:""}</div>`}
  else if(open&&canAct(m)){
    if(m.type==="hora"){const def=m.kind==="sleep"?hm(Math.min(now,1439)):hm(Math.max(target(m)-180,Math.min(now,1439)));
      h+=`<label class="form" style="display:grid;gap:6px"><span class="mute">${m.kind==="sleep"?"Que horas foi dormir (ou vai agora)?":"Que horas aconteceu?"}</span><input id="tAt" type="time" value="${def}"></label>
      <div class="btns"><button class="btn solid full" data-do="timed" data-id="${m.id}">Registrar</button></div><p class="mute" style="margin:8px 0 0">Até ${hm(target(m)+(m.tol||15))}: no horário (+${m.bonus}). Até ${hm(target(m)+(m.late||60))}: atrasado. Depois disso: não cumprida.</p>`}
    else if(m.kind==="qty"){const v=e.value||0;h+=`<p style="margin:0">Hoje: <b class="disp" style="font-size:1.3rem;color:var(--glow)">${num(v)}/${num(m.target)}</b> ${esc(m.unit)}</p><div class="bar" style="margin:8px 0 14px"><i style="width:${Math.min(100,v/m.target*100)}%"></i></div>
      <div style="display:flex;gap:10px;align-items:center">${stepper("qv",m.steps[0],false,m.steps[0])}<span class="mute">${esc(m.unit)}</span></div><div class="btns"><button class="btn solid full" data-do="addv" data-id="${m.id}">Adicionar</button>${v>0?`<button class="btn ghost full" data-do="add" data-id="${m.id}" data-v="-${m.steps[0]}">Corrigir: −${num(m.steps[0])}</button>`:""}</div>`}
    else if(m.kind==="presence"&&e.asking)h+=`<p style="margin:0 0 8px">Quanto tempo durou?</p><div style="display:flex;gap:10px;align-items:center">${stepper("pm",m.lastMin||60,false,5)}<span class="mute">min</span></div><div class="btns"><button class="btn solid full" data-do="pres2" data-id="${m.id}">Registrar presença</button></div>`;
    else if(m.kind==="gym"){const s=nextSplit();h+=`${s?`<p style="margin:0 0 6px">Próximo: <b>${esc(s.name)}</b> · ${s.ex.length} exercícios</p>`:""}${inlineActs(m)}`}
    else h+=inlineActs(m)}
  else if(open)h+=`<p class="mute">Disponível a partir das ${hm(win(m).open)}.</p>`;
  if(e.done&&!e.logged&&m.kind!=="water")h+=`<div class="btns"><button class="btn ghost full" data-do="undo" data-id="${m.id}">Marquei errado: desfazer (−${e.xp} XP)</button></div>`;
  if(m.kind==="gym"&&e.done&&!e.logged)h+=`<div class="btns"><button class="btn full" data-do="session">Registrar cargas (opcional, +10 XP e recordes)</button></div>`;
  if(open&&m.kind!=="wake"&&m.kind!=="water")h+=`<div class="btns"><button class="btn ghost full" data-do="shield" data-id="${m.id}" ${S.week.shields<1?"disabled":""}>Usar escudo · ${m.type==="semana"?"tira 1 sessão da meta da semana":"sem perda hoje"} (${S.week.shields} na semana)</button></div>`;
  openSheet(h+`<div class="btns"><button class="btn ghost full" data-do="close">Fechar</button></div>`,id)}
function openCheckin(){const w=M("wake"),now=vmin(),y=S.pending;S.today.ci=true;let h=`<h3>Bom dia, ${esc(S.name||"Jogador")}</h3>`;

let wizOn=false;
function commit(){save();render();if(sheetOpen&&sheetId)sheetId==="__ci"?openCheckin():openMission(sheetId)}
const inCtx=m=>{const{b}=blockAt(S.today.date,vmin());return m.ctx&&m.ctx!=="any"&&b&&b.id===m.ctx};
function complete(m,extra=0,msg){const e=ent(m);if(m.type==="semana"?(e.done||e.excused):resolved(e))return;e.done=true;e.at=hm(vmin());e.xp=m.xp+extra;addXP(e.xp);hit(m.stat,true);
  if(m.type==="semana")S.week.counts[m.id]=weekCount(m)+1;log(`${title(m)}: feita. +${e.xp} XP.`);fx("ok");toast(msg||`${m.name} · +${e.xp} XP`)}
function completeTimed(m,t){const e=ent(m);if(resolved(e))return;const g=timeGrade(m,t);e.at=hm(t%1440);e.grade=g;
  if(g==="miss"){failM(m,e,`registrado ${hm(t%1440)}`,false);return}
  e.done=true;e.xp=m.xp+(g==="on"?m.bonus||0:0);addXP(e.xp);hit(m.stat,true);log(`${title(m)}: ${g==="on"?"no horário":"atrasado"} (${hm(t%1440)}). +${e.xp} XP.`);fx(g==="on"?"lvl":"ok");
  toast(g==="on"?`No horário · +${e.xp} XP`:`Atrasado · +${e.xp} XP`)}
function weeklyExtra(m){if(!m.prefDays.includes(dow(S.today.date)))return 0;return Math.abs(vmin()-target(m))<=45?m.bonus||0:0}
function addQty(m,n){const e=ent(m);if(resolved(e)&&!e.done)return;e.value=Math.max(0,+((e.value||0)+n).toFixed(2));
  if(!e.done&&e.value>=m.target){const b=inCtx(m)?m.bonus||0:0;complete(m,b,b?`${m.name}: meta batida no momento certo · +${m.xp+b} XP`:`${m.name}: meta batida · +${m.xp} XP`)}
  else if(!e.done){fx("ok");toast(`${m.name}: ${num(e.value)}/${num(m.target)} ${m.unit}`)}
  if(e.done&&!e.hidden&&e.value>=m.target*1.5){e.hidden=true;const b=Math.round(m.xp*.75);e.xp+=b;addXP(b);log(`Foi além do exigido. Recompensa oculta: +${b} XP.`);setTimeout(()=>{fx("lvl");toast(`Recompensa oculta · +${b} XP`,"gold")},900)}}
/* Água: registra com horário, fecha rodadas e a meta do dia */
function addWater(v){const w=M("water");if(!w)return;const e=ent(w);if(e.failed)return;e.log=e.log||[];const now=vmin();e.log.push({t:now,v});e.value=r1((e.value||0)+v);
  const{R}=waterNow(),got=drunkBy(e,1440);S.today.wr=S.today.wr||{};let msg=`Água: ${num(e.value)}/${num(w.target)} L`;
  for(const r of R){if(now<r.b&&got>=r.cum&&S.today.wr[r.id]!=="ok"&&S.today.wr[r.id]!=="b"){S.today.wr[r.id]="b";addXP(3);msg=`Rodada da ${r.l.toLowerCase()} fechada · +3 XP`;break}}
  if(!e.done&&e.value>=w.target){complete(w,0,`Meta de água batida · +${w.xp} XP`);return}fx("ok");toast(msg)}
function doMark(m){if(!canAct(m))return;
  if(m.type==="hora"){let t=vmin();if(m.kind==="sleep"&&t<300)t+=1440;completeTimed(m,t)}
  else if(m.kind==="gym"){const x=weeklyExtra(m);complete(m,x,`Presença no treino · +${m.xp+x} XP`);commit();setTimeout(openSession,350);return}
  else if(m.kind==="weigh"){openWeigh();return}
  else complete(m,m.type==="semana"?weeklyExtra(m):inCtx(m)?m.bonus||0:0);commit()}
function saveSession(){const s=nextSplit(),P=program(),g=M("gym");if(!s)return;const notes=[];let prs=0,top=true;
  s.ex.forEach((x,i)=>{const w=+String($(`#sw${i}`).value).replace(",",".")||0,r=Array.from({length:x.sets},(_,k)=>+$(`#g${i}_${k}`).value||0);
    if(!w)return;const first=!x.weight;x.weight=w;x.last=r;const best=Math.max(...r.map(v=>e1rm(w,v)));
    if(x.best&&best>x.best+.01){prs++;notes.push(`Recorde: ${x.name} (${num(r1(best))} kg estimado)`)}
    const improved=!x.best||best>x.best+.01;x.best=Math.max(x.best||0,best);x.stall=improved?0:(x.stall||0)+1;x.hist=(x.hist||[]).concat([{d:S.today.date,w,r}]).slice(-12);
    const ok=r.every(v=>v>=x.min),t=r.every(v=>v>=x.max);if(!t)top=false;
    if(first){notes.push(`${x.name}: carga inicial ${w} kg`);return}

    else if(!ok){x.fails++;if(x.fails>=2){x.weight=+(w*.9).toFixed(1);x.fails=0;x.last=r.map(()=>x.min);notes.push(`${x.name}: ajusta para ${x.weight} kg`)}}else x.fails=0});
  P.sessions.push({date:S.today.date,split:s.name,prs});P.sessions=P.sessions.slice(-60);P.next=(P.next+1)%P.splits.length;
  const e=g?ent(g):null;let bx=10+Math.min(3,prs)*10;if(e&&!e.done){complete(g,weeklyExtra(g))}if(e){e.logged=true;e.xp=(e.xp||0)+bx}addXP(bx);hit("FIS",true);
  log(`Treino ${s.name} registrado. +${bx} XP.`);notes.forEach(n=>log(n+"."));closeSheet();fx(prs?"lvl":"ok");toast(prs?`${prs} recorde(s) · +${bx} XP`:`Treino registrado · +${bx} XP`,prs?"gold":null);save();render();
  if(notes.length)queue({k:"msg",tab:"Treino",title:prs?"Novo recorde":"Treino ajustado",lines:notes.concat([`Próximo: ${nextSplit().name}`])})}

function resizePhoto(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const s=320,c=document.createElement("canvas");c.width=s;c.height=s;const x=c.getContext("2d"),m=Math.min(img.width,img.height);
  x.drawImage(img,(img.width-m)/2,(img.height-m)/2,m,m,0,0,s,s);res(c.toDataURL("image/jpeg",.82))};img.onerror=rej;img.src=r.result};r.onerror=rej;r.readAsDataURL(file)})}

/* ---------- 11. Integrações ---------- */
function nextDow(from,d){return addDays(from,(d-dow(from)+7)%7)}
function icsEsc(x){return String(x).replace(/\\/g,"\\\\").replace(/[;,]/g,m=>"\\"+m).replace(/\n/g,"\\n")}
function buildICS(){const base=location.origin+location.pathname,BY=["SU","MO","TU","WE","TH","FR","SA"],today=S.today.date,LINK={wake:"acordei",sleep:"dormir",gym:"academia",water:"agua",read:"ler&v=10"},G={};
  const put=(key,o,d)=>{(G[key]=G[key]||Object.assign(o,{days:[]})).days.push(d)};
  for(const m of S.missions){const ds=m.type==="semana"?m.prefDays:m.days;for(const d of ds){const date=nextDow(today,d);let a,b;
    if(m.type==="hora"){a=m.kind==="sleep"?target(m,date)-30:target(m,date);b=a+15}
    else if(m.type==="semana"){a=target(m,date);b=a+60}
    else{if(m.ctx==="any")continue;const bl=blocks(date),x=bl.find(x=>x.id===m.ctx)||bl.find(x=>x.id==="noite"||x.id==="livre");if(!x)continue;a=x.a;b=Math.min(x.b,a+60)}
    put(`${m.id}|${a}|${b}`,{m,a,b},d)}}
  for(const d of ALL){const SL=toMin(daySched(nextDow(today,d)).sleep);put(`fechamento|${SL-45}`,{m:null,a:SL-45,b:SL-30},d)}
  const st=new Date().toISOString().replace(/[-:]/g,"").slice(0,15)+"Z",dt=(date,min)=>date.replace(/-/g,"")+"T"+hm(min).replace(":","")+"00";
  const L=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Evolucao//PT-BR","CALSCALE:GREGORIAN","METHOD:PUBLISH","X-WR-CALNAME:Evolução"];
  for(const k in G){const g=G[k],first=g.days.map(d=>nextDow(today,d)).sort()[0],m=g.m;
    const sum=m?(m.kind==="qty"?`${m.name} ${num(m.target)} ${m.unit}`:m.kind==="wake"?"Acordar":m.kind==="sleep"?"Hora de ir dormir":m.type==="semana"?`${m.name} (${m.times}x/semana)`:m.name):"Fechamento do dia";
    const url=m&&LINK[m.id]?`${base}?acao=${LINK[m.id]}`:base;
    const desc=m?`${TYPES[m.type]} · ${xpTxt(m)}. Toque no link para marcar: ${url}`:`Veja o que falta antes de dormir: ${url}`;
    L.push("BEGIN:VEVENT",`UID:${k.replace(/\|/g,"-")}@evolucao`,`DTSTAMP:${st}`,`DTSTART:${dt(first,g.a)}`,`DTEND:${dt(first,g.b)}`,`RRULE:FREQ=WEEKLY;BYDAY=${g.days.map(d=>BY[d]).join(",")}`,
      `SUMMARY:${icsEsc("⚔ "+sum)}`,`DESCRIPTION:${icsEsc(desc)}`,`URL:${url}`,"BEGIN:VALARM","ACTION:DISPLAY",`DESCRIPTION:${icsEsc(sum)}`,"TRIGGER:-PT0M","END:VALARM","END:VEVENT")}
  L.push("END:VCALENDAR");return L.join("\r\n")}
function weekSummary(){const h=S.history.slice(-7),sum=k=>h.reduce((s,x)=>s+(x[k]||0),0),due=sum("due"),done=sum("done"),dates=new Set(h.map(x=>x.date)),fails={};
  S.log.filter(l=>/não cumprida|na semana\. −/.test(l.t)&&dates.has(l.d)).forEach(l=>{const n=l.t.replace(/: (não cumprida|\d+\/\d+ na semana).*/,"");fails[n]=(fails[n]||0)+1});
  const worst=Object.entries(fails).sort((a,b)=>b[1]-a[1]).slice(0,2);
  return[`Relatório semanal · ${S.name||"Jogador"}`,"",`Nível ${S.level} · carta ${ovr()} (${cardTheme().l})`,`Rotina: ${done}/${due} missões (${due?Math.round(done/due*100):0}%)`,
    `Sequência: ${S.streak} dia(s) · recorde ${S.best}`,`Relâmpagos: ${sum("fd")}/${sum("fl")}`,`Missões especiais: ${h.filter(x=>x.sp).length} · trilha no andar ${Math.floor(S.trail/5)+1}`,
    worst.length?`Mais falhou: ${worst.map(([n,c])=>`${n} (${c}x)`).join(", ")}`:"Nenhuma falha de rotina na semana.",
    `Metas atuais: ${S.missions.filter(m=>m.kind==="qty").map(m=>`${m.name} ${num(m.target)} ${m.unit}`).join(", ")}`,
    `Treino: ${S.program?S.program.sessions.filter(x=>dates.has(x.date)).length+" sessões registradas":"sem programa"} · carta ${ovr()}`,"",`Abrir o app: ${location.origin+location.pathname}`].join("\n")}
let lastGeo=0;
function geoCheck(){const I=S.integ;if(!I.gymLoc||S.paused||document.hidden||!navigator.geolocation||Date.now()-lastGeo<180000)return;const g=M("gym");
  if(!g||S.today.date!==vdate())return;const e=ent(g),now=vmin(),G=target(g);if(e.done||e.excused||now<G-120||now>G+240)return;lastGeo=Date.now();
  navigator.geolocation.getCurrentPosition(p=>{const R=6371e3,r=x=>x*Math.PI/180,dl=r(p.coords.latitude-I.gymLoc.lat),dn=r(p.coords.longitude-I.gymLoc.lng),
    a=Math.sin(dl/2)**2+Math.cos(r(I.gymLoc.lat))*Math.cos(r(p.coords.latitude))*Math.sin(dn/2)**2,dist=2*R*Math.asin(Math.sqrt(a));
    if(dist<200&&!ent(g).done){complete(g,weeklyExtra(g),`Detectei você na academia · +${g.xp+weeklyExtra(g)} XP`);ent(g).auto=true;log("Presença na academia detectada pela localização.");commit();setTimeout(openSession,700)}},()=>{},{enableHighAccuracy:true,timeout:15000,maximumAge:60000})}
let gTok=null,gExp=0;
function gLoad(){return new Promise((res,rej)=>{if(window.google&&google.accounts&&google.accounts.oauth2)return res();const x=document.createElement("script");x.src="https://accounts.google.com/gsi/client";x.onload=res;x.onerror=rej;document.head.appendChild(x)})}
async function gConnect(){if(!S.integ.gcid)return toast("Cole o Client ID do Google primeiro","red");if(gTok&&Date.now()<gExp)return gFetch();
  try{await gLoad()}catch(e){return toast("Não consegui carregar o login do Google","red")}

    callback:r=>{if(r.error){toast("Google recusou: "+r.error,"red");return}gTok=r.access_token;gExp=Date.now()+((+r.expires_in||3600)-60)*1000;S.integ.gcal=true;save();gFetch()},
    error_callback:()=>toast("Login do Google cancelado ou bloqueado","red")}).requestAccessToken()}catch(e){toast("Client ID inválido","red")}}
async function gFetch(){const d=S.today.date,t0=new Date(d+"T00:00:00"),t1=new Date(d+"T23:59:59");
  try{const r=await fetch(`https://www.googleapis.com/calendar/v3/calendars/primary/events?singleEvents=true&orderBy=startTime&maxResults=30&timeMin=${encodeURIComponent(t0.toISOString())}&timeMax=${encodeURIComponent(t1.toISOString())}`,{headers:{Authorization:"Bearer "+gTok}});
    if(r.status===401){gTok=null;return toast("Login do Google expirou. Toque em Sincronizar de novo.","red")}if(!r.ok)throw 0;const j=await r.json(),mm=x=>x.getHours()*60+x.getMinutes();
    S.today.gev=(j.items||[]).filter(x=>x.status!=="cancelled"&&x.start&&x.start.dateTime).map(x=>{const a=new Date(x.start.dateTime),b=new Date(x.end.dateTime);return{t:String(x.summary||"Compromisso").slice(0,40),a:mm(a),b:Math.max(mm(a)+5,b.toDateString()!==a.toDateString()?1439:mm(b))}});
    S.integ.gsync=Date.now();S.integ.gsyncDate=d;log(`Agenda sincronizada: ${S.today.gev.length} compromisso(s) hoje.`);save();render();toast(`Agenda: ${S.today.gev.length} compromisso(s) hoje`)}
  catch(e){toast("Não consegui ler a Google Agenda","red")}}
function urlAction(){const q=new URLSearchParams(location.search);if(!q.toString())return;history.replaceState(null,"",location.pathname);if(!S.accepted)return;loop();
  const ac=(q.get("acao")||"").toLowerCase(),v=+(q.get("v")||0);const map={acordei:"wake",dormir:"sleep",academia:"gym",agua:"water",ler:"read"};
  const id=map[ac]||q.get("feito")||q.get("somar");const m=id&&M(id);if(!m){if(ac)toast("Ação do Atalho não reconhecida","red");return}
  if(m.kind==="sleep"&&vmin()<300&&S.pending.some(x=>x.id==="sleep"&&x.date===addDays(S.today.date,-1))){A.latesleep();return}
  if(m.type!=="semana"&&!dueOn(m,S.today.date)){toast(`${m.name} não está na rotina de hoje`);return}
  const e=ent(m);if(m.type==="semana"?(e.done||e.excused):(resolved(e)&&!((m.kind==="qty"||m.kind==="water")&&e.done))){toast(`${m.name} já foi registrada hoje`);return}
  if(!canAct(m)){toast(`${m.name}: disponível a partir das ${hm(win(m).open)}`,"red");return}
  if(m.kind==="water"){addWater(v>0?(v>10?v/1000:v):(S.profile||PROFILE0()).glass/1000);commit()}else if(m.kind==="qty"){addQty(m,v>0?v:m.steps[0]);commit()}else if(m.kind==="presence"){ent(m).asking=true;openMission(m.id)}else doMark(m)}
$("#nav").onclick=e=>{const b=e.target.closest("button");if(!b)return;tab=b.dataset.tab;confirmReset=false;confirmLive=false;render();scrollTo(0,0)};
