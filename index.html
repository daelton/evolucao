<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Evolução</title>
<meta name="theme-color" content="#050918">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Evolução">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#050918; --bg2:#0a1638; --panel:rgba(10,24,62,.78); --line:#3b8fe6; --glow:#7fdcff; --soft:rgba(127,220,255,.10);
  --ink:#e8f3ff; --mute:#8ea7cc; --gold:#ffd166; --red:#ff5d73; --ok:#5ff0b0; --input:rgba(3,9,26,.75);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
:root[data-theme="dark"]{
  --bg:#050918; --bg2:#0a1638; --panel:rgba(10,24,62,.78); --line:#3b8fe6; --glow:#7fdcff; --soft:rgba(127,220,255,.10);
  --ink:#e8f3ff; --mute:#8ea7cc; --gold:#ffd166; --red:#ff5d73; --ok:#5ff0b0; --input:rgba(3,9,26,.75);
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:radial-gradient(130% 55% at 50% -5%,var(--bg2),var(--bg) 72%) fixed;background-color:var(--bg);
  color:var(--ink);font:400 16px/1.5 Barlow,system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
.app{max-width:520px;margin:0 auto;padding:12px 14px 100px}
.disp,h1,h2,h3{font-family:"Chakra Petch",Barlow,system-ui,sans-serif;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--glow);outline-offset:2px}
.mute{color:var(--mute);font-size:.88rem}
.hide{display:none!important}

/* Janela do Sistema */
.win{position:relative;background:var(--panel);border:1px solid color-mix(in srgb,var(--glow) 55%,transparent);
  margin:0 0 14px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  box-shadow:0 0 24px color-mix(in srgb,var(--glow) 16%,transparent),inset 0 0 30px color-mix(in srgb,var(--glow) 6%,transparent)}
.win>.bd{padding:14px}
.tab{display:flex;justify-content:center;margin-top:-1px}
.tab span{font:600 .95rem "Chakra Petch",sans-serif;color:var(--glow);padding:4px 16px;border:1px solid color-mix(in srgb,var(--glow) 55%,transparent);border-top:0;
  background:var(--soft);text-shadow:0 0 10px color-mix(in srgb,var(--glow) 60%,transparent)}
.win.red{border-color:var(--red);box-shadow:0 0 26px color-mix(in srgb,var(--red) 28%,transparent)}
.win.red .tab span{color:var(--red);border-color:var(--red);background:color-mix(in srgb,var(--red) 10%,transparent)}
.warn{font-size:.85rem;color:var(--red);margin:12px 0 0;text-align:center}

/* HUD */
.hud{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;padding:12px 14px}
.rank{width:58px;height:58px;display:grid;place-items:center;font:700 2.1rem/1 "Chakra Petch",sans-serif;color:var(--rk);
  border:2px solid var(--rk);text-shadow:0 0 14px var(--rk);box-shadow:inset 0 0 14px color-mix(in srgb,var(--rk) 25%,transparent)}
.lvrow{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.lvrow b{font:600 1.25rem "Chakra Petch",sans-serif}
.bar{height:7px;background:var(--input);border:1px solid color-mix(in srgb,var(--line) 45%,transparent);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--line),var(--glow));box-shadow:0 0 8px var(--glow);transition:width .6s}
.bar.red i{background:var(--red);box-shadow:none}

/* Linhas da missão */
.goal{font-size:.9rem;color:var(--mute);text-align:center;margin:0 0 10px}
.q{display:block;width:100%;background:none;border:0;border-bottom:1px dashed color-mix(in srgb,var(--line) 35%,transparent);padding:11px 2px;text-align:left}
.q:last-of-type{border-bottom:0}
.q .top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.q .nm{font-weight:600}
.q .pg{font:600 .95rem "Chakra Petch",sans-serif;color:var(--glow);white-space:nowrap}
.q .bar{margin-top:6px;height:4px}
.q.done .nm{color:var(--mute)}
.q.done .pg{color:var(--ok)}
.q.exc .pg{color:var(--mute)}
.q .sub{font-size:.8rem;color:var(--mute)}
.next{font-size:.85rem;color:var(--mute);margin-top:8px}

/* Botões */
.btn{background:transparent;color:var(--glow);border:1px solid var(--glow);padding:10px 16px;font:600 .95rem "Chakra Petch",sans-serif}
.btn:hover{background:var(--soft)}
.btn.solid{background:var(--line);border-color:var(--line);color:#fff}
.btn.red{color:var(--red);border-color:var(--red)}
.btn.ghost{border-color:transparent;color:var(--mute)}
.btn.full{width:100%}
.btn:disabled{opacity:.4;cursor:default}
.btns{display:grid;gap:8px;margin-top:14px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:.8rem;padding:4px 10px;border:1px solid color-mix(in srgb,var(--glow) 40%,transparent);background:var(--soft);color:var(--glow)}
.tag{font-size:.75rem;padding:1px 7px;border:1px solid color-mix(in srgb,var(--glow) 35%,transparent);color:var(--glow)}
.tag.g{color:var(--gold);border-color:color-mix(in srgb,var(--gold) 45%,transparent)}

/* Stepper */
.step{display:inline-flex;align-items:center;border:1px solid color-mix(in srgb,var(--line) 60%,transparent);background:var(--input)}
.step button{width:40px;height:40px;background:none;border:0;color:var(--glow);font:600 1.2rem "Chakra Petch",sans-serif}
.step input{width:58px;height:40px;text-align:center;background:none;border:0;color:var(--ink);font:600 1.05rem "Chakra Petch",sans-serif;-moz-appearance:textfield}
.step input::-webkit-inner-spin-button{display:none}
.step.sm button{width:30px;height:34px;font-size:1rem}.step.sm input{width:36px;height:34px;font-size:.95rem}
.ex{padding:12px 0;border-bottom:1px dashed color-mix(in srgb,var(--line) 35%,transparent)}
.ex:last-child{border-bottom:0}
.sets{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}

/* Formulários */
input,select{font:inherit;color:var(--ink);background:var(--input);border:1px solid color-mix(in srgb,var(--line) 55%,transparent);padding:9px 10px;min-width:0;width:100%}
.form{display:grid;gap:12px}
.form label{display:grid;gap:4px;font-size:.85rem;color:var(--mute)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.days{display:flex;gap:4px;flex-wrap:wrap}
.days button{flex:1;min-width:38px;padding:7px 0;border:1px solid color-mix(in srgb,var(--line) 55%,transparent);background:var(--input);color:var(--mute);font-size:.85rem}
.days button[aria-pressed=true]{background:var(--line);color:#fff;border-color:var(--line)}
.exrow{display:grid;grid-template-columns:1fr 64px 56px auto;gap:6px;align-items:center;margin-bottom:6px}
.exrow2{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:-2px 0 12px}
.exrow input,.exrow2 input{padding:7px 8px;font-size:.9rem}
.check{display:flex;gap:10px;align-items:center;color:var(--ink)!important;font-size:.92rem!important}
.check input{width:20px;height:20px}

/* Status */
.srow{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed color-mix(in srgb,var(--line) 30%,transparent)}
.srow:last-child{border-bottom:0}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:4px 18px;margin-top:4px}
.stats div{display:flex;justify-content:space-between;padding:5px 0}
.stats b{font-family:"Chakra Petch",sans-serif;color:var(--glow)}
.heat{display:grid;grid-template-columns:repeat(14,1fr);gap:4px}
.heat span{aspect-ratio:1;background:var(--input);border:1px solid color-mix(in srgb,var(--line) 25%,transparent)}
.heat .h1{background:color-mix(in srgb,var(--glow) 35%,transparent)}.heat .h2{background:var(--glow)}.heat .h0{background:color-mix(in srgb,var(--red) 45%,transparent)}
.log{max-height:240px;overflow:auto;font-size:.88rem}
.log p{margin:0 0 7px;padding-left:10px;border-left:2px solid var(--line)}
.rep p{margin:0 0 8px}

/* Rotina */
.ri{display:flex;justify-content:space-between;align-items:center;width:100%;background:none;border:0;border-bottom:1px dashed color-mix(in srgb,var(--line) 30%,transparent);padding:11px 2px;text-align:left}
.ri:last-child{border-bottom:0}

/* Navegação */
nav{position:fixed;left:0;right:0;bottom:0;z-index:5;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border-top:1px solid color-mix(in srgb,var(--glow) 35%,transparent);padding-bottom:env(safe-area-inset-bottom,0px)}
nav div{display:flex;max-width:520px;margin:0 auto}
nav button{flex:1;background:none;border:0;color:var(--mute);padding:14px 0;font:600 .95rem "Chakra Petch",sans-serif}
nav button[aria-current=page]{color:var(--glow);text-shadow:0 0 10px color-mix(in srgb,var(--glow) 60%,transparent);box-shadow:inset 0 2px 0 var(--glow)}

/* Sheet, modal, toast */
.ov{position:fixed;inset:0;z-index:20;background:rgba(1,4,14,.7);display:none}
.ov.on{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-height:88%;overflow:auto;transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.9,.3,1);
  padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet.on{transform:none}
.sheet .win{max-width:520px;margin:0 auto;border-bottom:0}
.sheet h3{font-size:1.2rem;margin-bottom:4px}
.modal{position:fixed;inset:0;z-index:30;display:none;place-items:center;padding:20px;background:rgba(1,4,14,.75)}
.modal.on{display:grid}
.modal .win{width:100%;max-width:370px;text-align:center;animation:pop .5s cubic-bezier(.2,1.5,.4,1)}
.modal .bd{padding:22px 18px}
.modal .huge{font:700 3.6rem/1.1 "Chakra Petch",sans-serif;color:var(--rk,var(--glow));text-shadow:0 0 22px currentColor;margin:4px 0}
.modal p{margin:6px 0}
@keyframes pop{from{transform:scale(.8);opacity:0}to{transform:none;opacity:1}}
.toast{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);left:50%;z-index:40;transform:translate(-50%,-160%);transition:transform .3s;
  background:var(--panel);border:1px solid var(--glow);padding:10px 16px;font:600 .92rem "Chakra Petch",sans-serif;color:var(--ink);
  box-shadow:0 0 20px color-mix(in srgb,var(--glow) 35%,transparent);max-width:90vw;text-align:center;backdrop-filter:blur(8px)}
.toast.on{transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* v0.3: agora, linha do dia, trilha */
.strip{display:flex;justify-content:space-between;gap:4px;padding:10px 14px}
.strip div{flex:1;text-align:center;font-size:.72rem;color:var(--mute)}
.strip i{display:block;width:26px;height:26px;margin:0 auto 3px;border:1px solid color-mix(in srgb,var(--line) 45%,transparent);background:var(--input);transform:rotate(45deg)}
.strip .f i{background:linear-gradient(135deg,var(--gold),#ff7a3d);border-color:var(--gold);box-shadow:0 0 10px color-mix(in srgb,var(--gold) 60%,transparent)}
.strip .x i{background:color-mix(in srgb,var(--red) 40%,transparent);border-color:var(--red)}
.strip .t{color:var(--ink);font-weight:600}
.strip .t i{border-color:var(--glow);border-width:2px}
.fire{font:700 1rem "Chakra Petch",sans-serif;color:var(--gold)}
.now .when{font-size:.9rem;color:var(--mute);text-align:center}
.now .big{font:700 1.6rem/1.2 "Chakra Petch",sans-serif;text-align:center;margin:6px 0 4px;text-shadow:0 0 16px color-mix(in srgb,var(--glow) 40%,transparent)}
.now .cd{text-align:center;font-size:.95rem;margin-bottom:4px}
.now .cd b{font-family:"Chakra Petch",sans-serif;color:var(--glow);font-size:1.15rem}
.now .cd.late b{color:var(--red)}
.now .pts{display:flex;justify-content:center;gap:8px;margin-top:6px}
.btn.xl{padding:15px;font-size:1.1rem}
.sp{border-color:color-mix(in srgb,var(--gold) 70%,transparent);box-shadow:0 0 24px color-mix(in srgb,var(--gold) 20%,transparent)}
.sp .tab span{color:var(--gold);border-color:color-mix(in srgb,var(--gold) 70%,transparent);background:color-mix(in srgb,var(--gold) 10%,transparent);text-shadow:0 0 10px color-mix(in srgb,var(--gold) 50%,transparent)}
.sp .ttl{font:600 1.1rem "Chakra Petch",sans-serif;text-align:center;margin:2px 0 8px}
.tl{display:grid;grid-template-columns:50px 16px 1fr auto;gap:10px;align-items:center;padding:10px 2px;border-bottom:1px dashed color-mix(in srgb,var(--line) 30%,transparent)}
.tl:last-child{border-bottom:0}
.tl .tm{font:600 .95rem "Chakra Petch",sans-serif;color:var(--mute)}
.tl .dt{width:12px;height:12px;border:2px solid var(--line);transform:rotate(45deg)}
.tl .main{background:none;border:0;text-align:left;padding:0;min-width:0}
.tl .main b{display:block;font-weight:600}
.tl .sub{font-size:.8rem;color:var(--mute)}
.tl .st{font:600 .85rem "Chakra Petch",sans-serif;white-space:nowrap}
.tl.done .dt{background:var(--ok);border-color:var(--ok)}.tl.done .st{color:var(--ok)}.tl.done .main b{color:var(--mute)}
.tl.fail .dt{background:var(--red);border-color:var(--red)}.tl.fail .st{color:var(--red)}
.tl.exc .dt{border-color:var(--mute)}.tl.exc .st{color:var(--mute)}
.tl.act .dt{background:var(--glow);border-color:var(--glow);box-shadow:0 0 10px var(--glow)}.tl.act .st{color:var(--glow)}
.tl.act .tm{color:var(--glow)}
.demo{display:flex;gap:6px;flex-wrap:wrap;align-items:center;justify-content:center;padding:12px;border:1px dashed color-mix(in srgb,var(--line) 55%,transparent);margin-top:4px}
.demo span{width:100%;text-align:center;font-size:.8rem;color:var(--mute)}
/* trilha */
.floor{text-align:center;margin:18px 0 8px}
.floor b{font:600 1.05rem "Chakra Petch",sans-serif;color:var(--glow)}
.path{display:flex;flex-direction:column;align-items:center;gap:14px;padding:6px 0 10px}
.node{width:66px;height:66px;border-radius:50%;border:2px solid color-mix(in srgb,var(--line) 50%,transparent);background:var(--input);color:var(--mute);
  font:700 1.2rem "Chakra Petch",sans-serif;display:grid;place-items:center;position:relative}
.node.done{background:var(--line);border-color:var(--glow);color:#fff;box-shadow:0 0 12px color-mix(in srgb,var(--glow) 40%,transparent)}
.node.cur{border-color:var(--glow);color:var(--glow);box-shadow:0 0 0 6px color-mix(in srgb,var(--glow) 15%,transparent),0 0 22px var(--glow);animation:pulse 1.8s infinite}
.node.boss{width:84px;height:84px;border-color:color-mix(in srgb,var(--gold) 60%,transparent);color:var(--gold)}
.node.boss.done{background:linear-gradient(135deg,var(--gold),#ff7a3d);color:#1a1000}
.node .lb{position:absolute;top:100%;margin-top:4px;font:600 .72rem Barlow,sans-serif;color:var(--mute);white-space:nowrap}
.node.cur .lb{color:var(--glow)}
@keyframes pulse{50%{box-shadow:0 0 0 12px color-mix(in srgb,var(--glow) 0%,transparent),0 0 30px var(--glow)}}
.timerbig{font:700 2.6rem "Chakra Petch",sans-serif;text-align:center;color:var(--glow);text-shadow:0 0 18px var(--glow)}

/* v0.4: contexto, cartões, plano por blocos, relâmpago */
.ctx .bd{padding:12px 14px}
.ctx .where{font:700 1.35rem/1.2 "Chakra Petch",sans-serif;text-align:center;text-shadow:0 0 14px color-mix(in srgb,var(--glow) 40%,transparent)}
.ctx .sub{text-align:center;font-size:.88rem;color:var(--mute);margin-top:2px}
.ctx .clock{text-align:center;font:600 .85rem "Chakra Petch",sans-serif;color:var(--glow)}
.mc{padding:12px 0;border-bottom:1px dashed color-mix(in srgb,var(--line) 30%,transparent)}
.mc:last-child{border-bottom:0}
.mc .hd{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.mc .nm{font-weight:600;font-size:1.05rem;background:none;border:0;padding:0;text-align:left}
.mc .meta{font-size:.82rem;color:var(--mute)}
.mc .cd{font:600 .85rem "Chakra Petch",sans-serif;color:var(--glow);white-space:nowrap}
.mc .cd.late{color:var(--red)}
.mc .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.mc .acts .btn{flex:1;min-width:88px;padding:11px 10px}
.mc .bar{margin-top:8px;height:5px}
.flash{border-color:var(--gold);box-shadow:0 0 26px color-mix(in srgb,var(--gold) 30%,transparent);animation:glowf 1.6s infinite}
.flash .tab span{color:var(--gold);border-color:var(--gold);background:color-mix(in srgb,var(--gold) 12%,transparent)}
@keyframes glowf{50%{box-shadow:0 0 38px color-mix(in srgb,var(--gold) 45%,transparent)}}
.flash .txt{font:600 1.15rem "Chakra Petch",sans-serif;text-align:center;margin:2px 0 4px}
.blk{display:grid;grid-template-columns:50px 1fr;gap:10px;padding:9px 2px;border-bottom:1px dashed color-mix(in srgb,var(--line) 25%,transparent)}
.blk:last-child{border-bottom:0}
.blk .tm{font:600 .9rem "Chakra Petch",sans-serif;color:var(--mute);padding-top:1px}
.blk .lb{font-weight:600}
.blk.past .lb,.blk.past .tm{color:var(--mute);opacity:.7}
.blk.cur{background:var(--soft);margin:0 -8px;padding-left:10px;padding-right:10px;border-left:2px solid var(--glow)}
.blk.cur .tm,.blk.cur .lb{color:var(--glow)}
.mchips{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px}
.mchip{font-size:.78rem;padding:3px 8px;border:1px solid color-mix(in srgb,var(--line) 45%,transparent);background:var(--input);color:var(--ink)}
.mchip.done{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 50%,transparent)}
.mchip.fail{color:var(--red);border-color:color-mix(in srgb,var(--red) 50%,transparent)}
.mchip.exc{color:var(--mute)}
.mchip.fl{color:var(--gold);border-color:color-mix(in srgb,var(--gold) 45%,transparent);background:transparent}
.quiet{text-align:center;color:var(--mute);font-size:.92rem;margin:0}
/* ===== v1.0: carta, painel, onboarding ===== */
.hud{grid-template-columns:auto 1fr}
.mini{position:relative;width:58px;height:74px;border:0;padding:0;border-radius:8px 8px 14px 14px;overflow:hidden;background:var(--rkbg,#3a2a18);box-shadow:0 0 14px color-mix(in srgb,var(--rk) 45%,transparent)}
.mini-img{width:100%;height:100%;object-fit:cover;display:block}
.mini .ph0,.pc-img.ph0,.pf-img.ph0{display:grid;place-items:center;font:700 1.4rem "Chakra Petch",sans-serif;color:#1a1206;background:linear-gradient(160deg,rgba(255,255,255,.35),rgba(0,0,0,.15))}
.mini-ovr{position:absolute;left:4px;top:2px;z-index:2;font:700 1.15rem/1 "Chakra Petch",sans-serif;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.7)}
.mini.t-ouro{background:linear-gradient(160deg,#f7df8a,#b8862b)}.mini.t-prata{background:linear-gradient(160deg,#eef2f8,#8e9aab)}.mini.t-bronze{background:linear-gradient(160deg,#e9b88b,#8a5230)}.mini.t-forma{background:linear-gradient(160deg,#1b3f86,#0a1638)}
.cardwrap{display:flex;justify-content:center;margin:6px 0 18px}
.pcard{position:relative;width:min(280px,78vw);aspect-ratio:.76;padding:18px 18px 16px;color:#1a1206;clip-path:polygon(12% 0,88% 0,100% 7%,100% 88%,50% 100%,0 88%,0 7%);
  display:flex;flex-direction:column;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.45)}
.pcard::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.28) 45%,transparent 60%);background-size:250% 100%;animation:shine 5s infinite;pointer-events:none}
@keyframes shine{0%{background-position:150% 0}60%,100%{background-position:-100% 0}}
.pcard.t-ouro{background:linear-gradient(160deg,#fbe9a6 0%,#e6c056 45%,#a57726 100%)}
.pcard.t-prata{background:linear-gradient(160deg,#ffffff 0%,#c9d3e0 45%,#7d8a9c 100%)}
.pcard.t-bronze{background:linear-gradient(160deg,#f3cba5 0%,#c98a55 45%,#7a4526 100%)}

summary{cursor:pointer;list-style:none;padding:4px 0}summary::-webkit-details-marker{display:none}
.wz{padding-top:8px}.wz-prog{display:flex;gap:4px;margin:4px 2px 14px}.wz-prog i{flex:1;height:4px;background:var(--input)}.wz-prog i.on{background:var(--glow)}
.opts{display:grid;gap:8px}.opt{text-align:left;padding:12px 14px;border:1px solid color-mix(in srgb,var(--line) 55%,transparent);background:var(--input);color:var(--ink)}

<body>
<div class="app">
  <header class="win hud" id="hud"></header>
  <main id="view"></main>
</div>
<nav id="nav"><div></div></nav>
<div class="ov" id="ov"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"><div class="win"><div class="bd" id="sheetBody"></div></div></div>
<div class="modal" id="modal" role="dialog" aria-modal="true"><div class="win"><div class="tab"><span id="mTab">Notificação</span></div><div class="bd" id="mBody"></div></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
"use strict";
/* =====================================================================
   EVOLUÇÃO v2 — evolução pessoal por áreas que VOCÊ escolhe
   Cada área vira um atributo da sua carta. Nada aparece se você não escolheu.
   Camadas: 1 Base · 2 Áreas e hábitos · 3 Motor do dia/semana · 4 Carta, Lore
            5 Efeitos · 6 Telas · 7 Onboarding · 8 Sheets · 9 Ações · 10 Integrações
   ===================================================================== */
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const clone=o=>JSON.parse(JSON.stringify(o));
const pad=n=>String(n).padStart(2,"0");
const num=n=>String(+(+n).toFixed(2)).replace(".",",");
const toMin=t=>{const[h,m]=String(t||"0:0").split(":").map(Number);return(h||0)*60+(m||0)};
const hm=m=>{m=Math.max(0,Math.min(1439,Math.round(m)));return`${pad(Math.floor(m/60))}:${pad(m%60)}`};
const dur=s=>{s=Math.max(0,Math.round(s));const h=Math.floor(s/3600),m=Math.floor(s%3600/60);return h?`${h}h ${pad(m)}min`:m?`${m}min`:`${s}s`};
const DOW=["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"],ALL=[0,1,2,3,4,5,6],WEEK=[1,2,3,4,5];
const MES=["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
const addDays=(s,n)=>{const d=new Date(s+"T12:00:00Z");d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)};
const dow=s=>new Date(s+"T12:00:00Z").getUTCDay();
const weekKey=s=>addDays(s,-((dow(s)+6)%7));
const fmt=s=>{const d=new Date(s+"T12:00:00Z");return`${DOW[d.getUTCDay()]}, ${d.getUTCDate()} ${MES[d.getUTCMonth()]}`};
const daysTxt=d=>d.length===7?"todo dia":d.join()==="1,2,3,4,5"?"seg a sex":d.join()==="0,6"?"fim de semana":d.map(x=>DOW[x]).join(", ");
function seeded(str){let h=2166136261;for(const c of str)h=Math.imul(h^c.charCodeAt(0),16777619);return()=>{h=Math.imul(h^(h>>>15),2246822507);h=Math.imul(h^(h>>>13),3266489909);return((h^=h>>>16)>>>0)/4294967296}}

let AC;
function tone(fs,d=.09){if(!S.sound)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();let t=AC.currentTime;
  fs.forEach(f=>{const o=AC.createOscillator(),g=AC.createGain();o.type="triangle";o.frequency.value=f;g.gain.setValueAtTime(.0001,t);
  g.gain.exponentialRampToValueAtTime(.14,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d+.03);t+=d*.85})}catch(e){}}
const SFX={ok:()=>{tone([880,1320]);navigator.vibrate?.(25)},ping:()=>{tone([1175,1175],.07);navigator.vibrate?.([30,40,30])},flash:()=>{tone([1320,1760,1320,1760],.06);navigator.vibrate?.([60,40,60,40,60])},
  lvl:()=>{tone([660,880,1100,1320,1760],.12);navigator.vibrate?.([40,40,80])},bad:()=>{tone([300,200],.18);navigator.vibrate?.([80,60,80])}};
const fx=k=>S.sound&&SFX[k]&&SFX[k]();
const TQ=[];let tBusy=false;
function toast(t,kind){TQ.push([t,kind]);if(TQ.length>4)TQ.splice(0,TQ.length-4);if(!tBusy)nextToast()}
function nextToast(){const x=TQ.shift(),e=$("#toast");if(!x){tBusy=false;e.classList.remove("on");return}tBusy=true;e.textContent=x[0];
  e.style.borderColor=x[1]==="red"?"var(--red)":x[1]==="gold"?"var(--gold)":"";e.classList.add("on");setTimeout(nextToast,2800)}
function openSheet(h,id=null){sheetId=id;$("#sheetBody").innerHTML=h;$("#ov").classList.add("on");$("#sheet").classList.add("on");sheetOpen=true}
function closeSheet(){$("#ov").classList.remove("on");$("#sheet").classList.remove("on");sheetOpen=false;sheetId=null}
const stepper=(id,val,sm,step=1)=>`<span class="step${sm?" sm":""}"><button data-do="st" data-t="${id}" data-d="-${step}" aria-label="Menos">−</button><input id="${id}" type="number" inputmode="decimal" step="${step}" value="${val}"><button data-do="st" data-t="${id}" data-d="${step}" aria-label="Mais">+</button></span>`;

function icsEsc(x){return String(x).replace(/\\/g,"\\\\").replace(/[;,]/g,m=>"\\"+m).replace(/\n/g,"\\n")}
function nextDow(from,d){return addDays(from,(d-dow(from)+7)%7)}
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const r1=x=>Math.round(x*10)/10;
const need=l=>100+(l-1)*30;
const todayIso=()=>{const d=new Date();return`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`};
/* relógio (modo teste desloca o tempo) */
const vnow=()=>new Date(Date.now()+(S.offset||0));
/* O dia do app vira no meio do seu sono, não à meia-noite: quem dorme 23:00 e acorda 07:00 vira às 03:00; quem dorme 06:00 e acorda 14:00 vira às 10:00 */
function cutoff(){const p=S&&S.profile||{sleep:"23:00",wake:"07:00"},sl=toMin(p.sleep),wk=toMin(p.wake),dd=(wk-sl+1440)%1440;return Math.round((sl+dd/2)%1440)}
const toL=m=>m<cutoff()?m+1440:m;
const vdate=()=>{const d=new Date(vnow().getTime()-cutoff()*60000);return`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`};
const vmin=()=>{const d=vnow();return toL(d.getHours()*60+d.getMinutes()+d.getSeconds()/60)};

/* ---------- 2. Áreas ---------- */
const AREAS={
  agua:{l:"Hidratação",s:"HID",i:"💧",d:"Meta de água pelo seu peso, dividida em 3 rodadas."},
  treino:{l:"Força",s:"FOR",i:"🏋️",d:"Academia com o seu treino ou um programa montado pelo seu objetivo."},
  movimento:{l:"Movimento",s:"MOV",i:"👟",d:"Caminhada, corrida, bike, esporte. Meta em minutos por semana."},
  sono:{l:"Sono",s:"SON",i:"🌙",d:"Horário para dormir e acordar."},
  leitura:{l:"Leitura",s:"LEI",i:"📖",d:"Páginas ou minutos por dia, onde você estiver."},
  estudo:{l:"Estudo",s:"EST",i:"🧠",d:"Curso, idioma ou matéria. Minutos por dia."},
  corpo:{l:"Corpo",s:"COR",i:"⚖️",d:"Pesagem semanal e a tendência para o seu objetivo."},
  habitos:{l:"Disciplina",s:"DIS",i:"✅",d:"Hábitos seus: meditar, sem doce, tomar vitamina, arrumar a casa…"}};
const AREA_ORDER=Object.keys(AREAS);
const GOALS={perder:"Perder peso",ganhar:"Ganhar massa e força",manter:"Manter e ter saúde"};
const ACTS=["Caminhada","Corrida","Bike","Natação","Futebol","Vôlei","Dança","Outro"];
const HABIT_IDEAS=["Meditar 5 min","Sem doce","Tomar vitamina","Arrumar a casa 10 min","Sem celular antes de dormir","Alongar 5 min","Sem álcool","Anotar gastos"];
const TIERS=[{min:75,id:"ouro",l:"Ouro",c:"#ffd166"},{min:65,id:"prata",l:"Prata",c:"#c9d6e8"},{min:0,id:"bronze",l:"Bronze",c:"#d08a55"}];
const PRI={1:{l:"Urgente",c:"var(--red)",xp:15},2:{l:"Importante",c:"var(--gold)",xp:10},3:{l:"Pode esperar",c:"var(--ok)",xp:5}};
const areaLabel=a=>a==="estudo"&&H("estudo")?H("estudo").name:AREAS[a].l;
const areaShort=a=>a==="estudo"&&H("estudo")?H("estudo").name.slice(0,3).toUpperCase():AREAS[a].s;

/* ---------- Estado ---------- */
const PROFILE0=()=>({weight:70,height:null,goal:"manter",wake:"07:00",sleep:"23:00",glass:250});
const newWeek=(date,cap=7)=>({key:weekKey(date),c:{},m:{},cap,paused:0});
function defaultState(){const iso=todayIso();return{v:8,updatedAt:Date.now(),onboarded:false,name:"",photo:null,profile:PROFILE0(),areas:[],habits:[],attrs:{},
  level:1,xp:0,streak:0,best:0,sound:true,test:false,offset:0,paused:null,program:null,body:{log:[],start:null,goalKg:null},tasks:[],lore:[],
  stats:{habits:0,workouts:0,water:0,pages:0,studyMin:0,moveMin:0,tasks:0,books:0,levels:0,since:iso},
  week:newWeek(iso),pending:[],history:[],log:[],today:{date:iso,e:{},ah:{},trained:false,rv:false,wr:{}}}}
const LS="evolucao-v8";let S;try{localStorage.removeItem("evolucao-v4")}catch(e){}
try{S=JSON.parse(localStorage.getItem(LS))}catch(e){}
/* Migração da versão anterior (v7): mantém nível, XP, histórico, foto, peso, programa e cargas */
function migrate(d){if(!d||typeof d!=="object")return null;if(d.v===8)return d;
  if(d.v!==7&&d.v!==6&&d.v!==5)return null;
  const n=defaultState(),ms=d.missions||[],has=id=>ms.find(m=>m.id===id);const p=d.profile||{};
  Object.assign(n,{name:d.name||"",photo:d.photo||null,level:d.level||1,xp:d.xp||0,streak:d.streak||0,best:d.best||0,sound:d.sound!==false,history:d.history||[],log:(d.log||[]).slice(0,150),program:d.program||null});
  n.profile=Object.assign(PROFILE0(),{weight:p.weight||70,height:p.height||null,goal:p.goal==="massa"?"ganhar":p.goal==="gordura"?"perder":"manter",glass:p.glass||250,
    wake:(d.sched&&d.sched.wd&&d.sched.wd.wake)||"07:00",sleep:(d.sched&&d.sched.wd&&d.sched.wd.sleep)||"23:00"});
  if(d.body&&d.body.log)n.body.log=d.body.log;n.body.start=n.body.log[0]?n.body.log[0].kg:n.profile.weight;
  const A=[];if(has("water"))A.push("agua");if(has("gym"))A.push("treino");if(has("wake")||has("sleep"))A.push("sono");if(has("read"))A.push("leitura");if(has("study"))A.push("estudo");if(has("weigh"))A.push("corpo");if(has("sport"))A.push("habitos");
  n.areas=A;const cfg={gymTimes:has("gym")?has("gym").times:4,gymDays:has("gym")?has("gym").prefDays:[1,2,4,5],readUnit:"páginas",readTarget:has("read")?has("read").target:10,
    studyName:has("study")?has("study").name:"Estudar",studyMin:has("study")?has("study").target:30,custom:has("sport")?[{name:has("sport").name,mode:"weekly",times:has("sport").times,days:has("sport").prefDays}]:[]};
  n.habits=buildHabits(A,n.profile,cfg);
  const map={FIS:"treino",SAU:"agua",MEN:"leitura",CAR:"estudo",DIS:"habitos"};if(d.attrs)for(const k in d.attrs)if(map[k]&&A.includes(map[k]))n.attrs[map[k]]=d.attrs[k];
  if(A.includes("sono")&&d.attrs&&d.attrs.DIS)n.attrs.sono=clone(d.attrs.DIS);for(const a of A)n.attrs[a]=n.attrs[a]||{ema:.17,prev:.17};
  n.onboarded=false;n.migrated=true;n.lore=[{d:(d.history&&d.history[0]&&d.history[0].date)||n.today.date,i:"🚀",t:"Começou a jornada"}];return n}
S=migrate(S)||defaultState();
function save(){S.updatedAt=Date.now();try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){S.log=S.log.slice(0,60);try{localStorage.setItem(LS,JSON.stringify(S))}catch(x){}}}

/* Cada área gera os seus hábitos com metas inteligentes */
function hb(o){return Object.assign({id:uid(),kind:"check",unit:"",target:1,steps:[1],freq:{mode:"daily",days:[],times:1,goal:0},xp:10,bonus:0,loss:10},o)}
function buildHabits(areas,p,c={}){const L=[];
  for(const a of areas){
    if(a==="agua")L.push(hb({id:"agua",area:a,kind:"water",name:"Água",unit:"L",target:waterBaseFor(p),xp:20,loss:15}));
    if(a==="treino")L.push(hb({id:"treino",area:a,kind:"session",name:"Treino",freq:{mode:"weekly",times:c.gymTimes||3,days:(c.gymDays||[1,3,5]).slice(),goal:0},time:c.gymTime||"",xp:30,loss:25}));
    if(a==="movimento")L.push(hb({id:"movimento",area:a,kind:"minutes",name:c.act||"Caminhada",unit:"min",freq:{mode:"weekly",times:0,days:[],goal:c.moveGoal||150},xp:0,bonus:30,loss:30}));
    if(a==="sono")L.push(hb({id:"sono",area:a,kind:"sleep",name:"Sono",xp:20,bonus:10,loss:15,tol:30}));
    if(a==="leitura"){const u=c.readUnit||"páginas";L.push(hb({id:"leitura",area:a,kind:"qty",name:"Leitura",unit:u,target:c.readTarget||(u==="min"?15:10),steps:u==="min"?[10,20]:[5,10],xp:20,loss:15,book:c.book||null}))}
    if(a==="estudo")L.push(hb({id:"estudo",area:a,kind:"qty",name:c.studyName||"Estudo",unit:"min",target:c.studyMin||30,steps:[15,30],freq:{mode:c.studyDays&&c.studyDays.length<7?"days":"daily",days:c.studyDays||[],times:1,goal:0},xp:20,loss:15}));
    if(a==="corpo")L.push(hb({id:"corpo",area:a,kind:"weigh",name:"Pesagem",freq:{mode:"weekly",times:1,days:[1],goal:0},xp:10,loss:5}));
    if(a==="habitos")for(const x of (c.custom||[]))L.push(hb({area:a,kind:"check",name:x.name,freq:{mode:x.mode||"daily",days:x.days||[],times:x.times||1,goal:0},xp:10,loss:10}))}
  return L}
const H=id=>S.habits.find(h=>h.id===id);
const isWeekly=h=>h.freq.mode==="weekly";
const dueOn=(h,date)=>!isWeekly(h)&&(h.freq.mode==="daily"||h.freq.days.includes(dow(date)));
const dueToday=()=>S.habits.filter(h=>S.areas.includes(h.area)&&dueOn(h,S.today.date));
const weeklies=()=>S.habits.filter(h=>S.areas.includes(h.area)&&isWeekly(h));

/* Água em rodadas */
function addWater(v){const h=H("agua");if(!h)return;const e=ent(h);e.log=e.log||[];const now=vmin();e.log.push({t:now,v});e.value=r1((e.value||0)+v);S.stats.water=r1(S.stats.water+v);

  if(!e.done&&e.value>=T){complete(h,h.xp,`Meta de água batida · +${h.xp} XP`);return}fx("ok");toast(msg)}

/* Sono: dormir e acordar informados de manhã */
function logSleep(bed,wake){const h=H("sono");if(!h)return;const e=ent(h);if(e.done||e.failed)return;const p=S.profile,tb=toMin(p.sleep),tw=toMin(p.wake);

  e.bed=hm(bed);e.wake=hm(wake);e.dur=durM;const g=Math.max(db,dw)<=h.tol?"on":Math.max(db,dw)<=60?"late":"miss";e.grade=g;

/* Semana: sessões (treino, esporte), minutos (movimento) e pesagem */
function addSession(h,xtra=0){const e=ent(h);if(e.done)return false;S.week.c[h.id]=wCount(h)+1;complete(h,h.xp+xtra,`${h.name}: ${wCount(h)}/${wReq(h)} na semana · +${h.xp+xtra} XP`);if(h.area==="treino"){S.stats.workouts++;markTrained();if(S.stats.workouts===1)lore("🏋️","Primeiro treino registrado","wk1")}return true}

function logWeight(kg){const p=S.profile,old=p.weight;p.weight=r1(kg);S.body.log.push({date:S.today.date,kg:p.weight});S.body.log=S.body.log.slice(-104);if(S.body.start==null)S.body.start=p.weight;

/* Revisão: o que ficou sem marcar ontem */
function resolvePending(p,ok){const h=H(p.id),x=hist(p.date);S.pending=S.pending.filter(q=>q!==p);if(!h)return;if(x)x.pend=Math.max(0,(x.pend||0)-1);

function newDay(date){return{date,e:{},ah:{},trained:false,rv:false,wr:{}}}

function weekClose(lines){for(const h of weeklies()){const x=hist(S.today.date);
    if(h.kind==="minutes"){const g=wReq(h),m=wMin(h);if(!g)continue;if(x){x.due++;if(m>=g)x.done++}
      if(m>=g){addXP(h.bonus);hit(h.area,true);lines.push(`${h.name}: ${m}/${g} min · meta batida · +${h.bonus} XP`)}else{const l=Math.round(h.loss*(1-m/g));addXP(-l);hit(h.area,false);log(`${h.name}: ${m}/${g} min na semana. −${l} XP.`);lines.push(`${h.name}: ${m}/${g} min · −${l} XP`)}continue}
    const r=wReq(h),c=wCount(h);if(!r)continue;if(x){x.due+=r;x.done+=Math.min(c,r)}

function closeDay(){const t=S.today,lines=[],before=ovr();for(const p of S.pending.filter(p=>p.date<t.date))resolvePending(p,false);

function commit(){save();render();if(sheetOpen&&sheetId)sheetId==="__rv"?openReview():H(sheetId)?openH(sheetId):0}
function saveSession(){const s=nextSplit(),P=program(),h=H("treino");if(!s)return;const notes=[];let prs=0;
  s.ex.forEach((x,i)=>{const w=+String($(`#sw${i}`).value).replace(",",".")||0,r=Array.from({length:x.sets},(_,k)=>+$(`#g${i}_${k}`).value||0);if(!w)return;
    const first=!x.weight;x.weight=w;x.last=r;const best=Math.max(...r.map(v=>e1rm(w,v)));if(x.best&&best>x.best+.01){prs++;notes.push(`Recorde: ${x.name} (${num(r1(best))} kg estimado)`);lore("🏅",`Recorde no ${x.name.toLowerCase()}: ${num(r1(best))} kg estimado`,"pr"+x.name+Math.round(best))}
    const up=!x.best||best>x.best+.01;x.best=Math.max(x.best||0,best);x.stall=up?0:(x.stall||0)+1;x.hist=(x.hist||[]).concat([{d:S.today.date,w,r}]).slice(-12);
    const ok=r.every(v=>v>=x.min),t=r.every(v=>v>=x.max);if(first){notes.push(`${x.name}: carga inicial ${w} kg`);return}
    if(t){x.weight=+(w+x.inc).toFixed(1);x.fails=0;x.last=r.map(()=>x.min);notes.push(`${x.name}: sobe para ${x.weight} kg`)}else if(!ok){x.fails++;if(x.fails>=2){x.weight=+(w*.9).toFixed(1);x.fails=0;x.last=r.map(()=>x.min);notes.push(`${x.name}: ajusta para ${x.weight} kg`)}}else x.fails=0});
  P.sessions.push({date:S.today.date,split:s.name,prs});P.sessions=P.sessions.slice(-80);P.next=(P.next+1)%P.splits.length;
  if(h&&!ent(h).done)addSession(h);const e=h?ent(h):{};const bx=10+Math.min(3,prs)*10;e.logged=true;e.xp=(e.xp||0)+bx;addXP(bx);
  log(`Treino ${s.name} registrado. +${bx} XP.`);closeSheet();fx(prs?"lvl":"ok");toast(prs?`${prs} recorde(s) · +${bx} XP`:`Treino registrado · +${bx} XP`,prs?"gold":null);save();render();
  if(notes.length)queue({k:"msg",tab:"Treino",title:prs?"Novo recorde":"Treino ajustado",lines:notes.concat([`Próximo: ${nextSplit().name}`])})}

function resizePhoto(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const s=320,c=document.createElement("canvas");c.width=s;c.height=s;const x=c.getContext("2d"),m=Math.min(img.width,img.height);
  x.drawImage(img,(img.width-m)/2,(img.height-m)/2,m,m,0,0,s,s);res(c.toDataURL("image/jpeg",.82))};img.onerror=rej;img.src=r.result};r.onerror=rej;r.readAsDataURL(file)})}

/* ---------- 10. Integrações: lembretes no Calendário e links do Atalhos ---------- */
function buildICS(){const base=location.origin+location.pathname,BY=["SU","MO","TU","WE","TH","FR","SA"],t=S.today.date,st=new Date().toISOString().replace(/[-:]/g,"").slice(0,15)+"Z",E=[];
  const ev=(k,title,desc,min,days,url)=>{const first=days.map(d=>nextDow(t,d)).sort()[0],dt=m=>first.replace(/-/g,"")+"T"+hm(m).replace(":","")+"00";
    E.push("BEGIN:VEVENT",`UID:${k}@evolucao`,`DTSTAMP:${st}`,`DTSTART:${dt(min)}`,`DTEND:${dt(min+15)}`,`RRULE:FREQ=WEEKLY;BYDAY=${days.map(d=>BY[d]).join(",")}`,`SUMMARY:${icsEsc(title)}`,`DESCRIPTION:${icsEsc(desc+" "+url)}`,`URL:${url}`,"BEGIN:VALARM","ACTION:DISPLAY",`DESCRIPTION:${icsEsc(title)}`,"TRIGGER:-PT0M","END:VALARM","END:VEVENT")};
  const ALLD=[0,1,2,3,4,5,6],p=S.profile;
  if(S.areas.includes("sono")||S.pending.length>=0)ev("bomdia","☀️ Bom dia · Evolução","Registre o sono e confirme o que ficou de ontem.",(toMin(p.wake)+15)%1440,ALLD,base+"?acao=acordei");
  if(S.areas.includes("agua"))waterRounds().forEach(r=>ev("agua-"+r.id,`💧 Água · rodada ${r.l.toLowerCase()}`,`Meta da rodada: ${num(r.t)} L.`,Math.round(r.b-45+1440)%1440,ALLD,base+"?acao=agua"));
  const tr=H("treino");if(tr&&S.areas.includes("treino")&&tr.time)ev("treino","🏋️ Treino",`${tr.freq.times}× por semana.`,toMin(tr.time),tr.freq.days,base+"?acao=treino");
  if(S.areas.includes("sono"))ev("dormir","🌙 Hora de desacelerar",`Meta: dormir às ${p.sleep}.`,(toMin(p.sleep)-30+1440)%1440,ALLD,base);
  if(S.areas.includes("corpo"))ev("peso","⚖️ Pesagem da semana","De manhã, antes de comer.",toMin(p.wake)+20,[1],base);
  ev("noite","✅ Fechamento do dia","Veja o que falta hoje.",(toMin(p.sleep)-75+1440)%1440,ALLD,base);
  return["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Evolucao//PT-BR","CALSCALE:GREGORIAN","METHOD:PUBLISH","X-WR-CALNAME:Evolução",...E,"END:VCALENDAR"].join("\r\n")}
function urlAction(){const q=new URLSearchParams(location.search);if(!q.toString())return;history.replaceState(null,"",location.pathname);if(!S.onboarded)return;loop();const a=(q.get("acao")||"").toLowerCase(),v=+(q.get("v")||0);
  if(a==="agua"&&H("agua")){addWater(v>0?(v>10?v/1000:v):S.profile.glass/1000);commit()}else if(a==="treino"&&H("treino"))train();else if(a==="ler"&&H("leitura")){addQty(H("leitura"),v||H("leitura").steps[0]);commit()}
  else if(a==="estudo"&&H("estudo")){addQty(H("estudo"),v||15);commit()}else if(a==="mover"&&H("movimento")){addMinutes(H("movimento"),v||30);commit()}else if(a==="acordei")openReview();else if(a)toast("Ação do Atalho não reconhecida","red")}
document.addEventListener("click",e=>{const g=e.target.closest("[data-go]");if(g){tab=g.dataset.go;render();scrollTo(0,0);return}const n=e.target.closest("#nav [data-tab]");if(n){tab=n.dataset.tab;confirmReset=false;render();scrollTo(0,0);return}
  const b=e.target.closest("[data-do]");if(!b)return;const f=A[b.dataset.do];if(f)f(b)});
document.addEventListener("change",e=>{const t=e.target;
  if(t.id==="impFile"&&t.files[0]){t.files[0].text().then(tx=>{try{const d=migrate(JSON.parse(tx));if(!d)throw 0;S=d;save();render();toast("Backup restaurado")}catch(x){toast("Arquivo de backup inválido","red")}});return}
  if(t.id==="photoFile"&&t.files[0]){resizePhoto(t.files[0]).then(u=>{wz.d.photo=u;render()}).catch(()=>toast("Não consegui ler essa foto","red"));return}
  if(t.id==="sSound"){S.sound=t.checked;save()}if(t.id==="sTest"){S.test=t.checked;if(!S.test)S.offset=0;save();render()}if(t.dataset.rh&&hdraft){readHabitEdit();renderHabitEdit()}});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&sheetOpen)closeSheet()});
document.addEventListener("visibilitychange",()=>{if(!document.hidden)loop()});
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
setInterval(()=>{loop();const k=$("#clk");if(k)k.textContent=hm(vmin())},1000);render();loop();urlAction();
