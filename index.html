<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Evolução</title>
<meta name="theme-color" content="#050918">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Evolução">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#050918; --bg2:#0a1638; --panel:rgba(10,24,62,.78); --line:#3b8fe6; --glow:#7fdcff; --soft:rgba(127,220,255,.10);
  --ink:#e8f3ff; --mute:#8ea7cc; --gold:#ffd166; --red:#ff5d73; --ok:#5ff0b0; --input:rgba(3,9,26,.75);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#eaf2fc; --bg2:#d5e5f8; --panel:rgba(255,255,255,.88); --line:#3a86d8; --glow:#1463bd; --soft:rgba(20,99,189,.08);
    --ink:#0b1a33; --mute:#50688c; --gold:#9a6200; --red:#c4213a; --ok:#0c8553; --input:#fff;
  }
}
:root[data-theme="dark"]{
  --bg:#050918; --bg2:#0a1638; --panel:rgba(10,24,62,.78); --line:#3b8fe6; --glow:#7fdcff; --soft:rgba(127,220,255,.10);
  --ink:#e8f3ff; --mute:#8ea7cc; --gold:#ffd166; --red:#ff5d73; --ok:#5ff0b0; --input:rgba(3,9,26,.75);
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:radial-gradient(130% 55% at 50% -5%,var(--bg2),var(--bg) 72%) fixed;background-color:var(--bg);
  color:var(--ink);font:400 16px/1.5 Barlow,system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
.app{max-width:520px;margin:0 auto;padding:12px 14px 100px}
.disp,h1,h2,h3{font-family:"Chakra Petch",Barlow,system-ui,sans-serif;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--glow);outline-offset:2px}
.mute{color:var(--mute);font-size:.88rem}
.hide{display:none!important}

/* Janela do Sistema */
.win{position:relative;background:var(--panel);border:1px solid color-mix(in srgb,var(--glow) 55%,transparent);
  margin:0 0 14px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  box-shadow:0 0 24px color-mix(in srgb,var(--glow) 16%,transparent),inset 0 0 30px color-mix(in srgb,var(--glow) 6%,transparent)}
.win>.bd{padding:14px}
.tab{display:flex;justify-content:center;margin-top:-1px}
.tab span{font:600 .95rem "Chakra Petch",sans-serif;color:var(--glow);padding:4px 16px;border:1px solid color-mix(in srgb,var(--glow) 55%,transparent);border-top:0;
  background:var(--soft);text-shadow:0 0 10px color-mix(in srgb,var(--glow) 60%,transparent)}
.win.red{border-color:var(--red);box-shadow:0 0 26px color-mix(in srgb,var(--red) 28%,transparent)}
.win.red .tab span{color:var(--red);border-color:var(--red);background:color-mix(in srgb,var(--red) 10%,transparent)}
.warn{font-size:.85rem;color:var(--red);margin:12px 0 0;text-align:center}

/* HUD */
.hud{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;padding:12px 14px}
.rank{width:58px;height:58px;display:grid;place-items:center;font:700 2.1rem/1 "Chakra Petch",sans-serif;color:var(--rk);
  border:2px solid var(--rk);text-shadow:0 0 14px var(--rk);box-shadow:inset 0 0 14px color-mix(in srgb,var(--rk) 25%,transparent)}
.lvrow{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.lvrow b{font:600 1.25rem "Chakra Petch",sans-serif}
.bar{height:7px;background:var(--input);border:1px solid color-mix(in srgb,var(--line) 45%,transparent);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--line),var(--glow));box-shadow:0 0 8px var(--glow);transition:width .6s}
.bar.red i{background:var(--red);box-shadow:none}

/* Linhas da missão */
.goal{font-size:.9rem;color:var(--mute);text-align:center;margin:0 0 10px}
.q{display:block;width:100%;background:none;border:0;border-bottom:1px dashed color-mix(in srgb,var(--line) 35%,transparent);padding:11px 2px;text-align:left}
.q:last-of-type{border-bottom:0}
.q .top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.q .nm{font-weight:600}
.q .pg{font:600 .95rem "Chakra Petch",sans-serif;color:var(--glow);white-space:nowrap}
.q .bar{margin-top:6px;height:4px}
.q.done .nm{color:var(--mute)}
.q.done .pg{color:var(--ok)}
.q.exc .pg{color:var(--mute)}
.q .sub{font-size:.8rem;color:var(--mute)}
.next{font-size:.85rem;color:var(--mute);margin-top:8px}

/* Botões */
.btn{background:transparent;color:var(--glow);border:1px solid var(--glow);padding:10px 16px;font:600 .95rem "Chakra Petch",sans-serif}
.btn:hover{background:var(--soft)}
.btn.solid{background:var(--line);border-color:var(--line);color:#fff}
.btn.red{color:var(--red);border-color:var(--red)}
.btn.ghost{border-color:transparent;color:var(--mute)}
.btn.full{width:100%}
.btn:disabled{opacity:.4;cursor:default}
.btns{display:grid;gap:8px;margin-top:14px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:.8rem;padding:4px 10px;border:1px solid color-mix(in srgb,var(--glow) 40%,transparent);background:var(--soft);color:var(--glow)}
.tag{font-size:.75rem;padding:1px 7px;border:1px solid color-mix(in srgb,var(--glow) 35%,transparent);color:var(--glow)}
.tag.g{color:var(--gold);border-color:color-mix(in srgb,var(--gold) 45%,transparent)}

/* Stepper */
.step{display:inline-flex;align-items:center;border:1px solid color-mix(in srgb,var(--line) 60%,transparent);background:var(--input)}
.step button{width:40px;height:40px;background:none;border:0;color:var(--glow);font:600 1.2rem "Chakra Petch",sans-serif}
.step input{width:58px;height:40px;text-align:center;background:none;border:0;color:var(--ink);font:600 1.05rem "Chakra Petch",sans-serif;-moz-appearance:textfield}
.step input::-webkit-inner-spin-button{display:none}
.step.sm button{width:30px;height:34px;font-size:1rem}.step.sm input{width:36px;height:34px;font-size:.95rem}
.ex{padding:12px 0;border-bottom:1px dashed color-mix(in srgb,var(--line) 35%,transparent)}
.ex:last-child{border-bottom:0}
.sets{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}

/* Formulários */
input,select{font:inherit;color:var(--ink);background:var(--input);border:1px solid color-mix(in srgb,var(--line) 55%,transparent);padding:9px 10px;min-width:0;width:100%}
.form{display:grid;gap:12px}
.form label{display:grid;gap:4px;font-size:.85rem;color:var(--mute)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.days{display:flex;gap:4px;flex-wrap:wrap}
.days button{flex:1;min-width:38px;padding:7px 0;border:1px solid color-mix(in srgb,var(--line) 55%,transparent);background:var(--input);color:var(--mute);font-size:.85rem}
.days button[aria-pressed=true]{background:var(--line);color:#fff;border-color:var(--line)}
.exrow{display:grid;grid-template-columns:1fr 64px 56px auto;gap:6px;align-items:center;margin-bottom:6px}
.exrow2{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:-2px 0 12px}
.exrow input,.exrow2 input{padding:7px 8px;font-size:.9rem}
.check{display:flex;gap:10px;align-items:center;color:var(--ink)!important;font-size:.92rem!important}
.check input{width:20px;height:20px}

/* Status */
.srow{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed color-mix(in srgb,var(--line) 30%,transparent)}
.srow:last-child{border-bottom:0}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:4px 18px;margin-top:4px}
.stats div{display:flex;justify-content:space-between;padding:5px 0}
.stats b{font-family:"Chakra Petch",sans-serif;color:var(--glow)}
.heat{display:grid;grid-template-columns:repeat(14,1fr);gap:4px}
.heat span{aspect-ratio:1;background:var(--input);border:1px solid color-mix(in srgb,var(--line) 25%,transparent)}
.heat .h1{background:color-mix(in srgb,var(--glow) 35%,transparent)}.heat .h2{background:var(--glow)}.heat .h0{background:color-mix(in srgb,var(--red) 45%,transparent)}
.log{max-height:240px;overflow:auto;font-size:.88rem}
.log p{margin:0 0 7px;padding-left:10px;border-left:2px solid var(--line)}
.rep p{margin:0 0 8px}

/* Rotina */
.ri{display:flex;justify-content:space-between;align-items:center;width:100%;background:none;border:0;border-bottom:1px dashed color-mix(in srgb,var(--line) 30%,transparent);padding:11px 2px;text-align:left}
.ri:last-child{border-bottom:0}

/* Navegação */
nav{position:fixed;left:0;right:0;bottom:0;z-index:5;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border-top:1px solid color-mix(in srgb,var(--glow) 35%,transparent);padding-bottom:env(safe-area-inset-bottom,0px)}
nav div{display:flex;max-width:520px;margin:0 auto}
nav button{flex:1;background:none;border:0;color:var(--mute);padding:14px 0;font:600 .95rem "Chakra Petch",sans-serif}
nav button[aria-current=page]{color:var(--glow);text-shadow:0 0 10px color-mix(in srgb,var(--glow) 60%,transparent);box-shadow:inset 0 2px 0 var(--glow)}

/* Sheet, modal, toast */
.ov{position:fixed;inset:0;z-index:20;background:rgba(1,4,14,.7);display:none}
.ov.on{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-height:88%;overflow:auto;transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.9,.3,1);
  padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet.on{transform:none}
.sheet .win{max-width:520px;margin:0 auto;border-bottom:0}
.sheet h3{font-size:1.2rem;margin-bottom:4px}
.modal{position:fixed;inset:0;z-index:30;display:none;place-items:center;padding:20px;background:rgba(1,4,14,.75)}
.modal.on{display:grid}
.modal .win{width:100%;max-width:370px;text-align:center;animation:pop .5s cubic-bezier(.2,1.5,.4,1)}
.modal .bd{padding:22px 18px}
.modal .huge{font:700 3.6rem/1.1 "Chakra Petch",sans-serif;color:var(--rk,var(--glow));text-shadow:0 0 22px currentColor;margin:4px 0}
.modal p{margin:6px 0}
@keyframes pop{from{transform:scale(.8);opacity:0}to{transform:none;opacity:1}}
.toast{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);left:50%;z-index:40;transform:translate(-50%,-160%);transition:transform .3s;
  background:var(--panel);border:1px solid var(--glow);padding:10px 16px;font:600 .92rem "Chakra Petch",sans-serif;color:var(--ink);
  box-shadow:0 0 20px color-mix(in srgb,var(--glow) 35%,transparent);max-width:90vw;text-align:center;backdrop-filter:blur(8px)}
.toast.on{transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* v0.3: agora, linha do dia, trilha */
.strip{display:flex;justify-content:space-between;gap:4px;padding:10px 14px}
.strip div{flex:1;text-align:center;font-size:.72rem;color:var(--mute)}
.strip i{display:block;width:26px;height:26px;margin:0 auto 3px;border:1px solid color-mix(in srgb,var(--line) 45%,transparent);background:var(--input);transform:rotate(45deg)}
.strip .f i{background:linear-gradient(135deg,var(--gold),#ff7a3d);border-color:var(--gold);box-shadow:0 0 10px color-mix(in srgb,var(--gold) 60%,transparent)}
.strip .x i{background:color-mix(in srgb,var(--red) 40%,transparent);border-color:var(--red)}
.strip .t{color:var(--ink);font-weight:600}
.strip .t i{border-color:var(--glow);border-width:2px}
.fire{font:700 1rem "Chakra Petch",sans-serif;color:var(--gold)}
.now .when{font-size:.9rem;color:var(--mute);text-align:center}
.now .big{font:700 1.6rem/1.2 "Chakra Petch",sans-serif;text-align:center;margin:6px 0 4px;text-shadow:0 0 16px color-mix(in srgb,var(--glow) 40%,transparent)}
.now .cd{text-align:center;font-size:.95rem;margin-bottom:4px}
.now .cd b{font-family:"Chakra Petch",sans-serif;color:var(--glow);font-size:1.15rem}
.now .cd.late b{color:var(--red)}
.now .pts{display:flex;justify-content:center;gap:8px;margin-top:6px}
.btn.xl{padding:15px;font-size:1.1rem}
.sp{border-color:color-mix(in srgb,var(--gold) 70%,transparent);box-shadow:0 0 24px color-mix(in srgb,var(--gold) 20%,transparent)}
.sp .tab span{color:var(--gold);border-color:color-mix(in srgb,var(--gold) 70%,transparent);background:color-mix(in srgb,var(--gold) 10%,transparent);text-shadow:0 0 10px color-mix(in srgb,var(--gold) 50%,transparent)}
.sp .ttl{font:600 1.1rem "Chakra Petch",sans-serif;text-align:center;margin:2px 0 8px}
.tl{display:grid;grid-template-columns:50px 16px 1fr auto;gap:10px;align-items:center;padding:10px 2px;border-bottom:1px dashed color-mix(in srgb,var(--line) 30%,transparent)}
.tl:last-child{border-bottom:0}
.tl .tm{font:600 .95rem "Chakra Petch",sans-serif;color:var(--mute)}
.tl .dt{width:12px;height:12px;border:2px solid var(--line);transform:rotate(45deg)}
.tl .main{background:none;border:0;text-align:left;padding:0;min-width:0}
.tl .main b{display:block;font-weight:600}
.tl .sub{font-size:.8rem;color:var(--mute)}
.tl .st{font:600 .85rem "Chakra Petch",sans-serif;white-space:nowrap}
.tl.done .dt{background:var(--ok);border-color:var(--ok)}.tl.done .st{color:var(--ok)}.tl.done .main b{color:var(--mute)}
.tl.fail .dt{background:var(--red);border-color:var(--red)}.tl.fail .st{color:var(--red)}
.tl.exc .dt{border-color:var(--mute)}.tl.exc .st{color:var(--mute)}
.tl.act .dt{background:var(--glow);border-color:var(--glow);box-shadow:0 0 10px var(--glow)}.tl.act .st{color:var(--glow)}
.tl.act .tm{color:var(--glow)}
.demo{display:flex;gap:6px;flex-wrap:wrap;align-items:center;justify-content:center;padding:12px;border:1px dashed color-mix(in srgb,var(--line) 55%,transparent);margin-top:4px}
.demo span{width:100%;text-align:center;font-size:.8rem;color:var(--mute)}
/* trilha */
.floor{text-align:center;margin:18px 0 8px}
.floor b{font:600 1.05rem "Chakra Petch",sans-serif;color:var(--glow)}
.path{display:flex;flex-direction:column;align-items:center;gap:14px;padding:6px 0 10px}
.node{width:66px;height:66px;border-radius:50%;border:2px solid color-mix(in srgb,var(--line) 50%,transparent);background:var(--input);color:var(--mute);
  font:700 1.2rem "Chakra Petch",sans-serif;display:grid;place-items:center;position:relative}
.node.done{background:var(--line);border-color:var(--glow);color:#fff;box-shadow:0 0 12px color-mix(in srgb,var(--glow) 40%,transparent)}
.node.cur{border-color:var(--glow);color:var(--glow);box-shadow:0 0 0 6px color-mix(in srgb,var(--glow) 15%,transparent),0 0 22px var(--glow);animation:pulse 1.8s infinite}
.node.boss{width:84px;height:84px;border-color:color-mix(in srgb,var(--gold) 60%,transparent);color:var(--gold)}
.node.boss.done{background:linear-gradient(135deg,var(--gold),#ff7a3d);color:#1a1000}
.node .lb{position:absolute;top:100%;margin-top:4px;font:600 .72rem Barlow,sans-serif;color:var(--mute);white-space:nowrap}
.node.cur .lb{color:var(--glow)}
@keyframes pulse{50%{box-shadow:0 0 0 12px color-mix(in srgb,var(--glow) 0%,transparent),0 0 30px var(--glow)}}
.timerbig{font:700 2.6rem "Chakra Petch",sans-serif;text-align:center;color:var(--glow);text-shadow:0 0 18px var(--glow)}

/* v0.4: contexto, cartões, plano por blocos, relâmpago */
.ctx .bd{padding:12px 14px}
.ctx .where{font:700 1.35rem/1.2 "Chakra Petch",sans-serif;text-align:center;text-shadow:0 0 14px color-mix(in srgb,var(--glow) 40%,transparent)}
.ctx .sub{text-align:center;font-size:.88rem;color:var(--mute);margin-top:2px}
.ctx .clock{text-align:center;font:600 .85rem "Chakra Petch",sans-serif;color:var(--glow)}
.mc{padding:12px 0;border-bottom:1px dashed color-mix(in srgb,var(--line) 30%,transparent)}
.mc:last-child{border-bottom:0}
.mc .hd{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.mc .nm{font-weight:600;font-size:1.05rem;background:none;border:0;padding:0;text-align:left}
.mc .meta{font-size:.82rem;color:var(--mute)}
.mc .cd{font:600 .85rem "Chakra Petch",sans-serif;color:var(--glow);white-space:nowrap}
.mc .cd.late{color:var(--red)}
.mc .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.mc .acts .btn{flex:1;min-width:88px;padding:11px 10px}
.mc .bar{margin-top:8px;height:5px}
.flash{border-color:var(--gold);box-shadow:0 0 26px color-mix(in srgb,var(--gold) 30%,transparent);animation:glowf 1.6s infinite}
.flash .tab span{color:var(--gold);border-color:var(--gold);background:color-mix(in srgb,var(--gold) 12%,transparent)}
@keyframes glowf{50%{box-shadow:0 0 38px color-mix(in srgb,var(--gold) 45%,transparent)}}
.flash .txt{font:600 1.15rem "Chakra Petch",sans-serif;text-align:center;margin:2px 0 4px}
.blk{display:grid;grid-template-columns:50px 1fr;gap:10px;padding:9px 2px;border-bottom:1px dashed color-mix(in srgb,var(--line) 25%,transparent)}
.blk:last-child{border-bottom:0}
.blk .tm{font:600 .9rem "Chakra Petch",sans-serif;color:var(--mute);padding-top:1px}
.blk .lb{font-weight:600}
.blk.past .lb,.blk.past .tm{color:var(--mute);opacity:.7}
.blk.cur{background:var(--soft);margin:0 -8px;padding-left:10px;padding-right:10px;border-left:2px solid var(--glow)}
.blk.cur .tm,.blk.cur .lb{color:var(--glow)}
.mchips{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px}
.mchip{font-size:.78rem;padding:3px 8px;border:1px solid color-mix(in srgb,var(--line) 45%,transparent);background:var(--input);color:var(--ink)}
.mchip.done{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 50%,transparent)}
.mchip.fail{color:var(--red);border-color:color-mix(in srgb,var(--red) 50%,transparent)}
.mchip.exc{color:var(--mute)}
.mchip.fl{color:var(--gold);border-color:color-mix(in srgb,var(--gold) 45%,transparent);background:transparent}
.quiet{text-align:center;color:var(--mute);font-size:.92rem;margin:0}

/* correções iOS */
.two{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
input,select{-webkit-appearance:none;appearance:none;border-radius:0;max-width:100%;min-height:44px;text-align:left}
input[type=checkbox]{-webkit-appearance:checkbox;appearance:auto;min-height:0}
input[type=time]{display:block;width:100%;min-width:0}
input[type=time]::-webkit-date-and-time-value{text-align:left}
.step input{min-height:0;text-align:center}
.toast{visibility:hidden;opacity:0;transition:transform .3s,opacity .3s,visibility .3s}
.toast.on{visibility:visible;opacity:1}
.mchip.ev{color:#b193ff;border-color:color-mix(in srgb,#b193ff 50%,transparent);background:transparent}
</style>
</head>
<body>
<div class="app">
  <header class="win hud" id="hud"></header>
  <main id="view"></main>
</div>
<nav id="nav"><div>
  <button data-tab="agora" aria-current="page">Agora</button>
  <button data-tab="trilha">Trilha</button>
  <button data-tab="status">Status</button>
  <button data-tab="rotina">Rotina</button>
</div></nav>
<div class="ov" id="ov"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"><div class="win"><div class="bd" id="sheetBody"></div></div></div>
<div class="modal" id="modal" role="dialog" aria-modal="true"><div class="win"><div class="tab"><span id="mTab">Notificação</span></div><div class="bd" id="mBody"></div></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
"use strict";
/* =====================================================================
   O SISTEMA v0.4
   1. Utilidades   2. Relógio   3. Estado e persistência
   4. Agenda (blocos do dia)    5. Regras (missões, XP, rank, relâmpagos)
   6. Motor (tick, fechamento de dia)   7. Efeitos   8. Telas   9. Ações
   ===================================================================== */

/* ---------- 4. Agenda: blocos do dia ---------- */
const isWork=date=>S.sched.work.includes(dow(date));
const daySched=date=>isWork(date)?S.sched.wd:S.sched.we;
const M=id=>S.missions.find(m=>m.id===id);
const dueOn=(m,date)=>m.days.includes(dow(date));
function blocks(date){const out=[];const add=(id,a,b,label)=>{a=Math.max(a,out.length?out[out.length-1].b:0);b=Math.min(b,1440);if(b>a)out.push({id,a,b,label})};
  if(isWork(date)){const d=S.sched.wd,W=toMin(d.wake),L=toMin(d.leave),WS=toMin(d.workStart),LU=toMin(d.lunch),LE=LU+(+d.lunchDur||60),WE=toMin(d.workEnd),C=Math.max(10,WS-L),SL=toMin(d.sleep);
    add("sono",0,W,"Dormindo");add("casa",W,L,"Manhã em casa");add("onibus",L,WS,"Ônibus · ida");add("trabalho",WS,LU,"Trabalho");add("almoco",LU,LE,"Almoço");
    const g=M("gym"),gt=!!(g&&dueOn(g,date)),G=toMin(d.gym),GD=+d.gymDur||90;add("trabalho",LE,WE,"Trabalho");add("onibus",WE,gt&&G>WE?Math.min(WE+C,G):WE+C,"Ônibus · volta");
    if(gt){const lb=out[out.length-1].b;if(G>lb)add("noite",lb,G,"Em casa");if(G>=out[out.length-1].b)out.push({id:"academia",a:G,b:Math.min(1440,G+GD),label:"Academia"});else add("academia",G,G+GD,"Academia")}
    add("noite",out[out.length-1].b,SL,"Noite em casa");add("sono",SL,1440,"Dormindo")}
  else{const d=S.sched.we,W=toMin(d.wake),SL=toMin(d.sleep);add("sono",0,W,"Dormindo");add("livre",W,720,"Manhã livre");add("livre",720,1080,"Tarde livre");add("noite",1080,SL,"Noite");add("sono",SL,1440,"Dormindo")}

const blockAt=(date,m)=>{const bl=blocks(date);const i=bl.findIndex(b=>m>=b.a&&m<b.b);return{i,b:bl[i],bl}};

/* ---------- 5. Regras ---------- */
const ent=m=>S.today.e[m.id]||(S.today.e[m.id]={});
const resolved=e=>!!(e.done||e.failed||e.excused);
const isFixed=m=>["wake","sleep","gym"].includes(m.kind)||!!m.fixed;
const dueToday=()=>S.missions.filter(m=>dueOn(m,S.today.date)).sort((a,b)=>win(a).start-win(b).start);
function win(m,date=S.today.date){const d=daySched(date),W=toMin(d.wake),SL=Math.min(1439,toMin(d.sleep));
  switch(m.kind){case"wake":return{open:W-120,start:W,end:W+30};
    case"sleep":return{open:SL-90,start:SL-60,end:Math.min(1439,SL+30)};
    case"gym":{const G=toMin(S.sched.wd.gym);return{open:G-60,start:G,end:Math.min(1439,G+(+S.sched.wd.gymDur||90))}}
    default:return m.fixed?{open:toMin(m.time)-60,start:toMin(m.time),end:toMin(m.until)}:{open:0,start:W,end:SL}}}
function title(m){const d=daySched(S.today.date);if(m.kind==="wake")return`Acordar às ${d.wake}`;if(m.kind==="sleep")return`Dormir até ${d.sleep}`;
  if(m.kind==="qty")return`${m.name} ${num(m.target)} ${m.unit}`;return m.name}
function whenTxt(m){const w=win(m);if(isFixed(m))return`${hm(w.start)} – ${hm(w.end)}`;const has=blocks(S.today.date).some(b=>b.id===m.ctx);return`${has&&m.ctx!=="any"?CTX[m.ctx]:"quando der"} · até ${hm(w.end)}`}
function suggested(m,now){const e=ent(m);if(resolved(e))return false;const w=win(m);if(now<w.open||now>=w.end)return false;
  if(isFixed(m))return now>=(m.kind==="wake"?w.open:w.start-15);
  const{b}=blockAt(S.today.date,now);if(!b||b.id==="sono"||b.id==="trabalho"||b.id==="academia")return false;
  if(b.id==="noite"||m.ctx==="any"||b.id===m.ctx)return true;
  return !blocks(S.today.date).some(x=>x.id===m.ctx)&&["casa","livre"].includes(b.id)}
const canAct=(m,now=vmin())=>now>=win(m).open&&now<win(m).end;
function log(t){S.log.unshift({d:S.today.date,h:hm(vmin()),t});S.log=S.log.slice(0,150)}
function calcRank(){const h=S.history.slice(-30).filter(x=>x.due>0);if(h.length<3)return"E";
  const rate=h.reduce((s,x)=>s+x.done,0)/h.reduce((s,x)=>s+x.due,0);for(const k of RANKS)if(rate>=k.rate&&S.level>=k.lvl)return k.r;return"E"}
function checkRank(){const r=calcRank();if(r===S.rank)return;const up="EDCBAS".indexOf(r)>"EDCBAS".indexOf(S.rank);S.rank=r;log(up?`Rank elevado para ${r}.`:`Rank rebaixado para ${r}.`);queue({k:"rank",up,r})}
function addXP(n,stat){if(stat&&STATS[stat])S.statXP[stat]=Math.max(0,S.statXP[stat]+n);S.xp+=n;
  while(S.xp>=need(S.level)){S.xp-=need(S.level);S.level++;log(`Nível ${S.level} alcançado.`);queue({k:"lvl",up:true})}
  while(S.xp<0&&S.level>1){S.level--;S.xp+=need(S.level);log(`Caiu para o nível ${S.level}.`);queue({k:"lvl",up:false})}
  if(S.xp<0)S.xp=0;checkRank()}

/* Missão especial (trilha) */
const CATS=[
 ["Corpo","STR",[t=>`${10+t*10} flexões ao longo do dia`,t=>`Prancha de ${30+t*15} s sem parar`,t=>`${20+t*15} agachamentos livres`,t=>`Caminhe ${2+t} km`]],
 ["Mente","INT",[t=>`Leia ${5+t*5} páginas além da sua meta`,t=>`Medite ${5+t*2} min em silêncio`,t=>`Aprenda algo novo e explique em 3 frases`,t=>`Escreva ${2+t} ideias para um projeto seu`]],
 ["Disciplina","PER",[t=>`${1+t} h seguidas sem redes sociais`,t=>`Dia inteiro sem doce e sem refrigerante`,t=>`Acorde ${5+t*5} min antes do seu horário`,t=>`Deixe mesa e quarto 100% arrumados`]],
 ["Coragem","AGI",[t=>`Termine o banho com ${Math.min(3,t)} min de água fria`,t=>`Resolva hoje algo que você vem adiando`,t=>`Puxe conversa com alguém que você não conhece bem`,t=>`Faça ${t} tarefa(s) difícil(eis) antes do almoço`]]];
function challenge(n){const t=Math.floor(n/5)+1,boss=n%5===4,r=seeded("no"+n);const pick=ci=>{const c=CATS[ci];return{cat:c[0],stat:c[1],text:c[2][Math.floor(r()*c[2].length)](t)}};
  if(boss){const a=pick(n%4),b=pick((n+1)%4);return{n,t,boss,cat:"Chefe do andar",stat:a.stat,text:`${a.text} e ${b.text.charAt(0).toLowerCase()+b.text.slice(1)}`,xp:(50+(t-1)*15)*2}}
  return{n,t,boss,...pick(n%4),xp:50+(t-1)*15}}

/* Missões relâmpago: chegam no horário de trabalho, 20 min para fazer, não tiram ponto */
const FLASH=[["Beba um copo de água","VIT","water"],["Alongue pescoço e ombros por 1 min","VIT"],["Levante e caminhe 2 min","AGI"],["Corrija a postura e respire fundo 5 vezes","PER"],
  ["Olhe para longe da tela por 20 s","PER"],["10 agachamentos, se der","STR"],["Anote uma coisa que aprendeu hoje","INT"],["Suba um lance de escada","AGI"],["Leia 2 páginas no intervalo","INT","read"]];
function genFlash(date){if(S.paused||!isWork(date))return[];const ws=blocks(date).filter(b=>b.id==="trabalho");const total=ws.reduce((s,b)=>s+b.b-b.a,0);if(total<60)return[];
  const r=seeded("f"+date),pool=[...FLASH],n=S.flashRate,out=[];
  for(let k=0;k<n;k++){let t=(k+.2+.6*r())/n*total,at=0;for(const b of ws){const len=b.b-b.a;if(t<=len){at=b.a+t;break}t-=len}at=Math.round(Math.min(at,ws[ws.length-1].b-25));
    const[text,stat,link]=pool.splice(Math.floor(r()*pool.length),1)[0];out.push({id:"f"+k,text,stat,link:link||null,at,exp:at+20,xp:10,st:"wait"})}
  return out.sort((a,b)=>a.at-b.at)}
function newDay(date){return{date,e:{},flash:genFlash(date),sp:false,bi:-1,warned:false}}

/* ---------- 6. Motor ---------- */
const ev=[];const emit=(t,x={})=>ev.push({t,...x});
function tick(now,silent){const t=S.today;let ch=false;
  const{i,b}=blockAt(t.date,now);if(i!==t.bi){t.bi=i;ch=true;if(!silent&&b&&!S.paused)emit("block",{b})}
  if(S.paused)return ch;
  for(const m of dueToday()){const e=ent(m);if(resolved(e))continue;const w=win(m);
    if(now>=w.end){e.failed=true;addXP(-m.loss,m.stat);log(`${title(m)}: prazo encerrado. −${m.loss} XP.`);ch=true;if(!silent)emit("fail",{m});continue}
    if(isFixed(m)&&now>=w.start&&!e.pinged){e.pinged=true;ch=true;if(!silent)emit("start",{m})}}
  const SL=win({kind:"sleep"}).start+60;
  if(!t.warned&&now>=SL-45&&now<SL){t.warned=true;ch=true;const p=dueToday().filter(m=>!isFixed(m)&&!resolved(ent(m)));if(p.length&&!silent)emit("warn",{p})}
  for(const f of t.flash){if(f.st==="wait"&&now>=f.at){f.st=now>=f.exp?"miss":"live";ch=true;if(f.st==="live"&&!silent)emit("flash",{f})}
    else if(f.st==="live"&&now>=f.exp){f.st="miss";log(`Relâmpago expirou: ${f.text}.`);ch=true}}
  return ch}
function closeDayPaused(){const t=S.today;S.history.push({date:t.date,due:0,done:0,fl:0,fd:0,sp:t.sp,paused:true});const next=addDays(t.date,1);
  if(weekKey(next)!==S.week.key)S.week={key:weekKey(next),shields:1};if(S.paused.until&&next>S.paused.until){S.paused=null;log("Pausa encerrada. O Sistema voltou.")}
  S.today=newDay(next);return{date:t.date,n:0,d:0,fl:0,fd:0,sp:t.sp,paused:true}}
function closeDay(){if(S.paused)return closeDayPaused();const t=S.today,due=dueToday();let n=0,d=0;
  for(const m of due){const e=t.e[m.id]||{};if(e.excused)continue;n++;if(e.done)d++;
    if(m.kind==="qty"&&m.auto){m.since.push(e.done?1:0);if(m.since.length>=7){const rate=m.since.reduce((s,x)=>s+x,0)/7,old=m.target;
      if(rate>=.8)m.target=Math.ceil(m.target*1.1);else if(rate<=.3)m.target=Math.max(1,Math.floor(m.target*.9));
      if(m.target!==old)log(`${m.name}: meta ${m.target>old?"sobe":"desce"} de ${num(old)} para ${num(m.target)} ${m.unit}.`);m.since=[]}}}
  const fl=t.flash.length,fd=t.flash.filter(f=>f.st==="done").length;
  if(fl){const old=S.flashRate;if(fd===fl)S.flashRate=Math.min(5,S.flashRate+1);else if(fd===0)S.flashRate=Math.max(1,S.flashRate-1);
    if(S.flashRate!==old)log(`Relâmpagos por dia de trabalho: ${old} → ${S.flashRate}.`)}
  S.history.push({date:t.date,due:n,done:d,fl,fd,sp:t.sp});
  if(n){if(d===n){S.streak++;S.best=Math.max(S.best,S.streak)}else S.streak=0}
  const next=addDays(t.date,1);if(weekKey(next)!==S.week.key)S.week={key:weekKey(next),shields:1};
  S.today=newDay(next);checkRank();return{date:t.date,n,d,fl,fd,sp:t.sp}}
function rollover(){const vd=vdate();if(S.today.date>=vd)return false;const reps=[];let g=0;
  while(S.today.date<vd&&g++<60){tick(1440,true);reps.push(closeDay())}
  const r=reps[reps.length-1],L=[];if(reps.length>1)L.push(`${reps.length} dias processados enquanto você esteve fora.`);
  if(r.paused)L.push("Dia em pausa: sem perdas, sequência mantida.");else L.push(r.n?(r.d===r.n?`Rotina completa: ${r.d}/${r.n}. Sequência de ${S.streak} dia(s).`:`Rotina: ${r.d}/${r.n}. Sequência zerada.`):"Dia sem rotina.");
  if(r.fl)L.push(`Relâmpagos: ${r.fd}/${r.fl}.`);L.push(r.sp?"Missão especial concluída.":"Missão especial não foi feita.");
  if(S.streak&&S.streak%7===0)L.push(`Marco: ${S.streak} dias seguidos.`);if(dow(S.today.date)===1&&S.history.length>=3)L.push("Semana nova. Dá para mandar o resumo da semana pelo e-mail em Rotina → Integrações.");
  tick(vmin(),true);save();queue({k:"msg",tab:"Relatório",title:`Relatório · ${fmt(r.date)}`,lines:L},true);return true}
function loop(){if(!S.accepted)return;geoCheck();const r=rollover();const ch=S.today.date===vdate()&&tick(vmin(),false);flush();if(r||ch){save();render()}else live()}

/* ---------- 7. Efeitos ---------- */
let AC;
function tone(fs,d=.09){if(!S.sound)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();let t=AC.currentTime;
  fs.forEach(f=>{const o=AC.createOscillator(),g=AC.createGain();o.type="triangle";o.frequency.value=f;g.gain.setValueAtTime(.0001,t);
  g.gain.exponentialRampToValueAtTime(.14,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d+.03);t+=d*.85})}catch(e){}}
const SFX={ok:()=>{tone([880,1320]);navigator.vibrate?.(25)},ping:()=>{tone([1175,1175],.07);navigator.vibrate?.([30,40,30])},flash:()=>{tone([1320,1760,1320,1760],.06);navigator.vibrate?.([60,40,60,40,60])},
  lvl:()=>{tone([660,880,1100,1320,1760],.12);navigator.vibrate?.([40,40,80])},bad:()=>{tone([300,200],.18);navigator.vibrate?.([80,60,80])}};
const fx=k=>S.sound&&SFX[k]&&SFX[k]();
const TQ=[];let tBusy=false;
function toast(t,kind){TQ.push([t,kind]);if(TQ.length>4)TQ.splice(0,TQ.length-4);if(!tBusy)nextToast()}
function nextToast(){const x=TQ.shift(),e=$("#toast");if(!x){tBusy=false;e.classList.remove("on");return}tBusy=true;e.textContent=x[0];
  e.style.borderColor=x[1]==="red"?"var(--red)":x[1]==="gold"?"var(--gold)":"";e.classList.add("on");setTimeout(nextToast,2800)}
function flush(){for(const x of ev.splice(0)){switch(x.t){
  case"block":{const b=x.b;if(b.id==="sono")break;if(b.id==="trabalho"){fx("ping");toast("Modo trabalho · o Sistema fica em silêncio, só relâmpagos");break}
    const s=dueToday().filter(m=>suggested(m,b.a+1));if(s.length){fx("ping");toast(`${b.label}: ${s.map(m=>m.kind==="qty"?`${m.name.toLowerCase()} ${num(m.target)} ${m.unit}`:m.name.toLowerCase()).slice(0,2).join(" e ")}`)}break}
  case"start":fx("ping");toast(`Notificação do Sistema · ${title(x.m)}`);break;
  case"fail":fx("bad");toast(`Missão falhou: ${x.m.name} · −${x.m.loss} XP`,"red");break;
  case"warn":fx("ping");toast(`45 min para dormir · faltam ${x.p.map(m=>m.name.toLowerCase()).join(", ")}`,"red");break;
  case"flash":fx("flash");toast(`Missão relâmpago · ${x.f.text}`,"gold");break}}}

const Q=[];let showing=false;

  else if(m.k==="rank"){w.style.setProperty("--rk",RC[m.r]);h=`<h3>${m.up?"Rank elevado":"Rank rebaixado"}</h3><div class="huge">${m.r}</div><p class="mute">Título: ${TITLE[m.r]}</p>`}
  else{tb=m.tab||tb;h=`<h3>${esc(m.title)}</h3>${(m.lines||[]).map(l=>`<p>${esc(l)}</p>`).join("")}`}
  $("#mTab").textContent=tb;$("#mBody").innerHTML=h+`<div class="btns"><button class="btn solid" id="mOk">Continuar</button></div>`;md.classList.add("on");$("#mOk").focus();$("#mOk").onclick=nextM}

function inlineActs(m){const e=ent(m);if(resolved(e))return"";if(!canAct(m))return`<div class="acts"><button class="btn" disabled>Libera às ${hm(win(m).open)}</button></div>`;
  switch(m.kind){case"wake":return`<div class="acts"><button class="btn solid" data-do="done" data-id="${m.id}">Acordei</button></div>`;
    case"sleep":return`<div class="acts"><button class="btn solid" data-do="done" data-id="${m.id}">Indo dormir</button></div>`;
    case"check":return`<div class="acts"><button class="btn solid" data-do="done" data-id="${m.id}">Feito</button></div>`;
    case"gym":return`<div class="acts"><button class="btn solid" data-do="done" data-id="${m.id}">Cheguei na academia</button></div>`;
    case"presence":return`<div class="acts"><button class="btn solid" data-do="pres" data-id="${m.id}">Fui</button><button class="btn" data-do="cancel" data-id="${m.id}">Não teve</button></div>`;
    case"qty":return`<div class="acts">${m.steps.map(s=>`<button class="btn solid" data-do="add" data-id="${m.id}" data-v="${s}">+${num(s)} ${m.unit==="L"?"L":m.unit.slice(0,3)+"."}</button>`).join("")}<button class="btn" data-do="open" data-id="${m.id}">Outro</button></div>`}}
function card(m){const e=ent(m),w=win(m),p=m.kind==="qty"?Math.min(100,(e.value||0)/m.target*100):0;
  return`<div class="mc"><div class="hd"><button class="nm" data-do="open" data-id="${m.id}">${esc(title(m))}</button><span class="cd" data-end="${w.end}"></span></div>
  <div class="meta">${whenTxt(m)} · ${STATS[m.stat]} · +${m.xp} / −${m.loss}${m.kind==="qty"?` · <b style="color:var(--ink)">${num(e.value||0)}/${num(m.target)}</b>`:""}</div>
  ${m.kind==="qty"?`<div class="bar"><i style="width:${p}%"></i></div>`:""}${inlineActs(m)}</div>`}
function viewAgora(){const t=S.today,now=vmin(),{b,bl,i}=blockAt(t.date,now),nb=bl[i+1];const due=dueToday();let h=strip();
  const live=t.flash.filter(f=>f.st==="live");
  h+=`<section class="win ctx"><div class="tab"><span>Agora</span></div><div class="bd"><div class="where">${b?esc(b.label):"—"}</div><div class="sub">${b?`${hm(b.a)} – ${hm(b.b)}`:""}${nb?` · depois: ${esc(nb.label.toLowerCase())} às ${hm(nb.a)}`:""}</div></div></section>`;
  for(const f of live)h+=`<section class="win flash"><div class="tab"><span>Missão relâmpago</span></div><div class="bd"><p class="txt">${esc(f.text)}</p><p class="quiet"><span data-fexp="${f.exp}"></span> · +${f.xp} XP · não tira ponto</p>
    <div class="btns"><button class="btn solid full xl" data-do="flash" data-v="${f.id}" style="background:var(--gold);border-color:var(--gold);color:#1a1000">Feito</button></div></div></section>`;
  const gnow=(t.gev||[]).find(g=>now>=g.a&&now<g.b);const sug=S.paused||gnow?[]:due.filter(m=>suggested(m,now)).sort((a,b)=>win(a).end-win(b).end);
  if(S.paused)h+=`<section class="win"><div class="tab"><span>Sistema pausado</span></div><div class="bd"><p class="quiet">${S.paused.until?`Até ${fmt(S.paused.until)}`:"Até você voltar"}. Nenhuma missão tira ponto e a sequência fica congelada.</p><div class="btns"><button class="btn solid full" data-do="resume">Retomar agora</button></div></div></section>`;
  if(gnow&&!S.paused)h+=`<section class="win"><div class="bd"><p class="quiet">Compromisso da agenda: <b style="color:var(--ink)">${esc(gnow.t)}</b> até ${hm(gnow.b)}. O Sistema espera você terminar.</p></div></section>`;
  if(S.integ.gcal&&S.integ.gsyncDate!==t.date)h+=`<div class="btns" style="margin:0 0 14px"><button class="btn full" data-do="gsync">Sincronizar Google Agenda de hoje</button></div>`;
  if(b&&b.id==="trabalho"&&!S.paused&&!gnow)h+=`<section class="win"><div class="bd"><p class="quiet">Modo trabalho. O Sistema só chama para missões relâmpago rápidas.</p>${sug.length?"":`${nextTxt(due,now)}`}</div></section>`;
  if(b&&b.id==="sono"&&!sug.length)h+=`<section class="win"><div class="bd"><p class="quiet">Descanse. ${nextTxt(due,now)}</p></div></section>`;
  if(S.paused||gnow){}else if(sug.length)h+=`<section class="win"><div class="tab"><span>Para agora</span></div><div class="bd">${sug.map(card).join("")}</div></section>`;
  else if(b&&!["trabalho","sono"].includes(b.id))h+=`<section class="win"><div class="bd"><p class="quiet">Nada pendente para este momento.</p>${nextTxt(due,now)}</div></section>`;
  const c=challenge(S.trail);
  h+=`<section class="win sp"><div class="tab"><span>${c.boss?"Chefe do andar":"Missão especial"}</span></div><div class="bd"><p class="ttl">${t.sp?"Concluída. O próximo desafio abre amanhã.":esc(c.text)}</p>
    ${t.sp?"":`<div style="display:flex;gap:8px;justify-content:center"><span class="tag">${esc(c.cat)} · andar ${c.t}</span><span class="tag g">+${c.xp} XP extra</span></div><div class="btns"><button class="btn full" data-do="spopen" style="border-color:var(--gold);color:var(--gold)">Ver desafio</button></div>`}</div></section>`;
  h+=`<section class="win"><div class="tab"><span>Plano do dia</span></div><div class="bd">${bl.filter(x=>x.id!=="sono").map((x,k)=>{const idx=bl.indexOf(x),ms=due.filter(m=>homeBlock(m,bl)===idx);const fl=t.flash.filter(f=>f.at>=x.a&&f.at<x.b),gv=(t.gev||[]).filter(g=>g.a>=x.a&&g.a<x.b);
    return`<div class="blk ${idx<i?"past":idx===i?"cur":""}"><span class="tm">${hm(x.a)}</span><div><div class="lb">${esc(x.label)}</div>${ms.length||fl.length||gv.length?`<div class="mchips">${ms.map(m=>{const e=ent(m),st=e.done?"done":e.failed?"fail":e.excused?"exc":"";
      return`<button class="mchip ${st}" data-do="open" data-id="${m.id}">${e.done?"✓ ":e.failed?"✕ ":""}${esc(m.kind==="qty"?`${m.name} ${num(ent(m).value||0)}/${num(m.target)}`:m.kind==="wake"?"Acordar":m.kind==="sleep"?"Dormir":m.name)}</button>`}).join("")}${fl.length?`<span class="mchip fl">${fl.filter(f=>f.st==="done").length}/${fl.length} relâmpagos</span>`:""}${gv.map(g=>`<span class="mchip ev">${hm(g.a)} ${esc(g.t)}</span>`).join("")}</div>`:""}</div></div>`}).join("")}
    <p class="warn" style="margin-top:10px">Rotina não cumprida até o prazo tira pontos e zera a sequência.</p></div></section>`;
  if(S.demo)h+=`<div class="demo"><span>Modo demo · relógio simulado <b id="clk"></b> · ${fmt(t.date)}</span><button class="btn" data-do="jump">Próximo momento</button><button class="btn" data-do="adv" data-v="15">+15 min</button><button class="btn" data-do="adv" data-v="60">+1 h</button><button class="btn" data-do="nextday">Próximo dia</button></div>`;
  return h}
function homeBlock(m,bl){const w=win(m);if(isFixed(m)){const k=bl.findIndex(b=>w.start>=b.a&&w.start<b.b);return k<0?bl.length-1:k}
  if(m.ctx==="any")return bl.findIndex(b=>b.id!=="sono");const k=bl.findIndex(b=>b.id===m.ctx);if(k>=0)return k;return bl.findIndex(b=>b.id==="noite"||b.id==="livre")}
function nextTxt(due,now){const n=due.filter(m=>!resolved(ent(m))&&win(m).open>now).sort((a,b)=>win(a).open-win(b).open)[0];return n?`<p class="quiet" style="margin-top:6px">Próxima: ${esc(title(n))} às ${hm(isFixed(n)?win(n).start:win(n).open)}</p>`:""}
function viewTrilha(){const cur=S.trail,floors=Math.floor(cur/5)+2,X=[0,56,84,56,0];let h=`<section class="win"><div class="bd" style="text-align:center"><p style="margin:0">Um desafio por dia. A cada 5, um chefe. Cada andar deixa tudo mais difícil.</p><p class="mute" style="margin:6px 0 0">${cur} concluídos · andar ${Math.floor(cur/5)+1}</p></div></section>`;

function readSched(){const g=i=>$("#"+i)?.value;const w={wake:g("hWake"),leave:g("hLeave"),workStart:g("hWs"),workEnd:g("hWe"),lunch:g("hLu"),lunchDur:Math.max(15,+g("hLd")||60),gym:g("hGym"),gymDur:Math.max(20,+g("hGd")||90),sleep:g("hSl")};
  const o=[w.wake,w.leave,w.workStart,w.lunch].map(toMin);if(!(o[0]<o[1]&&o[1]<o[2]&&o[2]<o[3]&&o[3]+w.lunchDur<toMin(w.workEnd)&&toMin(w.workEnd)<toMin(w.sleep))){$("#hErr").textContent="Os horários precisam seguir a ordem do dia: acordar, sair, trabalho, almoço, saída e dormir.";return null}
  if(toMin(w.sleep)<toMin("20:00")){$("#hErr").textContent="O horário de dormir precisa ser entre 20:00 e 23:59.";return null}return w}

  $("#view").innerHTML=`<div style="min-height:80vh;display:grid;place-items:center"><section class="win" style="width:100%;max-width:420px"><div class="tab"><span>Notificação</span></div><div class="bd" style="text-align:center;padding:24px 16px">${b}</div></section></div>`}

  $("#view").innerHTML=tab==="agora"?viewAgora():tab==="trilha"?viewTrilha():tab==="status"?viewStatus():viewRotina();

function live(){const now=vmin();document.querySelectorAll("[data-end]").forEach(el=>{const s=(+el.dataset.end-now)*60;el.textContent=`prazo ${dur(s)}`;el.classList.toggle("late",s<1800)});
  document.querySelectorAll("[data-fexp]").forEach(el=>el.textContent=`expira em ${dur((+el.dataset.fexp-now)*60)}`);const k=$("#clk");if(k)k.textContent=hm(now)}

/* sheets */
function openMission(id){const m=M(id),e=ent(m),w=win(m);let h=`<h3>${esc(title(m))}</h3><div class="chips" style="margin-bottom:12px"><span class="tag">${STATS[m.stat]}</span><span class="tag">${whenTxt(m)}</span><span class="tag g">+${m.xp}</span>${lossTag(m)}</div>`;
  if(e.done)h+=`<p style="color:var(--ok)">Feita às ${e.at}${m.kind==="presence"&&e.value?` · ${e.value} min`:""}. +${e.xp} XP.</p>`;
  else if(e.failed)h+=`<p style="color:var(--red)">O prazo terminou às ${hm(w.end)}. −${m.loss} XP.</p>`;
  else if(e.excused)h+=`<p class="mute">${e.shield?"Protegida com escudo.":e.late?"O horário já tinha passado quando você começou.":"Não teve hoje. Sem perda."}</p>`;
  if(!resolved(e)&&canAct(m)){
    if(m.kind==="qty"){const v=e.value||0;h+=`<p style="margin:0">Hoje: <b class="disp" style="font-size:1.3rem;color:var(--glow)">${num(v)}/${num(m.target)}</b> ${esc(m.unit)}</p><div class="bar" style="margin:8px 0 14px"><i style="width:${Math.min(100,v/m.target*100)}%"></i></div>
      <div style="display:flex;gap:10px;align-items:center">${stepper("qv",m.steps[0],false,m.steps[0])}<span class="mute">${esc(m.unit)}</span></div><div class="btns"><button class="btn solid full" data-do="addv" data-id="${m.id}">Adicionar</button>${v>0?`<button class="btn ghost full" data-do="add" data-id="${m.id}" data-v="-${m.steps[0]}">Corrigir: −${num(m.steps[0])}</button>`:""}</div>`}
    else if(m.kind==="presence"&&e.asking)h+=`<p style="margin:0 0 8px">Quanto tempo durou?</p><div style="display:flex;gap:10px;align-items:center">${stepper("pm",m.lastMin||60,false,5)}<span class="mute">min</span></div><div class="btns"><button class="btn solid full" data-do="pres2" data-id="${m.id}">Registrar presença</button></div>`;
    else h+=inlineActs(m)}
  else if(!resolved(e))h+=`<p class="mute">Libera às ${hm(w.open)}.</p>`;
  if(e.done&&!e.logged)h+=`<div class="btns"><button class="btn ghost full" data-do="undo" data-id="${m.id}">Marquei errado: desfazer (−${e.xp} XP)</button></div>`;
  if(m.kind==="gym"&&e.done&&!e.logged)h+=`<div class="btns"><button class="btn full" data-do="gymlog" data-id="${m.id}">Registrar cargas (+10 XP, opcional)</button></div>`;
  if(!resolved(e))h+=`<div class="btns"><button class="btn ghost full" data-do="shield" data-id="${m.id}" ${S.week.shields<1?"disabled":""}>Usar escudo · sem perda (${S.week.shields} na semana)</button></div>`;
  openSheet(h+`<div class="btns"><button class="btn ghost full" data-do="close">Fechar</button></div>`,id)}
function openGym(id){const m=M(id);openSheet(`<h3>Cargas de hoje</h3><p class="mute" style="margin:0">Já vem com as repetições do último treino. Bateu o máximo em todas as séries? O peso sobe.</p>
  ${m.exercises.map((x,i)=>`<div class="ex"><div style="display:flex;justify-content:space-between"><b>${esc(x.name)}</b><span class="disp" style="color:var(--glow)">${x.weight} kg</span></div><div class="mute">${x.sets} séries · ${x.min} a ${x.max} repetições</div>
  <div class="sets">${Array.from({length:x.sets},(_,k)=>stepper(`g${i}_${k}`,x.last&&x.last[k]!=null?x.last[k]:x.min,true)).join("")}</div></div>`).join("")}
  <div class="btns"><button class="btn solid full" data-do="gymsave" data-id="${id}">Salvar cargas</button><button class="btn ghost full" data-do="close">Agora não</button></div>`)}
function openSpecial(){const c=challenge(S.trail);openSheet(`<h3>${c.boss?"Chefe do andar":"Missão especial"}</h3><div class="chips" style="margin-bottom:12px"><span class="tag">${esc(c.cat)}</span><span class="tag">Andar ${c.t}</span><span class="tag g">+${c.xp} XP</span></div>
  <p style="font-size:1.15rem;margin:0 0 6px"><b>${esc(c.text)}</b></p><p class="mute">Opcional: não tira pontos, mas a trilha só avança quando você cumpre. Cada andar fica mais difícil.</p>
  <div class="btns">${S.today.sp?`<p style="color:var(--ok);text-align:center">Concluída hoje. O próximo abre amanhã.</p>`:`<button class="btn solid full xl" data-do="sp">Concluí o desafio</button>`}<button class="btn ghost full" data-do="close">Fechar</button></div>`)}
function openEdit(id){draft=id?clone(M(id)):mk({name:"",kind:"check",stat:"PER",ctx:"any",isNew:true});
  Object.assign(draft,{unit:draft.unit||"un",target:draft.target||1,steps:draft.steps||[1],since:draft.since||[],lastMin:draft.lastMin||60,time:draft.time||"19:00",until:draft.until||"22:00",
    exercises:draft.exercises||[{name:"",weight:20,inc:2.5,sets:3,min:8,max:12,fails:0,last:null}]});confirmDel=false;renderEdit()}
function readEdit(){const g=i=>$("#"+i),d=draft;if(!g("eXp"))return;if(g("eName"))d.name=g("eName").value;if(g("eKind"))d.kind=g("eKind").value;d.stat=g("eStat").value;
  d.xp=Math.max(1,+g("eXp").value||1);d.loss=Math.max(0,+g("eLoss").value||0);if(g("eCtx"))d.ctx=g("eCtx").value;if(g("eFixed"))d.fixed=g("eFixed").value==="1";
  if(g("eTime")){d.time=g("eTime").value||"19:00";d.until=g("eUntil").value||"22:00"}
  if(g("eTarget")){d.target=Math.max(.01,+g("eTarget").value||1);d.unit=g("eUnit").value.trim()||"un";d.steps=g("eSteps").value.split(/[;\s]+/).map(x=>+x.replace(",", ".")).filter(x=>x>0).slice(0,3);if(!d.steps.length)d.steps=[1];d.auto=g("eAuto").checked}
  if(d.kind==="gym")d.exercises=d.exercises.map((x,i)=>({...x,name:g(`xn${i}`).value,weight:+g(`xw${i}`).value||0,inc:+g(`xi${i}`).value||0,sets:Math.max(1,Math.min(8,+g(`xs${i}`).value||1)),min:Math.max(1,+g(`xa${i}`).value||1),max:Math.max(1,+g(`xb${i}`).value||1)}))}
function renderEdit(){const d=draft,core=["wake","sleep"].includes(d.kind);let h=`<h3>${d.isNew?"Nova missão de rotina":"Editar missão"}</h3><div class="form" style="margin-top:10px">`;

    <label>Tipo<select id="eKind" data-re="1">${Object.entries(KINDS).map(([k,v])=>`<option value="${k}" ${d.kind===k?"selected":""}>${v}</option>`).join("")}</select></label>`;

      (d.fixed?`<div class="two"><label>Começa às<input id="eTime" type="time" value="${d.time}"></label><label>Prazo até<input id="eUntil" type="time" value="${d.until}"></label></div>`:
      `<label>O Sistema sugere<select id="eCtx">${Object.entries(CTX).map(([k,v])=>`<option value="${k}" ${d.ctx===k?"selected":""}>${v}</option>`).join("")}</select></label>`);
    else h+=`<p class="mute" style="margin:0">Horário da academia vem dos seus horários.</p>`;
    if(d.kind==="qty")h+=`<div class="two"><label>Meta por dia<input id="eTarget" type="number" step="0.25" value="${d.target}"></label><label>Unidade<input id="eUnit" value="${esc(d.unit)}"></label></div>
      <label>Botões rápidos (ex.: 5 10)<input id="eSteps" value="${d.steps.map(num).join(" ")}"></label><label class="check"><input type="checkbox" id="eAuto" ${d.auto?"checked":""}> Ajustar a meta sozinha pelo meu desempenho</label>`;
    if(d.kind==="gym")h+=`<div><div class="mute" style="margin-bottom:6px">Exercícios · nome, peso, aumento (kg) · séries, mín., máx.</div>${d.exercises.map((x,i)=>`

      <div class="exrow2"><input id="xs${i}" type="number" value="${x.sets}" aria-label="Séries"><input id="xa${i}" type="number" value="${x.min}" aria-label="Mínimo"><input id="xb${i}" type="number" value="${x.max}" aria-label="Máximo"></div>`).join("")}<button class="btn full" data-do="xadd">Adicionar exercício</button></div>`}
  h+=`<label>Dias</label><div class="days" style="margin-top:-8px">${DOW.map((x,i)=>`<button type="button" data-do="day" data-v="${i}" aria-pressed="${d.days.includes(i)}">${x}</button>`).join("")}</div>
  <label>Atributo que evolui<select id="eStat">${Object.entries(STATS).map(([k,v])=>`<option value="${k}" ${d.stat===k?"selected":""}>${v}</option>`).join("")}</select></label>
  <div class="two"><label>XP ao cumprir<input id="eXp" type="number" value="${d.xp}"></label><label>XP perdido se falhar<input id="eLoss" type="number" value="${d.loss}"></label></div>

  ${d.isNew||core?"":`<button class="btn red full" data-do="edel">${confirmDel?"Toque de novo para remover":"Remover da rotina"}</button>`}<button class="btn ghost full" data-do="close">Cancelar</button></div></div>`;openSheet(h)}

/* ---------- 9. Ações ---------- */
function commit(){save();render();if(sheetOpen&&sheetId)openMission(sheetId)}
function complete(m,extra=0,msg){const e=ent(m);if(resolved(e))return;e.done=true;e.at=hm(vmin());e.xp=m.xp+extra;addXP(e.xp,m.stat);log(`${title(m)}: feita. +${e.xp} XP.`);fx("ok");toast(msg||`${m.name} · +${e.xp} XP`)}
function addQty(m,n){const e=ent(m);if(resolved(e)&&!e.done)return;e.value=Math.max(0,+((e.value||0)+n).toFixed(2));
  if(!e.done&&e.value>=m.target)complete(m,0,`${m.name}: meta batida · +${m.xp} XP`);else if(!e.done){fx("ok");toast(`${m.name}: ${num(e.value)}/${num(m.target)} ${m.unit}`)}
  if(e.done&&!e.hidden&&e.value>=m.target*1.5){e.hidden=true;const b=Math.round(m.xp*.75);e.xp+=b;addXP(b,m.stat);log(`Foi além do exigido. Recompensa oculta: +${b} XP.`);setTimeout(()=>{fx("lvl");toast(`Recompensa oculta · +${b} XP`,"gold")},900)}}
const A={
  accept(){introStep=1;render();setTimeout(()=>$("#iName")?.focus(),50);tone([660,990])},
  refuse(){$("#refuse").textContent="O Sistema não aceita recusa.";fx("bad")},
  step2(){S.name=($("#iName").value.trim()||"Jogador").slice(0,30);introStep=2;render()},
  start(){const w=readSched();if(!w)return;Object.assign(S.sched.wd,w);S.missions=buildMissions({pages:Math.max(1,+$("#cPages").value||10),water:Math.max(.5,+$("#cWater").value||2.5)});
    S.accepted=true;S.today=newDay(vdate());S.week={key:weekKey(S.today.date),shields:1};const now=vmin();
    for(const m of dueToday()){const w2=win(m);if(now>=w2.end)Object.assign(ent(m),{excused:true,late:true});else if(isFixed(m)&&now>=w2.start)ent(m).pinged=true}
    tick(now,true);log(`${S.name} se tornou um Jogador.`);save();fx("lvl");render();
    queue({k:"msg",tab:"Missão diária",title:"Missão diária chegou",lines:["A tela Agora mostra onde você está no dia e só o que cabe nesse momento.","No trabalho o Sistema fica quieto e só manda missões relâmpago.","Na demo, use “Próximo momento” para ver o dia passar."]})},
  open:b=>openMission(b.dataset.id),close:closeSheet,
  st(b){const i=$("#"+b.dataset.t);i.value=Math.max(0,+((+i.value||0)+ +b.dataset.d).toFixed(2))},
  done(b){const m=M(b.dataset.id);if(!canAct(m))return;complete(m,0,m.kind==="gym"?`Presença na academia · +${m.xp} XP`:m.kind==="sleep"?`Boa noite · +${m.xp} XP`:null);commit();if(m.kind==="gym")setTimeout(()=>openGym(m.id),350)},
  add(b){const m=M(b.dataset.id);if(!canAct(m))return;addQty(m,+b.dataset.v);commit()},
  addv(b){const m=M(b.dataset.id),v=+$("#qv").value;if(v>0){addQty(m,v);commit()}},
  pres(b){ent(M(b.dataset.id)).asking=true;openMission(b.dataset.id)},
  pres2(b){const m=M(b.dataset.id),v=Math.max(1,+$("#pm").value||1),e=ent(m);m.lastMin=v;e.asking=false;e.value=v;closeSheet();complete(m,Math.floor(v/15)*5,`${m.name}: ${v} min · presença registrada`);commit()},
  cancel(b){const m=M(b.dataset.id);Object.assign(ent(m),{excused:true});log(`${m.name}: não teve hoje. Sem perda.`);closeSheet();commit()},
  shield(b){const m=M(b.dataset.id),e=ent(m);if(S.week.shields<1||resolved(e))return;Object.assign(e,{excused:true,shield:true});S.week.shields--;log(`Escudo usado em ${m.name}.`);toast("Escudo ativado · sem perda de pontos");closeSheet();commit()},
  flash(b){const f=S.today.flash.find(x=>x.id===b.dataset.v);if(!f||f.st!=="live")return;f.st="done";addXP(f.xp,f.stat);log(`Relâmpago: ${f.text}. +${f.xp} XP.`);fx("ok");toast(`Relâmpago · +${f.xp} XP`,"gold");
    const lk=f.link&&M(f.link);if(lk&&dueOn(lk,S.today.date)&&!resolved(ent(lk)))addQty(lk,f.link==="water"?.25:2);commit()},
  gymlog:b=>openGym(b.dataset.id),
  gymsave(b){const m=M(b.dataset.id),e=ent(m),notes=[];let top=true;
    m.exercises.forEach((ex,i)=>{const r=Array.from({length:ex.sets},(_,k)=>+$(`#g${i}_${k}`).value||0);ex.last=r;const ok=r.every(x=>x>=ex.min),t=r.every(x=>x>=ex.max);if(!t)top=false;
      if(t){ex.weight=+(ex.weight+ex.inc).toFixed(1);ex.fails=0;ex.last=r.map(()=>ex.min);notes.push(`${ex.name}: sobe para ${ex.weight} kg`)}
      else if(!ok){ex.fails++;if(ex.fails>=2){ex.weight=+(ex.weight*.9).toFixed(1);ex.fails=0;ex.last=r.map(()=>ex.min);notes.push(`${ex.name}: ajusta para ${ex.weight} kg`)}}else ex.fails=0});
    e.logged=true;const bx=top?20:10;e.xp+=bx;addXP(bx,m.stat);log(`Cargas registradas. +${bx} XP.`);notes.forEach(n=>log(`Progressão · ${n}.`));closeSheet();fx("ok");toast(`Cargas registradas · +${bx} XP`);save();render();
    if(notes.length)queue({k:"msg",tab:"Progressão",title:"O Sistema ajustou seu treino",lines:notes})},
  spopen:openSpecial,
  sp(){if(S.today.sp)return;const c=challenge(S.trail);S.today.sp=true;S.trail++;S.trailLog.push({n:c.n,date:S.today.date,text:c.text});addXP(c.xp,c.stat);
    log(`Missão especial${c.boss?" (chefe)":""}: ${c.text}. +${c.xp} XP.`);closeSheet();save();render();fx("lvl");
    queue({k:"msg",tab:c.boss?"Chefe derrotado":"Missão especial",title:c.boss?`Andar ${c.t} concluído`:"Desafio concluído",lines:[`+${c.xp} XP`,c.boss?`O andar ${c.t+1} foi liberado. Os desafios ficam mais difíceis.`:"Próximo desafio amanhã."]})},
  node(b){const n=+b.dataset.v;if(n===S.trail)openSpecial();else if(n<S.trail){const r=S.trailLog.find(x=>x.n===n);toast(r?`${fmt(r.date)}: ${r.text}`:"Concluído")}else toast("Bloqueado. Um desafio por dia.")},
  adv(b){S.offset+=(+b.dataset.v)*60000;loop();save();render()},
  jump(){const now=vmin(),t=S.today,bl=blocks(t.date);const c=[...bl.map(b=>b.a),...t.flash.filter(f=>f.st==="wait").map(f=>f.at),...dueToday().filter(m=>!resolved(ent(m))).flatMap(m=>{const w=win(m);return[w.start,w.end]})].filter(x=>x>now+.5).sort((a,b)=>a-b)[0];
    const target=c==null?1440:c;S.offset+=(target-now)*60000+2000;loop();save();render()},
  nextday(){const n=vnow(),mid=new Date(n);mid.setHours(24,0,5,0);S.offset+=mid-n;loop();save();render()},
  report:b=>askReport(b),
  undo(b){const m=M(b.dataset.id),e=ent(m);if(!e.done||e.logged)return;addXP(-(e.xp||0),m.stat);Object.assign(e,{done:false,xp:0,hidden:false,auto:false,asking:false});if(m.kind==="qty"||m.kind==="presence")e.value=0;
    log(`${title(m)}: desfeita.`);toast("Desfeito");closeSheet();commit()},
  pause(b){const v=+b.dataset.v;S.paused={from:S.today.date,until:v>0?addDays(S.today.date,v-1):null};log(v?`Sistema pausado por ${v} dia(s).`:"Sistema pausado até você voltar.");save();render();toast("Sistema pausado · sem perdas")},
  resume(){S.paused=null;const now=vmin();for(const m of dueToday()){const e=ent(m);if(!resolved(e)&&now>=win(m).end)Object.assign(e,{excused:true,late:true})}
    S.today.flash=genFlash(S.today.date).filter(f=>f.at>now);log("Sistema retomado.");save();render();toast("Sistema retomado")},
  copy(b){const v=b.dataset.v;(navigator.clipboard?navigator.clipboard.writeText(v):Promise.reject()).then(()=>toast("Link copiado")).catch(()=>{prompt("Copie o link:",v)})},
  ics(){const f=new File([buildICS()],"evolucao.ics",{type:"text/calendar"});if(navigator.canShare&&navigator.canShare({files:[f]}))navigator.share({files:[f],title:"Evolução · rotina"}).catch(()=>{});else A.icsopen()},
  icsopen(){location.href="data:text/calendar;charset=utf-8,"+encodeURIComponent(buildICS())},
  mail(){const to=($("#iEmail")?.value||S.integ.email||"").trim();S.integ.email=to;save();
    location.href=`mailto:${encodeURIComponent(to)}?subject=${encodeURIComponent(`Evolução · semana até ${fmt(S.today.date)}`)}&body=${encodeURIComponent(weekSummary())}`},
  gymhere(){if(!navigator.geolocation)return toast("Localização indisponível neste aparelho","red");toast("Pegando sua localização…");
    navigator.geolocation.getCurrentPosition(p=>{S.integ.gymLoc={lat:p.coords.latitude,lng:p.coords.longitude};log("Local da academia salvo.");save();render();toast("Local da academia salvo")},
    ()=>toast("Permita a localização para o Evolução nos Ajustes do iPhone","red"),{enableHighAccuracy:true,timeout:15000})},
  gsync(){const v=$("#iGcid")?.value.trim();if(v!=null&&v!==S.integ.gcid){S.integ.gcid=v;save()}gConnect()},
  ghelp(){openSheet(`<h3>Client ID do Google (grátis)</h3><p class="mute">Configuração única, melhor fazer no computador.</p>
    <p>1. Acesse console.cloud.google.com e crie um projeto chamado Evolução.</p><p>2. Em APIs e serviços → Biblioteca, ative a Google Calendar API.</p>
    <p>3. Em Tela de consentimento OAuth, escolha Externo, preencha nome e e-mail e adicione seu próprio e-mail em Usuários de teste.</p>
    <p>4. Em Credenciais → Criar credenciais → ID do cliente OAuth → Aplicativo da Web. Em Origens JavaScript autorizadas, coloque <b>https://daelton.github.io</b>.</p>
    <p>5. Copie o ID do cliente (termina com .apps.googleusercontent.com), cole aqui e toque em Conectar.</p>
    <p class="mute">O acesso é só de leitura da agenda. O login vale por 1 hora; depois, um toque em Sincronizar renova.</p>
    <div class="btns"><button class="btn ghost full" data-do="close">Fechar</button></div>`)},
  export(){const blob=new Blob([JSON.stringify(S)],{type:"application/json"}),f=new File([blob],`evolucao-backup-${S.today.date}.json`,{type:"application/json"});
    if(navigator.canShare&&navigator.canShare({files:[f]}))navigator.share({files:[f],title:"Backup Evolução"}).catch(()=>{});
    else{const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=f.name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}},
  importb(){$("#impFile").click()},
  golive(){if(!confirmLive){confirmLive=true;render();return}const keep={name:S.name,sched:S.sched,missions:S.missions,sound:S.sound};S=Object.assign(defaultState(),keep,{accepted:true,demo:false,offset:0});
    for(const m of S.missions){if(m.since)m.since=[];if(m.exercises)m.exercises.forEach(x=>{x.fails=0})}
    S.today=newDay(vdate());const now=vmin();for(const m of dueToday()){const w=win(m);if(now>=w.end)Object.assign(ent(m),{excused:true,late:true});else if(isFixed(m)&&now>=w.start)ent(m).pinged=true}
    tick(now,true);log(`${S.name} começou para valer.`);confirmLive=false;tab="agora";save();render();fx("lvl");queue({k:"msg",tab:"Sistema",title:"Agora é para valer",lines:["Relógio real ativado. Seu progresso fica salvo na sua conta."]})},
  reset(){if(!confirmReset){confirmReset=true;render();return}S=defaultState();confirmReset=false;introStep=0;tab="agora";save();render()},
  edit:b=>openEdit(b.dataset.id),new:()=>openEdit(null),
  day(b){readEdit();const v=+b.dataset.v;draft.days=draft.days.includes(v)?draft.days.filter(x=>x!==v):[...draft.days,v].sort();renderEdit()},
  xadd(){readEdit();draft.exercises.push({name:"",weight:10,inc:2.5,sets:3,min:8,max:12,fails:0,last:null});renderEdit()},
  xdel(b){readEdit();draft.exercises.splice(+b.dataset.v,1);renderEdit()},
  esave(){readEdit();const d=draft,err=t=>$("#eErr").textContent=t;
    if(!["wake","sleep"].includes(d.kind)&&!d.name.trim())return err("Dê um nome para a missão.");if(!d.days.length)return err("Escolha pelo menos um dia.");
    if(d.fixed&&toMin(d.until)<=toMin(d.time))return err("O prazo precisa ser depois do início.");
    if(d.kind==="gym"){d.exercises=d.exercises.filter(x=>x.name.trim());if(!d.exercises.length)return err("Adicione pelo menos um exercício.");for(const x of d.exercises)if(x.max<x.min)return err(`${x.name}: máximo menor que o mínimo.`)}
    if(d.kind==="gym"&&S.missions.some(m=>m.kind==="gym"&&m.id!==d.id))return err("Já existe uma missão de academia.");
    if(d.kind==="gym")d.id="gym";d.name=(d.name||"").trim();const isNew=d.isNew;delete d.isNew;delete d.asking;
    if(isNew)S.missions.push(d);else S.missions=S.missions.map(m=>m.id===d.id?d:m);log(isNew?`Nova missão: ${d.name}.`:`Missão editada: ${title(d)}.`);save();closeSheet();render();toast(isNew?"Missão adicionada":"Salvo")},
  edel(){if(!confirmDel){confirmDel=true;readEdit();renderEdit();return}S.missions=S.missions.filter(x=>x.id!==draft.id);log(`Missão removida: ${draft.name}.`);save();closeSheet();render()},
  sched(){openSheet(`<h3>Seus horários</h3>${schedForm()}<div class="btns"><button class="btn solid full" data-do="schedsave">Salvar horários</button><button class="btn ghost full" data-do="close">Cancelar</button></div>`)},
  wday(b){const v=+b.dataset.v,w=S.sched.work;S.sched._draft=S.sched._draft||w.slice();const d=S.sched._draft;const i=d.indexOf(v);i>=0?d.splice(i,1):d.push(v);d.sort();b.setAttribute("aria-pressed",d.includes(v))},
  schedsave(){const w=readSched();if(!w)return;const we={wake:$("#hWw").value||"08:30",sleep:$("#hWs2").value||"23:30"};if(toMin(we.sleep)<toMin("20:00")||toMin(we.wake)>=toMin("12:00")){$("#hErr").textContent="Fim de semana: acordar antes de 12:00 e dormir entre 20:00 e 23:59.";return}
    Object.assign(S.sched.wd,w);S.sched.we=we;if(S.sched._draft){S.sched.work=S.sched._draft;delete S.sched._draft}
    const now=vmin();for(const m of dueToday()){const e=ent(m);if(!resolved(e)&&now>=win(m).end)Object.assign(e,{excused:true,late:true})}
    S.today.flash=S.today.flash.filter(f=>f.st!=="wait").concat(genFlash(S.today.date).filter(f=>f.at>now));
    log("Horários atualizados.");save();closeSheet();render();toast("Horários salvos")}
};
/* ---------- Integrações ---------- */
function nextDow(from,d){return addDays(from,(d-dow(from)+7)%7)}
function icsEsc(x){return String(x).replace(/\\/g,"\\\\").replace(/[;,]/g,m=>"\\"+m).replace(/\n/g,"\\n")}
function buildICS(){const base=location.origin+location.pathname,BY=["SU","MO","TU","WE","TH","FR","SA"],today=S.today.date,LINK={wake:"acordei",sleep:"dormir",gym:"academia",water:"agua",read:"ler&v=10"},G={};
  const put=(key,o,d)=>{(G[key]=G[key]||Object.assign(o,{days:[]})).days.push(d)};
  for(const m of S.missions)for(const d of m.days){const date=nextDow(today,d),w=win(m,date);let a,b;
    if(isFixed(m)){a=w.start;b=Math.max(a+15,Math.min(w.end,a+60))}else{if(m.ctx==="any")continue;const bl=blocks(date),x=bl.find(x=>x.id===m.ctx)||bl.find(x=>x.id==="noite"||x.id==="livre");if(!x)continue;a=x.a;b=Math.min(x.b,a+60)}
    put(`${m.id}|${a}|${b}`,{m,a,b},d)}
  for(const d of ALL){const SL=toMin(daySched(nextDow(today,d)).sleep);put(`fechamento|${SL-45}`,{m:null,a:SL-45,b:SL-30},d)}
  const st=new Date().toISOString().replace(/[-:]/g,"").slice(0,15)+"Z",dt=(date,min)=>date.replace(/-/g,"")+"T"+hm(min).replace(":","")+"00";
  const L=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Evolucao//PT-BR","CALSCALE:GREGORIAN","METHOD:PUBLISH","X-WR-CALNAME:Evolução"];
  for(const k in G){const g=G[k],first=g.days.map(d=>nextDow(today,d)).sort()[0],m=g.m;
    const sum=m?(m.kind==="qty"?`${m.name} ${num(m.target)} ${m.unit}`:m.kind==="wake"?"Acordar":m.kind==="sleep"?"Dormir no horário":m.name):"Fechamento do dia";
    const url=m&&LINK[m.id]?`${base}?acao=${LINK[m.id]}`:base;
    const desc=m?`Missão de rotina · +${m.xp} XP / −${m.loss} XP se falhar. Toque no link para marcar: ${url}`:`Veja o que falta antes de dormir: ${url}`;
    L.push("BEGIN:VEVENT",`UID:${k.replace(/\|/g,"-")}@evolucao`,`DTSTAMP:${st}`,`DTSTART:${dt(first,g.a)}`,`DTEND:${dt(first,g.b)}`,`RRULE:FREQ=WEEKLY;BYDAY=${g.days.map(d=>BY[d]).join(",")}`,
      `SUMMARY:${icsEsc("⚔ "+sum)}`,`DESCRIPTION:${icsEsc(desc)}`,`URL:${url}`,"BEGIN:VALARM","ACTION:DISPLAY",`DESCRIPTION:${icsEsc(sum)}`,"TRIGGER:-PT0M","END:VALARM","END:VEVENT")}
  L.push("END:VCALENDAR");return L.join("\r\n")}
function weekSummary(){const h=S.history.slice(-7),sum=k=>h.reduce((s,x)=>s+(x[k]||0),0),due=sum("due"),done=sum("done"),dates=new Set(h.map(x=>x.date)),fails={};
  S.log.filter(l=>/prazo encerrado/.test(l.t)&&dates.has(l.d)).forEach(l=>{const n=l.t.split(": prazo")[0];fails[n]=(fails[n]||0)+1});
  const worst=Object.entries(fails).sort((a,b)=>b[1]-a[1]).slice(0,2);
  return[`Relatório semanal · ${S.name||"Jogador"}`,"",`Nível ${S.level} · Rank ${S.rank} (${TITLE[S.rank]})`,`Rotina: ${done}/${due} missões (${due?Math.round(done/due*100):0}%)`,
    `Sequência: ${S.streak} dia(s) · recorde ${S.best}`,`Relâmpagos: ${sum("fd")}/${sum("fl")}`,`Missões especiais: ${h.filter(x=>x.sp).length} · trilha no andar ${Math.floor(S.trail/5)+1}`,
    worst.length?`Mais falhou: ${worst.map(([n,c])=>`${n} (${c}x)`).join(", ")}`:"Nenhuma falha de rotina na semana.",
    `Metas atuais: ${S.missions.filter(m=>m.kind==="qty").map(m=>`${m.name} ${num(m.target)} ${m.unit}`).join(", ")}`,
    `Academia: ${(M("gym")?.exercises||[]).map(x=>`${x.name} ${x.weight} kg`).join(", ")}`,"",`Abrir o app: ${location.origin+location.pathname}`].join("\n")}
let lastGeo=0;
function geoCheck(){const I=S.integ;if(!I.gymLoc||S.paused||document.hidden||!navigator.geolocation||Date.now()-lastGeo<180000)return;const g=M("gym");
  if(!g||!dueOn(g,S.today.date)||S.today.date!==vdate())return;const e=ent(g);if(resolved(e)||!canAct(g))return;lastGeo=Date.now();
  navigator.geolocation.getCurrentPosition(p=>{const R=6371e3,r=x=>x*Math.PI/180,dl=r(p.coords.latitude-I.gymLoc.lat),dn=r(p.coords.longitude-I.gymLoc.lng),
    a=Math.sin(dl/2)**2+Math.cos(r(I.gymLoc.lat))*Math.cos(r(p.coords.latitude))*Math.sin(dn/2)**2,dist=2*R*Math.asin(Math.sqrt(a));
    if(dist<200&&!resolved(ent(g))){complete(g,0,`Detectei você na academia · +${g.xp} XP`);ent(g).auto=true;log("Presença na academia detectada pela localização.");commit();setTimeout(()=>openGym(g.id),700)}},()=>{},{enableHighAccuracy:true,timeout:15000,maximumAge:60000})}
let gTok=null,gExp=0;
function gLoad(){return new Promise((res,rej)=>{if(window.google&&google.accounts&&google.accounts.oauth2)return res();const x=document.createElement("script");x.src="https://accounts.google.com/gsi/client";x.onload=res;x.onerror=rej;document.head.appendChild(x)})}
async function gConnect(){if(!S.integ.gcid)return toast("Cole o Client ID do Google primeiro","red");if(gTok&&Date.now()<gExp)return gFetch();
  try{await gLoad()}catch(e){return toast("Não consegui carregar o login do Google","red")}
  try{google.accounts.oauth2.initTokenClient({client_id:S.integ.gcid,scope:"https://www.googleapis.com/auth/calendar.readonly",
    callback:r=>{if(r.error){toast("Google recusou: "+r.error,"red");return}gTok=r.access_token;gExp=Date.now()+((+r.expires_in||3600)-60)*1000;S.integ.gcal=true;save();gFetch()},
    error_callback:()=>toast("Login do Google cancelado ou bloqueado","red")}).requestAccessToken()}catch(e){toast("Client ID inválido","red")}}
async function gFetch(){const d=S.today.date,t0=new Date(d+"T00:00:00"),t1=new Date(d+"T23:59:59");
  try{const r=await fetch(`https://www.googleapis.com/calendar/v3/calendars/primary/events?singleEvents=true&orderBy=startTime&maxResults=30&timeMin=${encodeURIComponent(t0.toISOString())}&timeMax=${encodeURIComponent(t1.toISOString())}`,{headers:{Authorization:"Bearer "+gTok}});
    if(r.status===401){gTok=null;return toast("Login do Google expirou. Toque em Sincronizar de novo.","red")}if(!r.ok)throw 0;const j=await r.json(),mm=x=>x.getHours()*60+x.getMinutes();
    S.today.gev=(j.items||[]).filter(x=>x.status!=="cancelled"&&x.start&&x.start.dateTime).map(x=>{const a=new Date(x.start.dateTime),b=new Date(x.end.dateTime);return{t:String(x.summary||"Compromisso").slice(0,40),a:mm(a),b:Math.max(mm(a)+5,b.toDateString()!==a.toDateString()?1439:mm(b))}});
    S.integ.gsync=Date.now();S.integ.gsyncDate=d;log(`Agenda sincronizada: ${S.today.gev.length} compromisso(s) hoje.`);save();render();toast(`Agenda: ${S.today.gev.length} compromisso(s) hoje`)}
  catch(e){toast("Não consegui ler a Google Agenda","red")}}
async function askReport(btn){btn.disabled=true;btn.textContent="Analisando sua semana…";
  const data={nivel:S.level,rank:S.rank,sequencia:S.streak,trilha:S.trail,relampagosPorDia:S.flashRate,horarios:S.sched,rotina:S.missions.map(m=>`${title(m)} (${isFixed(m)?"horário fixo":CTX[m.ctx]})`),
    ultimosDias:S.history.slice(-14).map(h=>`${h.date}: rotina ${h.done}/${h.due}, relâmpagos ${h.fd||0}/${h.fl||0}${h.sp?", especial":""}`),registro:S.log.slice(0,30).map(l=>`${l.d} ${l.h} ${l.t}`)};
  try{const r=await sampleFn.json(`Você é "o Sistema" de Solo Leveling analisando a rotina real de um jogador que trabalha em horário comercial. Direto, honesto, motivador sem exagero, em português. Sem conselho médico. Procure padrões concretos: em que momento do dia (manhã, ônibus, almoço, noite) ele mais falha, quais missões são fracas, se os relâmpagos funcionam. Dados: ${JSON.stringify(data)}. Responda somente JSON: {"resumo":"2 frases","observacoes":["até 3 observações concretas"],"sugestao":"1 ajuste prático para a próxima semana"}`,{modelTier:"default"});
    if(!r||!r.resumo)throw{};S.report={date:S.today.date,resumo:String(r.resumo),obs:(r.observacoes||[]).slice(0,3).map(String),sug:String(r.sugestao||"")};save();render()}
  catch(e){if(e&&e.code==="not_granted"){sampleFn=null;render();return}btn.disabled=false;btn.textContent="Gerar relatório";toast("Sem resposta do Sistema. Tente de novo.")}}

$("#nav").onclick=e=>{const b=e.target.closest("button");if(!b)return;tab=b.dataset.tab;confirmReset=false;confirmLive=false;render();scrollTo(0,0)};
document.addEventListener("click",e=>{const b=e.target.closest("[data-do]");if(!b||b.closest("#nav"))return;const f=A[b.dataset.do];if(f)f(b)});
document.addEventListener("change",e=>{const t=e.target;if(t.id==="impFile"&&t.files[0]){t.files[0].text().then(tx=>{try{const d=migrate(JSON.parse(tx));if(!d)throw 0;S=d;save();render();toast("Backup restaurado")}catch(x){toast("Arquivo de backup inválido","red")}});return}if(t.id==="sSound"){S.sound=t.checked;save()}if(t.id==="sDemo"){S.demo=t.checked;save()}
  if(t.id==="iEmail"){S.integ.email=t.value.trim();save()}if(t.id==="iGcid"){S.integ.gcid=t.value.trim();save()}if(t.id==="sName"){S.name=t.value.trim().slice(0,30);save();hud()}if(t.dataset.re&&draft){readEdit();renderEdit()}});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&sheetOpen){closeSheet();delete S.sched._draft}});
document.addEventListener("visibilitychange",()=>{if(!document.hidden)loop()});
function urlAction(){const q=new URLSearchParams(location.search);if(!q.toString())return;history.replaceState(null,"",location.pathname);if(!S.accepted)return;loop();
  const ac=(q.get("acao")||"").toLowerCase(),v=+(q.get("v")||0);const map={acordei:"wake",dormir:"sleep",academia:"gym",agua:"water",ler:"read"};
  const id=map[ac]||q.get("feito")||q.get("somar");const m=id&&M(id);if(!m){if(ac)toast("Ação do Atalho não reconhecida","red");return}
  if(!dueOn(m,S.today.date)){toast(`${m.name} não está na rotina de hoje`);return}const e=ent(m);if(resolved(e)&&!(m.kind==="qty"&&e.done)){toast(`${m.name} já foi resolvida hoje`);return}
  if(!canAct(m)){toast(`${m.name} libera às ${hm(win(m).open)}`,"red");return}
  if(m.kind==="qty"){addQty(m,v>0?v:m.steps[0])}else if(m.kind==="presence"){ent(m).asking=true;openMission(m.id);return}
  else{complete(m,0,m.kind==="gym"?`Presença na academia · +${m.xp} XP`:m.kind==="sleep"?`Boa noite · +${m.xp} XP`:null);if(m.kind==="gym")setTimeout(()=>openGym(m.id),600)}commit()}
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
setInterval(loop,1000);render();loop();urlAction();
